# One privileged pod in the node's network namespace, with the two Cilium paths the
# host-posture chart mounts (cilium.enabled=true), a state directory for the receipt,
# and the tools of the K8N-6 walk.
apiVersion: v1
kind: Pod
metadata: {name: tools, namespace: kube-system}
spec:
  hostNetwork: true
  hostPID: false
  nodeName: tnx-hr-control-plane
  tolerations: [{operator: Exists}]
  containers:
  - name: tools
    image: tnx-hr-tools:k8n6
    imagePullPolicy: Never
    command: ["sleep", "infinity"]
    securityContext: {privileged: true, runAsUser: 0}
    volumeMounts:
    - {name: cilium-run, mountPath: /var/run/cilium, readOnly: true}
    - {name: bpf, mountPath: /sys/fs/bpf, readOnly: true, mountPropagation: HostToContainer}
    - {name: state, mountPath: /var/lib/tnx-hr}
    - {name: modules, mountPath: /lib/modules, readOnly: true}
  volumes:
  - {name: cilium-run, hostPath: {path: /var/run/cilium, type: Directory}}
  - {name: bpf, hostPath: {path: /sys/fs/bpf, type: Directory}}
  - {name: state, hostPath: {path: /var/lib/tnx-hr, type: DirectoryOrCreate}}
  - {name: modules, hostPath: {path: /lib/modules, type: Directory}}
