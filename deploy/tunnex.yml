# Tunnex.io — HOSTED (zero-build) deployment compose (S6.6).
#
# Customers do NOT clone the repo or build from source. `install.sh` fetches THIS file next to a
# generated `.env`, then: `docker compose -f tunnex.yml pull && docker compose -f tunnex.yml up -d`.
# Every Tunnex service is a PREBUILT image. A normal install first resolves the
# immutable sha-* tag of the newest fully-published green main workflow, then
# verifies its signed descriptor and replaces the runtime image references with
# immutable OCI digests. It records that source as TUNNEX_SOURCE_REF. NEVER edit
# this file — all configuration is in `.env`.

name: tunnex

services:
  postgres:
    profiles: [bundled-db]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tunnex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set by install.sh}
      POSTGRES_DB: ${POSTGRES_DB:-tunnex}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tunnex} -d ${POSTGRES_DB:-tunnex}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    image: ${TUNNEX_API_IMAGE:-ghcr.io/tunnexio/tunnex-api:${TUNNEX_VERSION:-latest}}
    restart: unless-stopped
    environment:
      TUNNEX_ENV: production
      TUNNEX_LOG_LEVEL: ${TUNNEX_LOG_LEVEL:-info}
      TUNNEX_API_ADDR: ":8080"
      TUNNEX_SECRETS_DIR: /var/lib/tunnex/secrets
      TUNNEX_AUTO_MIGRATE: "true" # the API migrates on boot — no separate migrate step for the customer
      # The public URL users + email links resolve. install.sh writes it (a reachable address —
      # never localhost) so verify/reset/invite links work off-box.
      APP_BASE_URL: ${APP_BASE_URL:?set by install.sh}
      # Derived from APP_BASE_URL by the installer: HTTPS must not create a
      # transport-insecure browser session cookie.
      TUNNEX_COOKIE_SECURE: ${TUNNEX_COOKIE_SECURE:-false}
      TUNNEX_GATEWAY_CONTROL_URL: ${TUNNEX_GATEWAY_CONTROL_URL:-}
      # Backend installation is automatic; remote HTTP keeps integration off.
      TUNNEX_AI_GATEWAY_URL: ${TUNNEX_AI_GATEWAY_URL:-}
      TUNNEX_AI_GATEWAY_ADMIN_USER: ${TUNNEX_AI_GATEWAY_ADMIN_USER:?set by install.sh}
      TUNNEX_AI_GATEWAY_ADMIN_PASSWORD: ${TUNNEX_AI_GATEWAY_ADMIN_PASSWORD:?set by install.sh}
      TUNNEX_AI_PROVIDER_MANAGEMENT_ENABLED: "true"
      TUNNEX_AI_BOOTSTRAP_VERSION: ${TUNNEX_AI_BOOTSTRAP_VERSION:-}
      TUNNEX_AI_ALLOW_PRIVATE_HTTP: ${TUNNEX_AI_ALLOW_PRIVATE_HTTP:-false}
      TUNNEX_AI_CUSTOM_ENDPOINTS_FILE: /etc/tunnex/ai-custom-policy.json
      TUNNEX_AI_CUSTOM_PROXY_URL: ${TUNNEX_AI_CUSTOM_PROXY_URL:?set by AI bootstrap}
      TUNNEX_NODE_AGENT_IMAGE: ${TUNNEX_NODE_AGENT_IMAGE:-ghcr.io/tunnexio/tunnex-node-agent:${TUNNEX_VERSION:-latest}}
      TUNNEX_IPV6_POOL_CIDR: ${TUNNEX_IPV6_POOL_CIDR:-}
      # Deployment composition gate only. OFF is inert even when an edition
      # unlocks HA; each organization must also opt in before a pool can arm.
      TUNNEX_K8S_HA_ENABLED: ${TUNNEX_K8S_HA_ENABLED:-false}
      DATABASE_URL: ${DATABASE_URL:?set by install.sh}
      TUNNEX_DATABASE_URL: ${TUNNEX_DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # SMTP: install.sh sets these when configured; empty = email features disabled (the dashboard
      # surfaces "SMTP not configured" rather than silently failing).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # The installer collects this address so first-boot can deliver the one-time admin credential.
      TUNNEX_ADMIN_EMAIL: ${TUNNEX_ADMIN_EMAIL:-}
      # First boot only: created atomically with the administrator and owner membership.
      TUNNEX_BOOTSTRAP_ORG_NAME: ${TUNNEX_BOOTSTRAP_ORG_NAME:-}
      TUNNEX_BOOTSTRAP_GATEWAY_TOKEN_SHA256: ${TUNNEX_BOOTSTRAP_GATEWAY_TOKEN_SHA256:-}
      TUNNEX_BOOTSTRAP_GATEWAY_NAME: ${TUNNEX_BOOTSTRAP_GATEWAY_NAME:-}
      # A signed descriptor is mounted read-only. The API treats absent or invalid
      # metadata as no update / blocked update, never as a mutable-tag upgrade.
      TUNNEX_RELEASE_MANIFEST_PATH: ${TUNNEX_RELEASE_MANIFEST_PATH:-}
      TUNNEX_RELEASE_PUBLIC_KEY: ${TUNNEX_RELEASE_PUBLIC_KEY:-}
      TUNNEX_RELEASE_SEQUENCE: ${TUNNEX_RELEASE_SEQUENCE:-0}
      TUNNEX_RELEASE_VERSION: ${TUNNEX_RELEASE_VERSION:-}
      TUNNEX_RELEASE_SOURCE_SHA: ${TUNNEX_RELEASE_SOURCE_SHA:-}
      TUNNEX_RELEASE_CATALOG_URL: ${TUNNEX_RELEASE_CATALOG_URL:-}
      TUNNEX_RELEASE_UPDATE_CHECK: ${TUNNEX_RELEASE_UPDATE_CHECK:-true}
      TUNNEX_HOST_UPGRADE_REQUEST_PATH: /var/lib/tunnex/upgrade/requests/request
      TUNNEX_HOST_UPGRADE_STATUS_PATH: /var/lib/tunnex/upgrade/status/status
    volumes:
      - ${TUNNEX_DATABASE_TLS_SOURCE:-tunnex_database_tls}:/etc/tunnex/database-tls:ro
      - tunnex_secrets:/var/lib/tunnex/secrets # master key / JWT / session — auto-generated on first boot (S0.3)
      - ${TUNNEX_AI_CUSTOM_ENDPOINTS_FILE:?set by AI bootstrap}:/etc/tunnex/ai-custom-policy.json:ro
      - ./release.json:/var/lib/tunnex/release.json:ro
      # The API can request one fixed-purpose host upgrade and read sanitized
      # progress. It never receives the Docker socket or a host command channel.
      - ${TUNNEX_HOST_UPGRADE_REQUEST_SOURCE:-./upgrade-state/requests}:/var/lib/tunnex/upgrade/requests
      - ${TUNNEX_HOST_UPGRADE_STATUS_SOURCE:-./upgrade-state/status}:/var/lib/tunnex/upgrade/status:ro
    ports:
      - "8443:8443" # mTLS agent control channel (agents dial directly)
    depends_on:
      ai-egress:
        condition: service_healthy
      bifrost:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    networks:
      default: {}
      ai_engine: {}

  # The signed Tunnex engine includes the saved-credential test extension. No
  # provider key, model, grant or inference request is created by installation.
  bifrost:
    image: ${TUNNEX_AI_ENGINE_IMAGE:?set by signed release verification}
    restart: unless-stopped
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      APP_DIR: /app/data
      LOG_LEVEL: error
      BIFROST_ADMIN_USER: ${TUNNEX_AI_GATEWAY_ADMIN_USER:?set by install.sh}
      BIFROST_ADMIN_PASSWORD: ${TUNNEX_AI_GATEWAY_ADMIN_PASSWORD:?set by install.sh}
      BIFROST_ENCRYPTION_KEY: ${TUNNEX_AI_ENGINE_ENCRYPTION_KEY:?set by install.sh}
      TUNNEX_AI_CUSTOM_ENDPOINTS_FILE: /etc/tunnex/ai-custom-policy.json
      TUNNEX_AI_CUSTOM_PROXY_URL: ${TUNNEX_AI_CUSTOM_PROXY_URL:?set by AI bootstrap}
    volumes:
      - ai_engine_config:/app/data
      - ai_engine_logs:/app/data/logs
      - ./ai-engine.json:/app/data/config.json:ro
      - ${TUNNEX_AI_CUSTOM_ENDPOINTS_FILE:?set by AI bootstrap}:/etc/tunnex/ai-custom-policy.json:ro
    networks: [ai_engine]
    depends_on:
      ai-egress:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Reuse the signed API image's Go CONNECT helper. Its only authority is the
  # shared destination policy and proxy authentication; it has no CP secrets.
  ai-egress:
    image: ${TUNNEX_API_IMAGE:-ghcr.io/tunnexio/tunnex-api:${TUNNEX_VERSION:-latest}}
    entrypoint: [/usr/local/bin/tunnex-ai-egress]
    restart: unless-stopped
    environment:
      TUNNEX_AI_CUSTOM_ENDPOINTS_FILE: /etc/tunnex/ai-custom-policy.json
      TUNNEX_AI_CUSTOM_PROXY_LISTEN: ":8190"
      TUNNEX_AI_CUSTOM_PROXY_USERNAME: ${TUNNEX_AI_CUSTOM_PROXY_USERNAME:?set by AI bootstrap}
      TUNNEX_AI_CUSTOM_PROXY_PASSWORD: ${TUNNEX_AI_CUSTOM_PROXY_PASSWORD:?set by AI bootstrap}
    volumes:
      - ${TUNNEX_AI_CUSTOM_ENDPOINTS_FILE:?set by AI bootstrap}:/etc/tunnex/ai-custom-policy.json:ro
    networks: [default, ai_engine]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      # An unauthenticated local request must receive407. This checks listener
      # readiness without publishing ports, exposing credentials or inference.
      test: [CMD-SHELL, "wget -S -O /dev/null http://127.0.0.1:8190/ 2>&1 | grep -q '407 Proxy Authentication Required'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  web:
    image: ${TUNNEX_WEB_IMAGE:-ghcr.io/tunnexio/tunnex-web:${TUNNEX_VERSION:-latest}}
    restart: unless-stopped

  nginx:
    image: ${TUNNEX_NGINX_IMAGE:-ghcr.io/tunnexio/tunnex-nginx:${TUNNEX_VERSION:-latest}}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  # Provider-neutral public edge. It owns host HTTP/HTTPS and proxies to the
  # internal app edge. `direct` serves the configured public URL and manages
  # its certificate; terminated/http modes deliberately listen only on HTTP.
  caddy:
    # Multi-architecture Caddy 2 Alpine manifest. Pin the external edge image
    # just like the signed Tunnex images; a future `2-alpine` tag move must not
    # silently change a customer's public TLS terminator.
    image: caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    command: ["caddy", "reverse-proxy", "--from", "${TUNNEX_EDGE_LISTEN:?set by install.sh}", "--to", "nginx:8080"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      nginx:
        condition: service_started

  node-agent:
    image: ${TUNNEX_NODE_AGENT_IMAGE:-ghcr.io/tunnexio/tunnex-node-agent:${TUNNEX_VERSION:-latest}}
    restart: unless-stopped
    environment:
      TUNNEX_API_URL: http://api:8080
      TUNNEX_AGENT_URL: https://api:8443
      TUNNEX_AGENT_SERVERNAME: tunnex-control
      # Set by the dashboard enroll command (item 6): the one-time join token, applied via
      #   TUNNEX_JOIN_TOKEN=<token> docker compose -f tunnex.yml up -d --force-recreate node-agent
      TUNNEX_JOIN_TOKEN: ${TUNNEX_JOIN_TOKEN:-}
      TUNNEX_NODE_NAME: ${TUNNEX_NODE_NAME:-}
      TUNNEX_NODE_STATE_DIR: /var/lib/tunnex-node
      TUNNEX_WG_BACKEND: ${TUNNEX_WG_BACKEND:-wgctrl}
      TUNNEX_WG_INTERFACE: ${TUNNEX_WG_INTERFACE:-wg0}
      # Access-event collection is on by default. Set a different NFLOG group if
      # 100 conflicts inside this gateway container's network namespace, or set
      # exactly 0 to disable observation.
      TUNNEX_FLOWLOG_GROUP: ${TUNNEX_FLOWLOG_GROUP:-100}
      # The public WireGuard endpoint clients dial — install.sh derives it from the public address.
      TUNNEX_NODE_ENDPOINT: ${TUNNEX_NODE_ENDPOINT:?set by install.sh}
    volumes:
      - tunnex_node_state:/var/lib/tunnex-node
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1 # container /proc/sys is read-only; the agent verifies this (S3.7)
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "51820:51820/udp"
    depends_on:
      - api

volumes:
  ai_engine_config:
  ai_engine_logs:
  tunnex_database_tls:
  postgres_data:
  redis_data:
  tunnex_secrets:
  tunnex_node_state:
  caddy_data:
  caddy_config:
  tunnex_host_upgrade_requests:
  tunnex_host_upgrade_status:

networks:
  ai_engine: {}
