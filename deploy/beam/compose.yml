# Local Sharing overlay. Opt-in; never part of the default installation.
# Installed as <install>/local-sharing.yml (always the last -f file) and managed
# by upgrade.sh like app-access.yml (LS-UX-1 D.2). Image pins come only from the
# signed release (releaseverify -require-beam-proxy).
# Single-IP edge (LS-UX-1 E.1, the default from tunnex-local-sharing enable):
# beam-proxy owns public 443, terminates only *.<sharing domain> and splices
# every other stream, undecrypted, to the next owner of 443 with a PROXY v2
# client address. Caddy trusts that address only from the edge's fixed /32 on
# the internal `edge` network; app-proxy only with the edge token. Dedicated-IP
# mode (TUNNEX_BEAM_EDGE_DEFAULT empty) stays supported.
services:
  caddy:
    networks:
      default: {}
      edge: {ipv4_address: '${TUNNEX_EDGE_CADDY_ADDRESS:-172.31.254.3}'}

  api:
    environment:
      TUNNEX_BEAM_BASE_DOMAIN: ${TUNNEX_BEAM_BASE_DOMAIN:?Set the reviewed Beam base domain}
      TUNNEX_BEAM_PROXY_URL: ${TUNNEX_BEAM_PROXY_URL:?Set the desktop-reachable HTTPS connector URL}
      TUNNEX_BEAM_DOMAIN_READY: ${TUNNEX_BEAM_DOMAIN_READY:-false}
      TUNNEX_APP_PROXY_AUTHORITY_ADDR: ':8445'
      TUNNEX_APP_ACCESS_RESTORE_MARKER: /var/lib/tunnex/app-restore/app-access.pending.json
    volumes:
      - app_restore:/var/lib/tunnex/app-restore:ro

  beam-restore-init:
    image: ${TUNNEX_BEAM_PROXY_IMAGE:?Select the locally verified Beam proxy image digest}
    profiles: [beam]
    entrypoint: [/bin/sh, -ec]
    command: ['chown 10001:10001 /restore; chmod 0700 /restore']
    user: '0:0'
    network_mode: none
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    volumes: [app_restore:/restore]

  beam-proxy:
    image: ${TUNNEX_BEAM_PROXY_IMAGE:?Select the locally verified Beam proxy image digest}
    profiles: [beam]
    restart: unless-stopped
    stop_grace_period: 10s
    environment:
      TUNNEX_BEAM_PROXY_PUBLIC_ADDR: ':8443'
      TUNNEX_BEAM_PROXY_CONNECTOR_ADDR: ':8444'
      TUNNEX_BEAM_PROXY_ADMIN_ADDR: '127.0.0.1:9093'
      TUNNEX_BEAM_PROXY_BASE_DOMAIN: ${TUNNEX_BEAM_BASE_DOMAIN:?Set the reviewed Beam base domain}
      TUNNEX_BEAM_PROXY_CONSOLE_BASE_URL: ${APP_BASE_URL:?Set the HTTPS console URL}
      TUNNEX_BEAM_PROXY_AUTHORITY_URL: https://api:8445
      TUNNEX_BEAM_PROXY_AUTHORITY_SERVER_NAME: tunnex-app-authority
      TUNNEX_BEAM_PROXY_AUTHORITY_CA_FILE: /etc/tunnex/beam/agent-ca.pem
      TUNNEX_BEAM_PROXY_CONNECTOR_CA_FILE: /etc/tunnex/beam/agent-ca.pem
      TUNNEX_BEAM_PROXY_TLS_CERT_FILE: /etc/tunnex/beam/public-cert.pem
      TUNNEX_BEAM_PROXY_TLS_KEY_FILE: /etc/tunnex/beam/public-key.pem
      TUNNEX_BEAM_PROXY_CONNECTOR_TLS_CERT_FILE: /etc/tunnex/beam/gateway-cert.pem
      TUNNEX_BEAM_PROXY_CONNECTOR_TLS_KEY_FILE: /etc/tunnex/beam/gateway-key.pem
      TUNNEX_BEAM_PROXY_CREDENTIAL_FILE: /etc/tunnex/beam/authority.token
      TUNNEX_BEAM_PROXY_RESTORE_MARKER: /var/lib/tunnex/app-restore/app-access.pending.json
      TUNNEX_BEAM_PROXY_EDGE_DEFAULT: ${TUNNEX_BEAM_EDGE_DEFAULT:-}
      TUNNEX_BEAM_PROXY_EDGE_DEFAULT_TOKEN: ${TUNNEX_BEAM_EDGE_DEFAULT_TOKEN:-false}
      TUNNEX_BEAM_PROXY_EDGE_APP_ACCESS_DOMAIN: ${TUNNEX_BEAM_EDGE_APP_ACCESS_DOMAIN:-}
      TUNNEX_BEAM_PROXY_EDGE_APP_ACCESS_TARGET: ${TUNNEX_BEAM_EDGE_APP_ACCESS_TARGET:-}
      TUNNEX_BEAM_PROXY_EDGE_TOKEN_FILE: /etc/tunnex/beam/edge.token
    networks:
      default: {}
      edge: {ipv4_address: '${TUNNEX_EDGE_PROXY_ADDRESS:-172.31.254.2}'}
    volumes:
      - ${TUNNEX_BEAM_PROXY_SECRETS_DIR:?Set the privately provisioned Beam TLS and credential directory}:/etc/tunnex/beam:ro
      - app_restore:/var/lib/tunnex/app-restore:ro
    ports:
      - '${TUNNEX_BEAM_PUBLIC_BIND_IP:?Set the browser listener bind IP}:443:8443'
      # LS-UX-1: the connector may use another port (e.g. 8447) and then share
      # the browser listener's or the host's existing address. The browser
      # listener stays on 443 (readiness checks the wildcard on 443).
      - '${TUNNEX_BEAM_CONNECTOR_BIND_IP:?Set the connector listener bind IP}:${TUNNEX_BEAM_CONNECTOR_PORT:-443}:8444'
    # Liveness: process and listeners up. /readyz also needs the installation's
    # DNS/TLS checks to pass, which the console reports and which must not block
    # an upgrade; metrics and /readyz stay on loopback for monitoring.
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9093/livez]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    depends_on:
      api: {condition: service_healthy}
      beam-restore-init: {condition: service_completed_successfully}

volumes:
  app_restore:

networks:
  # Internal only: the edge and the console edge. Fixed so Caddy can trust
  # exactly the edge's address; override TUNNEX_EDGE_SUBNET on collision.
  edge:
    internal: true
    ipam:
      config:
        - subnet: '${TUNNEX_EDGE_SUBNET:-172.31.254.0/29}'
