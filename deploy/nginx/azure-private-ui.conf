# Standalone owned lab UI. Run on the peer CP host; expose only through SSH -L.
# Static root contains apps/web/dist output without source maps.
pid /tmp/azure-private-ui-nginx.pid;
error_log stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    map $http_upgrade $azure_connection { default upgrade; '' close; }
    server {
        listen 127.0.0.1:48084;
        server_name localhost 127.0.0.1;
        root /srv/azure-private-ui;
        index index.html;
        client_max_body_size 1m;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Origin-Agent-Cluster "?1" always;
        location ~ ^/(api(?:/|$)|healthz$|ai(?:/|$)) {
            proxy_pass http://127.0.0.1:48083;
            proxy_http_version 1.1;
            # Preserve browser authority including SSH-forward local port.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $azure_connection;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }
        location ~ \.map$ { return 404; }
        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }
        location / {
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }
}
