server {
    # 8080 so the container runs fully non-root (nginx-unprivileged image).
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed assets; the Vite build fingerprints filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all app routes resolve to index.html.
    #
    # ⛔ `no-cache` ON THE ENTRY DOCUMENT, AND IT IS NOT A MICRO-OPTIMISATION — IT IS THE UPGRADE PATH.
    #
    # index.html had NO Cache-Control and NO Expires, only an ETag. With no explicit freshness a browser
    # applies HEURISTIC caching (RFC 9111 §4.2.2) and serves it WITHOUT revalidating — and its siblings
    # above are pinned `immutable` for a year. A browser holding a stale index.html plus its already-cached
    # bundle therefore renders the OLD APP MAKING ZERO NETWORK REQUESTS. Nothing on the server can dislodge
    # it: the deploy is correct, the container holds only the new asset, every old hash 404s, and the user
    # still sees the previous release until they hard-reload.
    #
    # > **THE ENTRY DOCUMENT IS THE ONE FILE THAT MUST NEVER BE HEURISTICALLY CACHED, BECAUSE IT IS THE ONLY
    # > THING THAT NAMES THE CURRENT BUNDLE.** `immutable` on the hashed assets is correct precisely BECAUSE
    # > this document is not — the two directives are one mechanism, and shipping only half of it pins users
    # > to whichever release they happened to load first.
    #
    # ⚠ `no-cache`, NOT `no-store`. no-cache means "revalidate before reuse", so the ETag still yields a 304
    # and a ~700-byte document is re-sent only when it actually changed. no-store would forbid caching
    # outright and re-download it every navigation for no benefit.
    #
    # Found at the S15.1 founder review: the reviewer's browser rendered a pre-S15.1b screen while the server
    # served the correct bundle — the served hash and the container contents both proved the deploy was fine.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
