# Edge reverse proxy. Single entrypoint on :80 (TLS terminates here in S11.3).
#
# Docker may assign a new IP address when api or web is recreated during an
# install or upgrade. A normal nginx upstream resolves a service name only at
# worker start, which can then cross-wire /api and SPA requests until nginx is
# restarted. Resolve through Docker DNS at request time instead.
resolver 127.0.0.11 ipv6=off valid=10s;
resolver_timeout 2s;

# This proxy is internal-only behind the public Caddy edge. Caddy replaces
# caller-supplied X-Forwarded-Proto with its observed request scheme. Preserve
# that single scheme across this second HTTP hop; do not expose nginx directly.
map $http_x_forwarded_proto $tunnex_client_scheme {
    default $scheme;
    http http;
    https https;
}

# Nginx validates the request Host before this map runs. Keep its full authority
# (including a non-default port) for exact browser Origin/CSRF comparisons.
# Never derive the authority from a caller-supplied forwarding header.
map $http_host $tunnex_client_authority {
    "" $host;
    default $http_host;
}

map $http_upgrade $tunnex_terminal_connection {
    default upgrade;
    "" close;
}

server {
    # 8080 so the edge proxy runs fully non-root (nginx-unprivileged image);
    # compose maps host :80 -> container :8080.
    listen 8080;
    server_name _;

    # Propagate a correlation ID to the API if the client didn't send one.
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Host $tunnex_client_authority;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $tunnex_client_scheme;

    # API health passthrough.
    location = /healthz {
        set $tunnex_api api:8080;
        proxy_pass http://$tunnex_api;
    }

    # Browser terminal and native editor upgrades retain the exact authority and scheme.
    location ~ "^/api/v1/(organizations/[^/]+/server-access/sessions/[^/]+/terminal|server-access/editor/[0-9a-fA-F-]{36})$" {
        set $tunnex_api api:8080;
        proxy_pass http://$tunnex_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tunnex_terminal_connection;
        # Location headers replace server-level inheritance in nginx.
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $tunnex_client_authority;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tunnex_client_scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3605s;
        proxy_send_timeout 5s;
    }

    # Explicit encrypted recording import only; ordinary API limits remain.
    location ~ ^/api/v1/organizations/[^/]+/server-access/recording-import$ {
        client_max_body_size 48m;
        set $tunnex_api api:8080;
        proxy_pass http://$tunnex_api;
    }

    # Versioned API surface.
    location /api/ {
        set $tunnex_api api:8080;
        proxy_pass http://$tunnex_api;
    }

    # AI inference is proxied to the API; stream events must arrive immediately.
    # The adapter enforces the 30-second total bound; proxy permits final cleanup.
    location /ai/ {
        set $tunnex_api api:8080;
        proxy_pass http://$tunnex_api;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }

    # Everything else is the SPA.
    location / {
        set $tunnex_web web:8080;
        proxy_pass http://$tunnex_web;
    }
}
