# Edge reverse proxy. Single entrypoint on :80 (TLS terminates here in S11.3).
#
# Docker may assign a new IP address when api or web is recreated during an
# install or upgrade. A normal nginx upstream resolves a service name only at
# worker start, which can then cross-wire /api and SPA requests until nginx is
# restarted. Resolve through Docker DNS at request time instead.
resolver 127.0.0.11 ipv6=off valid=10s;
resolver_timeout 2s;

server {
    # 8080 so the edge proxy runs fully non-root (nginx-unprivileged image);
    # compose maps host :80 -> container :8080.
    listen 8080;
    server_name _;

    # Propagate a correlation ID to the API if the client didn't send one.
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API health passthrough.
    location = /healthz {
        set $tunnex_api api:8080;
        proxy_pass http://$tunnex_api;
    }

    # Versioned API surface.
    location /api/ {
        set $tunnex_api api:8080;
        proxy_pass http://$tunnex_api;
    }

    # Everything else is the SPA.
    location / {
        set $tunnex_web web:8080;
        proxy_pass http://$tunnex_web;
    }
}
