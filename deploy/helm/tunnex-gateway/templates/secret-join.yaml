{{- /* Legacy only: mint a Secret when a raw joinToken was put in Helm values.
       Product flows create an external Secret and never render its body here. */ -}}
{{- if and (eq .Values.enrollment.mode "enroll") .Values.joinToken (not .Values.enrollment.existingSecret) (not .Values.existingJoinTokenSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tunnex-gateway.joinTokenSecret" . }}
  labels:
    {{- include "tunnex-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.joinTokenKey }}: {{ .Values.joinToken | quote }}
{{- end }}
