{{- /* F5: mint the join-token Secret ONLY when the operator passed a raw joinToken and
       did NOT reference an existing Secret. The existing-Secret path is preferred (a
       token in helm release history leaks) — see values.yaml. */ -}}
{{- if and .Values.joinToken (not .Values.existingJoinTokenSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tunnex-gateway.joinTokenSecret" . }}
  labels:
    {{- include "tunnex-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.joinTokenKey }}: {{ .Values.joinToken | quote }}
{{- end }}
