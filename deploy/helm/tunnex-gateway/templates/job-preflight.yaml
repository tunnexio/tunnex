{{- if .Values.preflight.enabled }}
{{- include "tunnex-gateway.ackGuard" . -}}
# F7: the guard-before-exec gate. A pre-install,pre-upgrade HOOK Job that requests the SAME privileged
# context the gateway needs (hostNetwork + NET_ADMIN + /dev/net/tun + ClusterFirstWithHostNet) and
# self-asserts. On a cluster whose PodSecurity/admission BLOCKS that context, THIS pod is admission-rejected —
# so `helm install --wait` fails HERE, at the hook, before the real Deployment starts a crash-loop. The
# assertions ALSO close two silent-degrade traps the story-end review found: it proves the tun device is
# present (M4 — via a non-blocking /dev DIRECTORY mount, so the script actually RUNS on a tun-less node and
# fails LOUD, instead of the CharDevice mount FailedMount-hanging to helm's timeout) and proves cluster DNS
# resolves by ANSWER CONTENT (M3 — never the busybox nslookup exit code, which historically returns 0 on
# failure; the image is pinned for the same reason). NOTES mandates `--wait`.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tunnex-gateway.fullname" . }}-preflight
  labels:
    {{- include "tunnex-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: preflight
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "tunnex-gateway.labels" . | nindent 8 }}
        app.kubernetes.io/component: preflight
    spec:
      restartPolicy: Never
      # Request the gateway's real posture so a blocking admission controller rejects THIS pod (fail at the
      # hook, not in a crash-loop).
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: preflight
          image: {{ .Values.image.preflight | quote }}
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "NET_BIND_SERVICE"]
          # WF-K-CHART-3: NO hostPort here. It was added (L9) to mirror the gateway's admission posture, but on
          # `helm upgrade` the LIVE gateway pod already holds hostPort 51820 on the node, so a preflight also
          # claiming it is unschedulable → the pre-upgrade hook deadlocks → upgrade fails. The preflight remains
          # a valid guard-before-exec via hostNetwork + NET_ADMIN + the /dev hostPath + the cap set; the
          # hostPort match is the one attribute not worth an upgrade deadlock (the L9 gap is re-accepted).
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # M4: check the tun device via a NON-blocking /dev directory mount (see volumes) — this script
              # runs even when tun is absent, so a tun-less node fails LOUD here instead of the container
              # FailedMount-hanging to helm's timeout with a generic error.
              echo "preflight: checking /host-dev/net/tun ..."
              if [ ! -c /host-dev/net/tun ]; then
                echo "FATAL: /dev/net/tun is not present on this node — the gateway's WireGuard datapath needs it. Load the kernel module (modprobe tun) on the node, or schedule onto a node that has it."
                exit 1
              fi
              # M3: prove cluster DNS resolves by ANSWER CONTENT, never the exit code. busybox nslookup has
              # historically returned 0 even on failure, so a "reassuring-green" gate could pass while the very
              # trap it guards (missing ClusterFirstWithHostNet) is active. Require an Address line UNDER the
              # answer's "Name:" section — absent on a resolution failure. WF-K5 NARROWED the reason: the gateway
              # no longer resolves a Service's ClusterIP via DNS (endpoint DNAT reads ready pods from the K8s API
              # by ClusterIP env). Cluster DNS is still needed when controlPlane.apiURL/agentURL are IN-CLUSTER
              # FQDNs (the tunnex-cp-in-cluster deploy) — this proves ClusterFirstWithHostNet is in force so the
              # agent can resolve the CP's address. (For an external CP it is belt-and-suspenders.)
              echo "preflight: resolving cluster DNS ({{ .Values.preflight.dnsProbe }}) from the gateway's DNS posture ..."
              out=$(nslookup {{ .Values.preflight.dnsProbe }} 2>&1 || true)
              echo "$out"
              if ! printf '%s\n' "$out" | grep -A50 '^Name:' | grep -q '^Address'; then
                echo "FATAL: could not resolve {{ .Values.preflight.dnsProbe }} to an address. A hostNetwork pod inherits the NODE resolv.conf; without dnsPolicy ClusterFirstWithHostNet cluster DNS is dead. This blocks resolving an IN-CLUSTER control-plane address (controlPlane.apiURL/agentURL as *.svc.cluster.local). Refuse rather than install a gateway that silently can't reach its control plane."
                exit 1
              fi
              echo "preflight: OK — privileged context admitted, /dev/net/tun present, cluster DNS answers."
          volumeMounts:
            # M4: mount the host /dev as a DIRECTORY (always present) rather than a CharDevice file. A
            # CharDevice mount is validated by kubelet BEFORE the container starts, so a missing /dev/net/tun
            # would FailedMount-hang the probe instead of letting the script report it — the exact dead-code
            # the review found. A directory mount always starts; the script tests the path itself.
            - name: host-dev
              mountPath: /host-dev
              readOnly: true
      volumes:
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory
{{- end }}
