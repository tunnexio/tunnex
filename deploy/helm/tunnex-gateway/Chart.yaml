apiVersion: v2
name: tunnex-gateway
description: >-
  Tunnex in-cluster gateway — one connector identity that fronts a Kubernetes
  cluster on the fabric, DNATing synthetic Service VIPs to ready pod endpoints
  and answering the cluster's DNS zone. A credentialless init admits the Pod
  only after the separate cluster-singleton host-posture manager proves this
  exact live Pod UID on the selected node; the ordinary hostNetwork gateway
  retains only NET_ADMIN, NET_BIND_SERVICE, /dev/net/tun, and read-only
  Service/EndpointSlice access.
  Retained identity state and explicit enroll/reuse modes make install, upgrade,
  rollback, and uninstall lifecycle-safe across Kubernetes providers.
type: application
version: 0.1.0
appVersion: "0.2.0"
kubeVersion: ">=1.24.0-0"
keywords: [vpn, wireguard, zero-trust, kubernetes, gateway]
home: https://github.com/tunnexio/tunnex
sources: [https://github.com/tunnexio/tunnex]
