# tunnex-gateway — in-cluster gateway chart values (S10.3).
#
# This chart deploys ONE privileged, hostNetwork node-agent that fronts a Kubernetes
# cluster on the Tunnex fabric. It is DELIBERATELY separate from tunnex-cp: the
# gateway needs NET_ADMIN + /dev/net/tun + hostNetwork (F4) to place its prerouting
# DNAT in the node netns ahead of kube-proxy, whereas the control plane is an
# ordinary unprivileged workload.

image:
  registry: ghcr.io/tunnexio
  # The node-agent image. An ENTERPRISE deploy builds its own (TUNNEX_BUILD_TAGS=
  # enterprise) and overrides registry + repo. The credentialless posture check
  # and privileged admission preflight both reuse
  # this same release image by default so it cannot drift independently.
  agent: tunnex-node-agent
  # Empty means the chart's appVersion. Release packaging sets appVersion to
  # the same immutable vX.Y.Z tag as the node-agent image, so the default
  # install cannot silently drift to a different runtime.
  tag: ""
  # Preferred immutable selection. When set, the chart renders
  # <registry>/<agent>@<digest> and ignores tag.
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []
  # Optional preflight-only override. Empty reuses the node-agent image above.
  # Because this hook is privileged, an override must be immutable image@sha256.
  preflight: ""

# ─── CONTROL-PLANE CONNECTION ────────────────────────────────────────────────────
# Where the agent enrolls + fetches desired state. Both endpoints must use TLS.
# Point at the tunnex-cp release's externally trusted HTTPS API and agent-mTLS
# listener. If the API runs on port 8080 internally, terminate TLS in front of it.
controlPlane:
  apiURL: ""              # e.g. https://internal.tunnex.example.com  (REQUIRED)
  agentURL: ""            # e.g. https://tunnex-cp-api-agent.tunnex.svc.cluster.local:8443  (REQUIRED)
  serverName: "tunnex-control" # the agent-mTLS server name the CP presents

# ─── ENROLLMENT (external Secret preferred; raw tokens leak to Helm history) ──
# Enroll requires nodeName and exactly one token source. Reuse requires an
# existing retained claim and no token. Rotation is deliberately not implicit.
enrollment:
  # One release owns one identity. `enroll` creates a new identity on the
  # chart-managed empty claim; `reuse` reattaches a retained existing claim.
  mode: enroll             # enroll | reuse
  # Preferred token transport. `tunnex k8s install` creates this Secret without
  # putting its value in argv, logs, values, or Helm release history.
  existingSecret: ""
  # The token is single-use. Keep this true so the lifecycle command may delete
  # the consumed Secret and later pod restarts can reuse the PVC.
  secretOptional: true

# Backwards-compatible enrollment values. New product flows use
# enrollment.existingSecret. Raw joinToken is an INSECURE legacy escape hatch:
# its value is retained by Helm release history.
existingJoinTokenSecret: ""
joinTokenKey: TUNNEX_JOIN_TOKEN
joinToken: ""

# ─── FABRIC ENDPOINT (explicit, or automatic LoadBalancer discovery) ────────
# An explicit public WireGuard host:port wins. With a LoadBalancer Service this
# may be empty: the agent discovers this release's Service status and withholds
# readiness until its controller publishes an address. NodePort requires an
# explicit endpoint because the product does not guess a node's public identity.
endpoint: ""             # e.g. 203.0.113.10:51820; empty = LoadBalancer discovery

# The node name the agent enrolls under. The CP pins each join token to a node name; the agent MUST present
# exactly that name or enrollment is refused (node_name_mismatch). A hostNetwork pod otherwise defaults to the
# NODE's hostname (the VM name), which usually differs from the token's pinned name — so set this to whatever
# name the join token was minted for (shown in the enroll dialog). Empty = fall back to the pod hostname.
nodeName: ""

# The WireGuard listen port (must match the port in `endpoint`).
wireguard:
  port: 51820

# ─── WG-EXPOSURE SERVICE ─────────────────────────────────────────────────────────
# How the WG :51820 datapath is reached from outside the cluster.
service:
  type: LoadBalancer      # LoadBalancer (cloud) or NodePort (bare-metal/on-prem)
  # Pin a reserved static IP (recommended: it lets you set `endpoint` before install).
  loadBalancerIP: ""
  # For type NodePort, the node port (30000–32767); ignored for LoadBalancer.
  nodePort: 0
  annotations: {}

# ─── PERSISTENT STATE (the node cert + WG identity — survives restarts) ──────────
# The agent stores its enrolled cert + keys under TUNNEX_NODE_STATE_DIR. Persisting
# it means a pod restart re-attaches the SAME node identity (no re-enroll). Losing it
# forces a wipe-to-re-enroll (see NOTES).
persistence:
  enabled: true
  size: 128Mi
  storageClass: ""        # "" = the cluster default StorageClass
  # Required by enrollment.mode=reuse and forbidden for enroll. This prevents a
  # one-time token from silently enrolling over an old identity/fence store.
  existingClaim: ""
  # Identity, WireGuard keys, and HA fence evidence survive Helm uninstall by
  # default. State deletion is a separate, explicitly confirmed operation.
  retain: true
  # Token-blind lifecycle provenance for a newly enrolled identity. The
  # zero-touch CLI supplies both canonical UUIDs from its approved lifecycle
  # anchor. Direct legacy Helm installs leave both empty; reuse mode must never
  # invent or overwrite provenance on an existing claim.
  provenance:
    organizationID: ""
    lifecycleClaim: ""
  # For ephemeral clusters you can disable persistence (emptyDir); a restart then
  # re-enrolls (needs a fresh join token) — acceptable only for testing.

# ─── PREFLIGHT (F7 — the guard-before-exec gate) ─────────────────────────────────
# A pre-install,pre-upgrade hook Job that requests the privileged/hostNetwork/
# NET_ADMIN//dev/net/tun admission context and asserts (a) /dev/net/tun is present and (b) the
# cluster DNS resolves (the hostNetwork DNS trap — without ClusterFirstWithHostNet a
# hostNetwork pod inherits the NODE resolv.conf and *.svc never resolves). On a
# cluster whose PodSecurity/admission blocks the context, the Job pod is REJECTED, so
# `helm install --wait` fails HERE, before the real Deployment ever starts a
# crash-loop. Keep it enabled unless you have a reason not to.
preflight:
  enabled: true
  # The Service the preflight resolves to prove cluster DNS works from the gateway's
  # DNS posture. Default = the kube API Service, always present.
  dnsProbe: "kubernetes.default.svc.cluster.local"

# ─── PRIVILEGE ACKNOWLEDGEMENT (F7b — REQUIRED) ──────────────────────────────────
# This chart runs a privileged admission hook and a hostNetwork gateway with
# NET_ADMIN and /dev/net/tun. The long-running privileged posture manager is a
# separate cluster-singleton release. Set
# this true to acknowledge that posture — a `required` guard so no one installs the
# gateway without seeing what it asks for.
acknowledgePrivileged: false

# The pod's node placement (a gateway often pins to a node with a stable external IP).
nodeSelector: {}
tolerations: []
affinity: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

serviceAccount:
  create: true
  name: ""

# Create the chart's exact read-only Service/EndpointSlice RBAC and bind it to
# either the chart-created or explicitly supplied ServiceAccount.
rbac:
  create: true

logLevel: info

# Opaque, non-secret rollout input. Change it when external configuration should
# deliberately recreate the pod; never put the join token in this value.
rolloutRevision: ""

# HA control-plane liveness cadence. The controller accepts one missed report
# and then retains three consecutive health ticks before promotion, keeping
# automatic connector failover within the 30-second recovery budget.
reportInterval: "5s"
