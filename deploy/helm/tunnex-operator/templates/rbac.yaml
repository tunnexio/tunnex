{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tunnex-operator.fullname" . }}
  labels:
    {{- include "tunnex-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["tunnex.io"]
    resources: ["tunnexclusters", "tunnexexposedservices", "tunnexgrants"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["tunnex.io"]
    resources: ["tunnexclusters/status", "tunnexexposedservices/status", "tunnexgrants/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tunnex-operator.fullname" . }}
  labels:
    {{- include "tunnex-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "tunnex-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tunnex-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
