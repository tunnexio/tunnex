# Chart-specific configuration: ClusterIP DNS is resolved at nginx startup.
# Service IPs remain stable across API/web pod rollouts.
# The outer ingress must overwrite caller-supplied X-Forwarded-Proto. Only
# explicitly selected ingress peers may carry that observation across this hop.
geo $remote_addr $tunnex_ingress_trusted {
    default 0;
    {{- range .Values.edge.trustedIngressCIDRs }}
    {{ . }} 1;
    {{- end }}
}
map "$tunnex_ingress_trusted:$http_x_forwarded_proto" $tunnex_client_scheme {
    default $scheme;
    "1:http" http;
    "1:https" https;
    ~^1: invalid;
}

server {
    listen 8080;
    server_name _;
    # A broken trusted TLS hop must fail, rather than mint an HTTP cookie.
    if ($tunnex_client_scheme = invalid) { return 400; }
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $tunnex_client_scheme;
    location = /healthz { proxy_pass http://api:8080; }
    location /api/ { proxy_pass http://api:8080; }
    location /ai/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }
    location / { proxy_pass http://web:8080; }
}
