# Chart-specific configuration: ClusterIP DNS is resolved at nginx startup.
# Service IPs remain stable across API/web pod rollouts.
{{- with .Values.edge.realClientAddressFrom }}
# AI-READY-1: take the client address from X-Forwarded-For only when the
# direct peer is a configured load balancer or ingress hop. Recursive: every
# trusted hop is skipped and the first untrusted address is the client. Any
# other peer's X-Forwarded-For is ignored and $remote_addr stays the peer.
{{- range . }}
set_real_ip_from {{ . }};
{{- end }}
real_ip_header X-Forwarded-For;
real_ip_recursive on;
{{- end }}
# The outer ingress must overwrite caller-supplied X-Forwarded-Proto. Only
# explicitly selected ingress peers may carry that observation across this hop.
# $realip_remote_addr is always the direct peer, so resolving the client
# address above never widens who may report the scheme.
geo $realip_remote_addr $tunnex_ingress_trusted {
    default 0;
    {{- range .Values.edge.trustedIngressCIDRs }}
    {{ . }} 1;
    {{- end }}
}
map "$tunnex_ingress_trusted:$http_x_forwarded_proto" $tunnex_client_scheme {
    default $scheme;
    "1:http" http;
    "1:https" https;
    ~^1: invalid;
}

# Preserve the Nginx-validated Host authority, including its external port.
# The ingress must preserve Host; X-Forwarded-Host is never an authority source.
map $http_host $tunnex_client_authority {
    "" $host;
    default $http_host;
}

map $http_upgrade $tunnex_terminal_connection {
    default upgrade;
    "" close;
}

server {
    listen 8080;
    server_name _;
    # A broken trusted TLS hop must fail, rather than mint an HTTP cookie.
    if ($tunnex_client_scheme = invalid) { return 400; }
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Host $tunnex_client_authority;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header True-Client-IP "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $tunnex_client_scheme;
    location = /healthz { proxy_pass http://api:8080; }
    # Browser terminal and native editor upgrades retain the exact authority and scheme.
    location ~ "^/api/v1/(organizations/[^/]+/server-access/sessions/[^/]+/terminal|server-access/editor/[0-9a-fA-F-]{36})$" {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tunnex_terminal_connection;
        # Location headers replace server-level inheritance in nginx.
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $tunnex_client_authority;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tunnex_client_scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3605s;
        proxy_send_timeout 5s;
    }

    # Explicit encrypted recording import only; ordinary API limits remain.
    location ~ ^/api/v1/organizations/[^/]+/server-access/recording-import$ {
        client_max_body_size 48m;
        proxy_pass http://api:8080;
    }

    location /api/ { proxy_pass http://api:8080; }
    # AI inference: outer bounds for the adapter's TUNNEX_AI_* limits (33 MiB
    # unbuffered bodies, up to 31 minutes between reads).
    location /ai/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        client_max_body_size 33m;
        proxy_read_timeout 1860s;
        proxy_send_timeout 1860s;
    }
    location ~ ^/api/v1/organizations/[^/]+/ai-gateway/inference/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        client_max_body_size 33m;
        proxy_read_timeout 1860s;
        proxy_send_timeout 1860s;
    }
    location / { proxy_pass http://web:8080; }
}
