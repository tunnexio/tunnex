# Chart-specific configuration: ClusterIP DNS is resolved at nginx startup.
# Service IPs remain stable across API/web pod rollouts.
server {
    listen 8080;
    server_name _;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    location = /healthz { proxy_pass http://api:8080; }
    location /api/ { proxy_pass http://api:8080; }
    location /ai/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }
    location / { proxy_pass http://web:8080; }
}
