name: Container Go build cache
description: Cache compiler and module data, not test database state
inputs:
  lane:
    description: Distinguish matrix cache writers
    default: default
runs:
  using: composite
  steps:
    - name: Locate disposable runner cache
      shell: bash
      run: |
        cache_dir="$RUNNER_TEMP/tunnex-go-cache"
        mkdir -p "$cache_dir/mod" "$cache_dir/build"
        echo "GO_CACHE_DIR=$cache_dir" >> "$GITHUB_ENV"
    - uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/tunnex-go-cache
        key: go-container-v1-${{ runner.os }}-${{ runner.arch }}-1.25.13-alpine-${{ github.job }}-${{ inputs.lane }}-${{ hashFiles('apps/**/go.sum', 'apps/**/go.mod') }}-${{ github.sha }}
        restore-keys: |
          go-container-v1-${{ runner.os }}-${{ runner.arch }}-1.25.13-alpine-${{ github.job }}-${{ inputs.lane }}-${{ hashFiles('apps/**/go.sum', 'apps/**/go.mod') }}-
