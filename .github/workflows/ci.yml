name: CI

# Control-plane, dashboard, gateway, operator and headless CLI verification.
# Desktop builds and packaging are owned by tunnexio/tunnex-client.
# Keep merge commit messages free of CI-skip directives: main publication requires a push-triggered run.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Installer derives sha-<7> from the successful workflow's head_sha. Pin metadata-action's otherwise
  # implicit abbreviation length so artifact naming and version resolution cannot drift independently.
  DOCKER_METADATA_SHORT_SHA_LENGTH: "7"

jobs:
  # Classification is cheap and precedes all independent lanes. Unknown means full coverage.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      go: ${{ steps.scope.outputs.go }}
      web: ${{ steps.scope.outputs.web }}
      codegen: ${{ steps.scope.outputs.codegen }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Classify the diff (fails closed — anything uncertain runs everything)
        id: scope
        run: |
          set -euo pipefail
          # ⛔ FAIL-CLOSED DEFAULT: everything runs unless a diff is computed AND proves otherwise.
          RUN_GO=true; RUN_CODEGEN=true; RUN_WEB=true; DOCS_ONLY=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
              CHANGED=$(git diff --name-only "${BASE}...HEAD" || true)
              # ⛔ AND SEPARATELY, WHAT WAS *DELETED* — because the exclusion below is safe for a CONTENT
              # edit and NOT for a removal. `//go:embed` fails to COMPILE when its target is missing, so a
              # deleted fixtures.sql must still force the Go legs. --diff-filter=D is the only thing that
              # distinguishes those two, and --name-only alone cannot.
              DELETED=$(git diff --name-only --diff-filter=D "${BASE}...HEAD" || true)
              if [ -n "$(printf '%s' "$CHANGED" | tr -d '[:space:]')" ]; then
                # ── Go relevance ────────────────────────────────────────────────────────────────────────
                # MEASURED (S14.15): across 18 runs on two PRs, 17 had go=true and **16 of those were
                # triggered by `apps/api/cmd/seed-fixtures/fixtures.sql` ALONE**. Because the classifier
                # diffs BASE...HEAD, one fixture edit early in a branch pinned go=true for every later
                # push — including 10 of 15 commits that were DOCS-ONLY. The classifier was not firing.
                #
                # fixtures.sql is a compile input ONLY to `cmd/seed-fixtures`, which `shipcensus_test.go:20`
                # declares DELIBERATELY NOT SHIPPED ("seeding a production database is not a supported
                # operation"). Nothing outside that command references it. So its CONTENT cannot break the
                # api / cli / node / operator builds — only its ABSENCE can, which DELETED covers.
                GO_RELEVANT=$(printf '%s\n' "$CHANGED" \
                  | grep -vxF 'apps/api/cmd/seed-fixtures/fixtures.sql' \
                  | grep -E '(^deploy/test-api-edition\.sh$|\.go$|go\.(mod|sum)$|\.sql$|Dockerfile|Makefile|\.github/|openapi/|apps/api/db/|apps/api/internal/mail/|apps/api/internal/aigateway/reference/)' || true)
                DELETED_GO=$(printf '%s\n' "$DELETED" | grep -E '.' || true)
                if [ -z "$(printf '%s' "$GO_RELEVANT$DELETED_GO" | tr -d '[:space:]')" ]; then
                  RUN_GO=false
                fi
                # ── Codegen drift ───────────────────────────────────────────────────────────────────────
                # This step had NO condition at all and cost 59s on every run, including docs-only ones.
                # It guards OpenAPI -> Go/TS/RBAC/sqlc drift, so it must fire when a SOURCE of generation
                # changes or when a GENERATED artifact is hand-edited (the drift it exists to catch).
                if ! printf '%s\n' "$CHANGED" | grep -E '(openapi/|apps/api/db/|\.go$|go\.(mod|sum)$|\.gen\.|api\.d\.ts$|rbac-policy\.json$|tokens|Makefile|\.github/)' >/dev/null; then
                  RUN_CODEGEN=false
                fi
                # ── Web ─────────────────────────────────────────────────────────────────────────────────
                if ! printf '%s\n' "$CHANGED" | grep -E '(apps/web/|packages/|package\.json|pnpm-lock|\.github/)' >/dev/null; then
                  RUN_WEB=false
                fi
                # ── Docs-only ───────────────────────────────────────────────────────────────────────────
                # 10 of the last 15 commits. Every one ran the full 498s gates plus e2e twice.
                if [ -z "$(printf '%s\n' "$CHANGED" | grep -vE '(\.md$)' | tr -d '[:space:]')" ]; then
                  DOCS_ONLY=true; RUN_GO=false; RUN_CODEGEN=false; RUN_WEB=false
                fi
              fi
            fi
          fi
          {
            echo "go=$RUN_GO"
            echo "codegen=$RUN_CODEGEN"
            echo "web=$RUN_WEB"
            echo "docs_only=$DOCS_ONLY"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=gates scope::go=$RUN_GO codegen=$RUN_CODEGEN web=$RUN_WEB docs_only=$DOCS_ONLY (false = SKIPPED, not passed)"
          printf '%s\n' "${CHANGED:-<no diff computed>}" | sed -n '1,40p'


  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
      - name: Reproduce the pinned release model catalog and pricing
        run: |
          node --test scripts/ai-model-catalog.test.mjs
          node scripts/ai-model-catalog.mjs --fetch --check
      - name: Hosted automatic AI backend contract
        run: python3 deploy/hosted-ai-compose_contract_test.py

      - name: Digest-pinned AI VPN overlay contract
        run: python3 -B -m unittest discover -s deploy/ai-vpn -p 'test_*.py' -v

      - name: Installer version provenance contract
        run: sh deploy/install-version-provenance_test.sh

      - name: Local gate cache isolation contract
        run: bash deploy/gate-cache-isolation-contract_test.sh

      - name: Installer fresh-host bootstrap contract
        run: |
          sh deploy/public-url-contract_test.sh
          TUNNEX_TEST_CADDY_RUNTIME=1 sh deploy/edge-tls-contract_test.sh
          sh deploy/install-host-bootstrap_test.sh
          python3 deploy/install-first-organization_test.py

      - name: Installer Windows fresh-host bootstrap contract
        shell: pwsh
        run: ./deploy/install-windows-bootstrap_test.ps1

      - name: Managed-agent verifier publication contract
        run: ruby deploy/agent-bootstrap-release-contract_test.rb

      - name: Signed update catalog contract
        run: sh deploy/signed-main-release-contract_test.sh

      - name: Public installer release promotion contract
        run: ruby deploy/verify-installer-site_test.rb

      - name: Draft release source-ref lifecycle regression
        run: bash deploy/release-source-ref-contract_test.sh

      - name: Host upgrade contract
        run: sh deploy/upgrade_contract_test.sh && sh deploy/upgrade_apply_contract_test.sh && sh deploy/upgrade_runner_contract_test.sh

      - name: Set up Helm for deployment contracts
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.4

      - name: App Access packaging, restore and upgrade contracts
        timeout-minutes: 5
        run: |
          contract_venv="$RUNNER_TEMP/app-access-contracts"
          python3 -m venv "$contract_venv"
          "$contract_venv/bin/python" -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
          "$contract_venv/bin/python" -B -m unittest discover -s deploy/app-access/tests -p 'test_*.py' -v

      - name: Native AI Helm isolation and scoped SageMaker contracts
        run: |
          ruby deploy/ai-gateway/verify-helm.rb
          ruby deploy/helm/tunnex-cp/tests/verify-ai-sagemaker.rb
          bash deploy/trusted-proxy-chart-contract_test.sh

      - name: Kubernetes HA deployment gate contract
        run: sh deploy/k8s-ha-deployment-gate-contract_test.sh

      - name: BYODB Helm Secret and TLS contract
        run: bash deploy/byodb-chart-contract_test.sh

      - name: BYODB installer contract
        run: sh deploy/byodb-install-contract_test.sh

      - name: Set up Go for reproducible chart artifacts
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.8'
          cache-dependency-path: apps/cli/go.sum
      - name: Reuse compiler cache across chart invocations
        run: echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
      - name: Native image publication contracts
        run: ruby deploy/native-image-publication_test.rb
      - name: Draft release publication permissions contract
        run: ruby deploy/release-draft-permissions_test.rb
      - name: CI aggregation and wiring contracts
        run: node --test deploy/ci-gates_test.mjs deploy/test-api-edition_test.mjs deploy/pull-ci-services_test.mjs

      - name: Kubernetes zero-touch chart contracts
        run: make test-k8s-charts

      - name: E2E heading locator contract
        run: node e2e/check-heading-locators.mjs


  codegen:
    needs: scope
    if: needs.scope.outputs.codegen == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: ci-codegen-${{ github.run_id }}-${{ github.run_attempt }}
      GATE_CACHE_PREFIX: ci-codegen-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/go-container-cache
      - run: make generate-check

  api:
    needs: scope
    if: needs.scope.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        edition: [open, enterprise]
        shard: [db, ipsec, nodes, other]
    runs-on: ubuntu-latest
    # Heavy packages run on separate runners/databases; packages within each shard
    # stay serial because integration fixtures include globally counted state.
    # Keep the existing timeout as headroom, not as a substitute for parallelism.
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: ci-api-${{ matrix.edition }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
      GATE_CACHE_PREFIX: ci-api-${{ matrix.edition }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/go-container-cache
        with:
          lane: ${{ matrix.edition }}-${{ matrix.shard }}
      - name: Migrate isolated database and build/test edition
        run: |
          cp .env.example .env
          sh deploy/pull-ci-services.sh postgres
          docker compose up -d --wait postgres
          make migrate
          make test-edition TEST_EDITION=${{ matrix.edition }} API_TEST_SHARD=${{ matrix.shard }}

  app-access-integration:
    needs: scope
    if: needs.scope.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        edition: [open, enterprise]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # GitHub owns a separate network/services per job. No host ports/shared volume.
    container:
      image: golang:1.26.8-bookworm
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aa0
          POSTGRES_DB: aa0
          # Disposable, unpublished CI fixture credential; never a real account.
          POSTGRES_PASSWORD: ci-app-access-only
        options: >-
          --health-cmd "pg_isready -U aa0 -d aa0"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_ACCESS_LOCAL_INTEGRATION: '1'
      AA0_DB_PASSWORD: ci-app-access-only
      PGPASSWORD: ci-app-access-only
      TUNNEX_TEST_DATABASE_URL: postgres://aa0:ci-app-access-only@postgres:5432/aa0?sslmode=disable
      TEST_EDITION: ${{ matrix.edition }}
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install inspection clients
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends postgresql-client python3
      - name: Assert owned blank parent and record expected test inventory
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app-access-ci
          test "$(psql -h postgres -U aa0 -d aa0 -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public'")" = 0
          cat > app-access-ci/parent.sql <<'SQL'
          SELECT 'database', current_database();
          SELECT 'namespace', nspname, pg_get_userbyid(nspowner) FROM pg_namespace WHERE nspname !~ '^pg_' AND nspname <> 'information_schema' ORDER BY nspname;
          SELECT 'relation', n.nspname, c.relname, c.relkind::text FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname !~ '^pg_' AND n.nspname <> 'information_schema' ORDER BY n.nspname,c.relname;
          SELECT 'function', n.nspname, p.oid::regprocedure::text, pg_get_functiondef(p.oid) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname !~ '^pg_' AND n.nspname <> 'information_schema' ORDER BY n.nspname,p.oid::regprocedure::text;
          SELECT 'type', n.nspname, t.typname FROM pg_type t JOIN pg_namespace n ON n.oid=t.typnamespace WHERE n.nspname !~ '^pg_' AND n.nspname <> 'information_schema' ORDER BY n.nspname,t.typname;
          SELECT 'database-set', datname FROM pg_database WHERE NOT datistemplate ORDER BY datname;
          SQL
          psql -h postgres -U aa0 -d aa0 -At -v ON_ERROR_STOP=1 -f app-access-ci/parent.sql > app-access-ci/parent-before.txt
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          root = pathlib.Path('apps/api/internal/appaccess')
          names = sorted({n for p in root.glob('*_test.go') for n in re.findall(r'^func (Test\w+)\(t \*testing\.T\)', p.read_text(), re.M)})
          required = {'TestRegistryLocalDatabase', 'TestGrantsLocalDatabase', 'TestCompanyRequestsAtomicHistoryLocalDatabase', 'TestApplicationMFALiveAuthorityLocalDatabaseRedis', 'TestGrantRetentionBoundariesAndIndependentHistoryLocalDatabase', 'TestHostnameReuseOldAuthorityLocalDatabaseRedis'}
          if not required <= set(names): raise SystemExit('Feature regression source missing from reconciled checkout')
          out = pathlib.Path('app-access-ci')
          (out/'expected-tests.json').write_text(json.dumps(names))
          files = sorted([*root.glob('*.go'), *pathlib.Path('apps/api/db/migrations').glob('*.sql')])
          (out/'source-inputs.json').write_text(json.dumps({str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files}, sort_keys=True))
          PY
          # Checkout and job shells may use different HOME directories in containers.
          # Trust only this runner-owned checkout for the source identity read.
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD > app-access-ci/source-commit.txt
          test "$(cat app-access-ci/source-commit.txt)" = "$GITHUB_SHA"
          go version > app-access-ci/go-version.txt
          echo ready=true >> "$GITHUB_OUTPUT"
      - name: Run feature DB and Redis regressions in owned random child databases
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "$TEST_EDITION" = enterprise ]; then args=(-tags enterprise); fi
          cd apps/api
          result=0
          go test -json -count=1 -p=1 -timeout=25m "${args[@]}" ./internal/appaccess > ../../app-access-ci/appaccess.jsonl 2> ../../app-access-ci/appaccess.stderr || result=$?
          go test -json -count=1 -p=1 -timeout=10m "${args[@]}" -run '^(TestAppParentLogoutLocalIntegration|TestAppParentPasswordReplacementLocalIntegration|TestNativeSSOConfigRestoreLocalDatabase)$' ./internal/http > ../../app-access-ci/http-authority.jsonl 2> ../../app-access-ci/http-authority.stderr || result=$?
          go test -json -count=1 -p=1 -timeout=5m "${args[@]}" -run '^TestNewAtVersionPreservesParentSchema$' ./internal/testpostgres > ../../app-access-ci/testpostgres.jsonl 2> ../../app-access-ci/testpostgres.stderr || result=$?
          exit "$result"
      - name: Require actual test execution and unchanged blank parent
        if: always() && steps.fixture.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # This checks failure paths too. Never migrate or reset this parent.
          psql -h postgres -U aa0 -d aa0 -At -v ON_ERROR_STOP=1 -f app-access-ci/parent.sql > app-access-ci/parent-after.txt
          cmp app-access-ci/parent-before.txt app-access-ci/parent-after.txt
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('app-access-ci')
          expected = json.loads((root/'expected-tests.json').read_text())
          summary = {}
          for log, names in [('appaccess', expected), ('http-authority', ['TestAppParentLogoutLocalIntegration', 'TestAppParentPasswordReplacementLocalIntegration', 'TestNativeSSOConfigRestoreLocalDatabase']), ('testpostgres', ['TestNewAtVersionPreservesParentSchema'])]:
              rows = [json.loads(line) for line in (root/(log+'.jsonl')).read_text().splitlines()]
              bad = [r for r in rows if r.get('Action') in ('skip', 'fail')]
              passed = {r['Test'] for r in rows if r.get('Action') == 'pass' and 'Test' in r}
              package_pass = any(r.get('Action') == 'pass' and 'Test' not in r for r in rows)
              missing = sorted(set(names) - passed)
              if bad or missing or not package_pass:
                  raise SystemExit(json.dumps({'suite':log,'bad_events':bad,'missing':missing,'package_pass':package_pass}))
              summary[log] = {'expected_top_level_tests':len(names),'passed_top_level_tests':len(set(names)&passed),'functional_skips':0}
          summary['parent_unchanged'] = True
          (root/'result.json').write_text(json.dumps(summary, indent=2)+'\n')
          print(json.dumps(summary))
          PY
      - name: Retain same-run source and qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-access-integration-${{ matrix.edition }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: app-access-ci/
          if-no-files-found: error

  tooling:
    needs: scope
    if: needs.scope.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: [test-node, test-apptransport, test-app-proxy, test-operator, test-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/go-container-cache
        with:
          lane: ${{ matrix.target }}
      - run: make ${{ matrix.target }}

  web:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
      - name: Enable pinned package manager
        run: corepack enable
      - name: Locate pnpm store
        id: pnpm
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'package.json', 'pnpm-lock.yaml') }}
      - name: Web — typecheck + unit tests + build
        if: needs.scope.outputs.web == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @tunnex/web typecheck
          pnpm --filter @tunnex/web test
          pnpm --filter @tunnex/web build
      # Always compile E2E specs, as in the original blocking gate.
      - name: E2E specs — typecheck (compiles, not runs)
        run: |
          cd e2e
          npm ci --no-audit --no-fund --silent
          npx tsc --noEmit -p tsconfig.json

  # Preserve the existing required check and downstream outputs. Never convert a
  # failed/cancelled/missing lane into success, or accept an unexplained skip.
  gates:
    needs: [scope, contracts, codegen, api, app-access-integration, tooling, web]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ needs.scope.outputs.docs_only }}
      go: ${{ needs.scope.outputs.go }}
      web: ${{ needs.scope.outputs.web }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require every applicable lane
        env:
          GATE_NEEDS: ${{ toJSON(needs) }}
        run: node deploy/ci-gates.mjs

  # Linux CLI: a separate, headless distribution surface. Build both public
  # architectures on every change; only tag-bound artifacts may be attached to
  # a public GitHub release.
  cli-release:
    name: cli release (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum
      - name: CLI — test and build Linux artifacts
        working-directory: apps/cli
        env:
          GOFLAGS: -mod=readonly
        run: |
          set -euo pipefail
          go test ./...
          mkdir -p ../../cli-artifacts ../../runtime-artifacts
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -buildvcs=false -ldflags="-s -w -X main.version=${GITHUB_REF_NAME:-dev}" \
              -o "../../cli-artifacts/tnx-linux-$arch" ./cmd/tunnex
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -buildvcs=false -ldflags="-s -w -X main.version=${GITHUB_REF_NAME:-dev}" \
              -o "../../runtime-artifacts/tunnex-agent-runtime-linux-$arch" ./cmd/tunnex-agent-runtime
          done
          cp ../../deploy/systemd/tunnex-agent-runtime.service ../../runtime-artifacts/tunnex-agent-runtime.service
          test -x ../../cli-artifacts/tnx-linux-amd64
          test -s ../../cli-artifacts/tnx-linux-arm64
          test -x ../../runtime-artifacts/tunnex-agent-runtime-linux-amd64
          test -s ../../runtime-artifacts/tunnex-agent-runtime-linux-arm64
          ../../cli-artifacts/tnx-linux-amd64 help 2>&1 | grep -F 'tunnex login'
      - name: Build Linux managed-agent release verifiers
        working-directory: apps/api
        env:
          GOFLAGS: -mod=readonly
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -buildvcs=false -ldflags="-s -w" \
              -o "../../runtime-artifacts/releaseverify-linux-$arch" ./cmd/releaseverify
          done
          test -s ../../runtime-artifacts/releaseverify-linux-amd64
          test -s ../../runtime-artifacts/releaseverify-linux-arm64
      - name: Upload Linux CLI artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tunnex-linux-cli
          path: |
            cli-artifacts/tnx-linux-amd64
            cli-artifacts/tnx-linux-arm64
          if-no-files-found: error
      - name: Upload Linux managed-agent runtime artifacts
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tunnex-linux-agent-runtime
          path: |
            runtime-artifacts/tunnex-agent-runtime-linux-amd64
            runtime-artifacts/tunnex-agent-runtime-linux-arm64
            runtime-artifacts/tunnex-agent-runtime.service
            runtime-artifacts/releaseverify-linux-amd64
            runtime-artifacts/releaseverify-linux-arm64
          if-no-files-found: error

  # Full stack + Playwright. BLOCKING as of EPIC 11 / S11-1 (was opportunistic).
  #
  # WHY THE PROMOTION: advisory status did the damage TWICE — it let an S10.2 regression merge (a
  # machine-credential "Name" field collided with the org "Name" field, ambiguous accessible names →
  # strict-mode violation), and then supplied the excuse for waving the red job away at merge time. A job
  # configured not to matter is the debt this slice repays. Sequence honored: fix → green → promote.
  # If e2e proves genuinely FLAKY under blocking status, that flakiness is its own FINDING with a
  # disposition — NOT a quiet demotion back to continue-on-error.
  e2e:
    needs: scope
    # ⛔ always() IS LOAD-BEARING. `needs: scope` alone makes a scope FAILURE skip this job — so the
    # integration signal disappears exactly when something is broken, which is when it is worth most.
    # Read classification directly so integration tests overlap the unit-test lanes.
    # Publication still requires gates and both E2E jobs to succeed.
    # Docs-only diffs cannot change API or SPA behaviour. NOT a required check, so a skip here does
    # not touch branch protection.
    if: always() && needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # observed ~3m; timeout is fail-closed, never a skip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Bring up the stack + seed
        run: |
          cp .env.example .env
          sh deploy/pull-ci-services.sh postgres redis
          docker compose up -d --build --wait
          make seed
      - name: Playwright E2E (SPA → API; normally under 1m after stack startup)
        run: |
          docker run --rm --network tunnex_default \
            -v "$PWD/e2e":/e2e -w /e2e -e E2E_BASE_URL=http://nginx:8080 \
            mcr.microsoft.com/playwright:v1.55.1-jammy \
            sh -c "npm ci --no-audit --no-fund && npx playwright test"
      - name: Capture E2E stack logs on failure
        if: failure()
        run: |
          mkdir -p e2e/test-results
          docker compose logs --no-color > e2e/test-results/compose.log 2>&1 || true
      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-failure-${{ github.run_attempt }}
          path: e2e/test-results/
          if-no-files-found: warn
          retention-days: 7

  # ── THE VIEWPORT LEG ────────────────────────────────────────────────────────────────────────────────────
  # Answers ONE question: did anything move that nobody asked to move? It cannot answer "is this right" —
  # only the founder's review does that (docs/EPIC-14-ui-redesign.md, the SECTION PROTOCOL).
  #
  # ⛔ ITS OWN JOB, NOT FOLDED INTO e2e. On 2026-08-01 `e2e` was RED for four consecutive pushes under a green
  # local gate; a visual diff buried inside it would inherit that invisibility. It also needs its own
  # artifacts (expected/actual/diff) and its failures MEAN something different: e2e red = broken behaviour,
  # visual red = something moved, possibly on purpose.
  #
  # ⛔⛔ FOUNDER RULE — THIS ENTIRE JOB IS ADVISORY FOR THE REST OF EPIC 14. NO STEP GATES A MERGE.
  #
  # It is NOT in `main`'s required contexts
  # and it is NOT to be added to them. Both steps are `continue-on-error`. The two-step split is kept because
  # it is good structure and costs nothing; the artifact and diff keep uploading.
  #
  # ⚠ THE ACCEPTED PRICE, RECORDED SO EPIC CLOSE RE-ARMS WITH KNOWLEDGE RATHER THAN REDISCOVERY:
  # the geometric overflow assertions and the strict-mode locators NEED A REAL BROWSER, so they cannot move
  # into `make web-gate` — jsdom has no layout engine. With this job advisory, THE CLASS THAT FOUND THE 65px
  # HEADER OVERFLOW, THE DUPLICATED HEALTH INDICATOR AND THE 500px AreaChart IS ADVISORY TOO. Nothing else
  # covers it. That is the cost of the ruling, knowingly taken.
  #
  # RE-ARM TRIGGER: EPIC 14 CLOSE — a named trigger, not a hope. Delete the two `continue-on-error` lines.
  visual:
    name: visual — ADVISORY for all of EPIC 14 (no step gates a merge)
    needs: scope
    if: always() && needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # observed ~3m; advisory findings remain advisory, broken setup still fails
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Bring up the stack + seed, with the gallery route COMPILED IN
        # VITE_VISUAL_GALLERY must reach the web image's BUILD, not the running container: Vite bakes
        # `import.meta.env` into the bundle, so a runtime env var arrives after the route has already been
        # eliminated. The first run of this job failed exactly that way — the gallery specs timed out on an
        # element that had never been compiled in, while the Overview specs failed correctly with
        # "snapshot doesn't exist". Two different failures, one expected, one not.
        run: |
          cp .env.example .env
          sh deploy/pull-ci-services.sh postgres redis
          docker compose up -d --build --wait
          make seed
        env:
          VITE_VISUAL_GALLERY: "1"
      # ⛔ STEP 1 — BLOCKING. Geometric invariants, the baseline census, and the strict-mode locators.
      # DETERMINISTIC: no committed image, no harvest, and no data difference can flake them. This is where
      # the 65px header overflow and the duplicate health indicator were actually found.
      - name: Geometric invariants + census (advisory)
        continue-on-error: true
        run: |
          docker run --rm --network tunnex_default \
            -v "$PWD/e2e":/e2e -w /e2e -e E2E_BASE_URL=http://nginx:8080 \
            mcr.microsoft.com/playwright:v1.55.1-jammy \
            sh -c "npm ci --no-audit --no-fund && npx playwright test -c playwright.visual.config.ts --grep-invert @pixel"

      # ⛔ STEP 2 — ADVISORY during EPIC 14. The committed-image comparison, which is red BY DESIGN while the
      # epic deliberately changes the shared surface every slice. The artifact and diff still upload below.
      # RE-ARM TRIGGER: EPIC 14 close — delete this `continue-on-error`, nothing else.
      - name: Pixel diff (advisory)
        continue-on-error: true
        run: |
          docker run --rm --network tunnex_default \
            -v "$PWD/e2e":/e2e -w /e2e -e E2E_BASE_URL=http://nginx:8080 \
            mcr.microsoft.com/playwright:v1.55.1-jammy \
            sh -c "npm ci --no-audit --no-fund && npx playwright test -c playwright.visual.config.ts --grep @pixel"
      - name: Upload the diff images for adjudication
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-diff
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # S7.4c: the ENTERPRISE e2e — brings the stack up as the enterprise edition
  # (TUNNEX_BUILD_TAGS=enterprise) with seed-enterprise laid on top of seed, then
  # runs the REAL S4.5/S4.5b assertions (SSO no-secret payload + a live shrink that
  # strands the seeded device → real 409 orphan render). BLOCKING as of EPIC 11 alongside `e2e` —
  # an advisory job on the ENTERPRISE path has the same blind spot as one on the open path (S11-1
  # condition (b)). The SECURITY half of S4.5 also gates in `gates` via TestGetSsoConfigPayloadCarriesNoSecret.
  e2e-enterprise:
    needs: scope
    # ⛔ always() IS LOAD-BEARING. `needs: scope` alone makes a scope FAILURE skip this job — so the
    # integration signal disappears exactly when something is broken, which is when it is worth most.
    # Read classification directly so integration tests overlap the unit-test lanes.
    # Publication still requires gates and both E2E jobs to succeed.
    # Docs-only diffs cannot change API or SPA behaviour. NOT a required check, so a skip here does
    # not touch branch protection.
    if: always() && needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # observed ~3m; timeout is fail-closed, never a skip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Bring up the ENTERPRISE stack + seed (base + enterprise fixtures)
        run: |
          cp .env.example .env
          sh deploy/pull-ci-services.sh postgres redis
          TUNNEX_BUILD_TAGS=enterprise docker compose up -d --build --wait
          make seed
          make seed-enterprise
      - name: Playwright enterprise E2E (real S4.5 / S4.5b)
        run: |
          docker run --rm --network tunnex_default \
            -v "$PWD/e2e":/e2e -w /e2e -e E2E_BASE_URL=http://nginx:8080 -e E2E_EDITION=enterprise \
            mcr.microsoft.com/playwright:v1.55.1-jammy \
            sh -c "npm ci --no-audit --no-fund && npx playwright test settings.enterprise.spec.ts"
      - name: Capture enterprise E2E stack logs on failure
        if: failure()
        run: |
          mkdir -p e2e/test-results
          docker compose logs --no-color > e2e/test-results/compose-enterprise.log 2>&1 || true
      - name: Upload enterprise E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-enterprise-failure-${{ github.run_attempt }}
          path: e2e/test-results/
          if-no-files-found: warn
          retention-days: 7

  # A published release version is immutable. Refuse a deleted/recreated or
  # moved tag before any matrix image or chart can overwrite its public tag.
  release-version-guard:
    if: >-
      vars.TUNNEX_RELEASE_PUBLISH_ENABLED == 'true' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      needs.gates.result == 'success' &&
      needs.e2e.result == 'success' &&
      needs.e2e-enterprise.result == 'success'
    needs: [gates, e2e, e2e-enterprise]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The authenticated GHCR token service needs create-capable scope to
      # distinguish a truly absent first-version ref from an inaccessible one.
      # The guard itself performs only manifest GETs.
      packages: write
    steps:
      - name: Refuse published tag reuse before any artifact publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*)
              if ! [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                echo "::error::release tags must use exact stable vMAJOR.MINOR.PATCH syntax; prerelease/build metadata cannot preserve byte-identical image and chart tags"
                exit 1
              fi
              CURRENT_TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq .sha)"
              if [[ "$CURRENT_TAG_SHA" != "$GITHUB_SHA" ]]; then
                echo "::error::release tag ${GITHUB_REF_NAME} moved from workflow source ${GITHUB_SHA} to ${CURRENT_TAG_SHA}; refusing publication"
                exit 1
              fi
              RELEASE_TAG="$GITHUB_REF_NAME"
              IMAGE_TAG="$GITHUB_REF_NAME"
              IS_VERSION=true
              ;;
            refs/heads/main)
              RELEASE_TAG="tunnex-build-${GITHUB_SHA}"
              IMAGE_TAG="sha-${GITHUB_SHA::7}"
              IS_VERSION=false
              ;;
            *) exit 0 ;;
          esac
          MARKER_NAME="Tunnex-release-source.json"
          MARKER_DIR="$(mktemp -d)"
          trap 'rm -rf "$MARKER_DIR"' EXIT
          MARKER_PATH="${MARKER_DIR}/${MARKER_NAME}"
          jq -cn \
            --arg tag "$RELEASE_TAG" \
            --arg source_sha "$GITHUB_SHA" \
            '{schema_version:1,tag:$tag,source_sha:$source_sha}' >"$MARKER_PATH"

          registry_ref_exists() {
            local repo="$1"
            local tag="$2"
            local token code
            token="$(curl -fsS --user "${GITHUB_ACTOR}:${GH_TOKEN}" --get \
              --data-urlencode "scope=repository:${repo}:pull,push" \
              --data-urlencode 'service=ghcr.io' \
              https://ghcr.io/token | jq -er '.token')"
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${repo}/manifests/${tag}")"
            case "$code" in
              200) return 0 ;;
              404) return 1 ;;
              *)
                echo "::error::GHCR probe for ${repo}:${tag} returned HTTP ${code}; refusing an ambiguous version publish"
                exit 1
                ;;
            esac
          }

          assert_artifact_refs_absent() {
            local repo
            for repo in \
              "${GITHUB_REPOSITORY}-api" \
              "${GITHUB_REPOSITORY}-web" \
              "${GITHUB_REPOSITORY}-nginx" \
              "${GITHUB_REPOSITORY}-node-agent" \
              "${GITHUB_REPOSITORY}-migrate" \
              "${GITHUB_REPOSITORY}-operator" \
              "${GITHUB_REPOSITORY}-ai-engine" \
              "${GITHUB_REPOSITORY}-app-proxy"; do
              if registry_ref_exists "$repo" "$IMAGE_TAG"; then
                echo "::error::GHCR already contains ${repo}:${IMAGE_TAG} but its release/source ledger is absent; the immutable ref is burned and must not be overwritten"
                exit 1
              fi
            done
            if [[ "$IS_VERSION" == true ]]; then
              local chart_version="${GITHUB_REF_NAME#v}"
              for repo in \
                "${GITHUB_REPOSITORY_OWNER}/charts/tunnex-host-posture" \
                "${GITHUB_REPOSITORY_OWNER}/charts/tunnex-gateway" \
                "${GITHUB_REPOSITORY_OWNER}/charts/tunnex-operator" \
                "${GITHUB_REPOSITORY_OWNER}/charts/tunnex-operator-crds"; do
                if registry_ref_exists "$repo" "$chart_version"; then
                  echo "::error::GHCR already contains ${repo}:${chart_version} but its release/source ledger is absent; the version is burned and must not be overwritten"
                  exit 1
                fi
              done
            fi
          }

          RELEASE_RESPONSE="${MARKER_DIR}/release.json"
          RELEASE_REF_RESPONSE="${MARKER_DIR}/release-ref.json"
          ENCODED_RELEASE_TAG="$(jq -rn --arg value "$RELEASE_TAG" '$value | @uri')"
          RELEASE_REF_STATUS="$(curl -sS -o "$RELEASE_REF_RESPONSE" -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${ENCODED_RELEASE_TAG}")"
          case "$RELEASE_REF_STATUS" in
            200)
              CURRENT_RELEASE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
              if [[ "$CURRENT_RELEASE_SHA" != "$GITHUB_SHA" ]]; then
                echo "::error::release source ref ${RELEASE_TAG} already points to ${CURRENT_RELEASE_SHA}, not workflow source ${GITHUB_SHA}; refusing draft creation or adoption"
                exit 1
              fi
              ;;
            404)
              if [[ "$IS_VERSION" == true ]]; then
                echo "::error::release source ref ${RELEASE_TAG} disappeared after workflow dispatch; refusing publication"
                exit 1
              fi
              ;;
            *)
              cat "$RELEASE_REF_RESPONSE" >&2
              echo "::error::GitHub release source-ref lookup for ${RELEASE_TAG} returned HTTP ${RELEASE_REF_STATUS}; refusing an ambiguous publish"
              exit 1
              ;;
          esac
          RELEASE_STATUS="$(curl -sS -o "$RELEASE_RESPONSE" -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${ENCODED_RELEASE_TAG}")"
          # The tag endpoint returns 404 for drafts, including a release reverted
          # to draft. Enumerate authenticated releases before creating anything.
          # Multiple drafts for one tag are ambiguous: never pick the first one.
          if [[ "$RELEASE_STATUS" == 404 ]]; then
            RELEASE_LIST="${MARKER_DIR}/releases.json"
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" >"$RELEASE_LIST"
            jq --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)]' "$RELEASE_LIST" >"${MARKER_DIR}/matching-releases.json"
            MATCH_COUNT="$(jq -er 'length' "${MARKER_DIR}/matching-releases.json")"
            if [[ "$MATCH_COUNT" -gt 1 ]]; then
              echo "::error::multiple releases exist for ${RELEASE_TAG}; refusing ambiguous draft adoption"
              exit 1
            elif [[ "$MATCH_COUNT" == 1 ]]; then
              jq '.[0]' "${MARKER_DIR}/matching-releases.json" >"$RELEASE_RESPONSE"
              RELEASE_STATUS=200
            fi
          fi
          case "$RELEASE_STATUS" in
            200)
              IS_DRAFT="$(jq -er '.draft | if type == "boolean" then tostring else error("release draft flag must be boolean") end' "$RELEASE_RESPONSE")"
              if [[ "$IS_DRAFT" != true ]]; then
                # GitHub's Publish release button creates a public, empty shell.
                # Adopt only a mutable version shell with no prior artifacts;
                # every downstream publication gate still requires a draft.
                if [[ "$IS_VERSION" != true ]] || ! jq -e '.immutable == false and (.assets | type == "array" and length == 0)' "$RELEASE_RESPONSE" >/dev/null; then
                  echo "::error::release ${RELEASE_TAG} is already published with assets or is immutable; refusing source reuse"
                  exit 1
                fi
                RELEASE_ID="$(jq -er '.id | select(type == "number" and . > 0)' "$RELEASE_RESPONSE")"
                assert_artifact_refs_absent
                test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)" = "$GITHUB_SHA"
                gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=true >"${MARKER_DIR}/adopted-release.json"
                jq -e --argjson id "$RELEASE_ID" --arg tag "$RELEASE_TAG" '.id == $id and .tag_name == $tag and .draft == true and .immutable == false and (.assets | type == "array" and length == 0)' "${MARKER_DIR}/adopted-release.json" >/dev/null
                mv "${MARKER_DIR}/adopted-release.json" "$RELEASE_RESPONSE"
              fi
              ACTUAL_MARKER="${MARKER_DIR}/actual/${MARKER_NAME}"
              mkdir -p "${MARKER_DIR}/actual"
              if gh release download "$RELEASE_TAG" --pattern "$MARKER_NAME" --dir "${MARKER_DIR}/actual" >/dev/null 2>&1; then
                if ! cmp -s "$MARKER_PATH" "$ACTUAL_MARKER"; then
                  echo "::error::draft release ${RELEASE_TAG} belongs to a different source; refusing moved-ref publication"
                  exit 1
                fi
              else
                ASSET_COUNT="$(jq -er '.assets | length' "$RELEASE_RESPONSE")"
                if [[ "$ASSET_COUNT" != 0 ]]; then
                  echo "::error::draft release ${RELEASE_TAG} has assets but no source ledger; refusing ambiguous adoption"
                  exit 1
                fi
                assert_artifact_refs_absent
                gh release upload "$RELEASE_TAG" "$MARKER_PATH"
              fi
              ;;
            404)
              assert_artifact_refs_absent
              if [[ "$IS_VERSION" == true ]]; then
                gh release create "$RELEASE_TAG" "$MARKER_PATH" \
                  --title "$RELEASE_TAG" --generate-notes --draft --verify-tag
              else
                gh release create "$RELEASE_TAG" "$MARKER_PATH" \
                  --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes \
                  --draft --prerelease --latest=false
              fi
              ;;
            *)
              cat "$RELEASE_RESPONSE" >&2
              echo "::error::GitHub release lookup for ${RELEASE_TAG} returned HTTP ${RELEASE_STATUS}; refusing an ambiguous publish"
              exit 1
              ;;
          esac
          # GitHub defers tag creation for a draft release. Create the missing
          # main-build ref explicitly only AFTER source-ledger validation. Never
          # move/update an existing ref, and never recreate a missing version tag.
          if [[ "$RELEASE_REF_STATUS" == 404 && "$IS_VERSION" == false ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${RELEASE_TAG}" -f "sha=${GITHUB_SHA}" >/dev/null
          fi
          CURRENT_RELEASE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
          if [[ "$CURRENT_RELEASE_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::release source ref ${RELEASE_TAG} moved from workflow source ${GITHUB_SHA} to ${CURRENT_RELEASE_SHA}; refusing publication"
            exit 1
          fi

  # S6.6 zero-build deploy: publish the prebuilt, MULTI-ARCH (amd64+arm64) service images to ghcr
  # so a customer never builds from source. Runs ONLY on a push (never PRs) and ONLY after gates,
  # and both behavioural E2E jobs pass. A failed build must not keep publishing for minutes
  # after its failure or move mutable tags to code the product tests rejected. main pushes publish
  # :latest + :sha (opt-in / main-tracking); a v* release tag
  # publishes the reproducible :vX.Y.Z that deploy/tunnex.yml pins via ${TUNNEX_VERSION}.
  # Compile the C/IPsec dependency on native CPUs, including on PRs. Publication
  # remains behind the same release and E2E gates and uses exact build digests.
  node-native:
    name: Native node-agent ${{ matrix.arch }}
    needs: [release-version-guard, gates, e2e, e2e-enterprise]
    if: >-
      !cancelled() &&
      needs.gates.result == 'success' &&
      needs.e2e.result == 'success' &&
      needs.e2e-enterprise.result == 'success' &&
      (github.event_name == 'pull_request' ||
       (vars.TUNNEX_RELEASE_PUBLISH_ENABLED == 'true' &&
        github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
        needs.release-version-guard.result == 'success'))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04, machine: x86_64 }
          - { arch: arm64, runner: ubuntu-24.04-arm, machine: aarch64 }
    steps:
      - name: Revalidate release source ledger immediately before image publication
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) RELEASE_TAG="$GITHUB_REF_NAME" ;;
            refs/heads/main) RELEASE_TAG="tunnex-build-${GITHUB_SHA}" ;;
            *) exit 1 ;;
          esac
          CURRENT_RELEASE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
          if [[ "$CURRENT_RELEASE_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::release source ref ${RELEASE_TAG} moved from workflow source ${GITHUB_SHA} to ${CURRENT_RELEASE_SHA}; refusing image publication"
            exit 1
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          EXPECTED="$(jq -cn --arg tag "$RELEASE_TAG" --arg source_sha "$GITHUB_SHA" '{schema_version:1,tag:$tag,source_sha:$source_sha}')"
          ACTUAL="$(gh release download "$RELEASE_TAG" --pattern Tunnex-release-source.json --output -)"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::release source ledger changed before image publication"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify native architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: test "$(uname -m)" = "$EXPECTED_MACHINE"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}-node-agent
          # A version tag must not roll the main-tracking `latest` tag backward.
          # `latest` is emitted only by the explicit default-branch raw rule.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-,enable={{is_default_branch}}
            type=ref,event=tag
      - name: Build native node-agent
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/node.Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}-node-agent,push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}
          build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha,scope=node-agent-native-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=node-agent-native-${{ matrix.arch }},timeout=2m,ignore-error=true
      - name: Save exact image digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/node-digests"
          touch "$RUNNER_TEMP/node-digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'push'
        with:
          name: node-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/node-digests/*
          if-no-files-found: error
          retention-days: 1

  # Exercise the release Dockerfile on both targets before merge. No registry writes.
  operator-build:
    name: Operator image ${{ matrix.arch }}
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build operator without emulation
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/operator
          file: apps/operator/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          build-args: VERSION=${{ github.sha }}
          cache-from: |
            type=gha,scope=operator-pr-${{ matrix.arch }}
            type=gha,scope=operator
          cache-to: type=gha,mode=max,scope=operator-pr-${{ matrix.arch }},timeout=2m,ignore-error=true

  # Compile the pinned CGO engine and run zero-spend native extension tests on
  # each real CPU; no QEMU build or unpaid-test requirement is deferred to install.
  ai-native:
    name: Native AI engine ${{ matrix.arch }}
    needs: [release-version-guard, gates, e2e, e2e-enterprise]
    if: >-
      !cancelled() &&
      needs.gates.result == 'success' &&
      needs.e2e.result == 'success' &&
      needs.e2e-enterprise.result == 'success' &&
      (github.event_name == 'pull_request' ||
       (vars.TUNNEX_RELEASE_PUBLISH_ENABLED == 'true' &&
        github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
        needs.release-version-guard.result == 'success'))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04, machine: x86_64 }
          - { arch: arm64, runner: ubuntu-24.04-arm, machine: aarch64 }
    steps:
      - name: Revalidate release source ledger immediately before image publication
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) RELEASE_TAG="$GITHUB_REF_NAME" ;;
            refs/heads/main) RELEASE_TAG="tunnex-build-${GITHUB_SHA}" ;;
            *) exit 1 ;;
          esac
          CURRENT_RELEASE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
          if [[ "$CURRENT_RELEASE_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::release source ref ${RELEASE_TAG} moved from workflow source ${GITHUB_SHA} to ${CURRENT_RELEASE_SHA}; refusing image publication"
            exit 1
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          EXPECTED="$(jq -cn --arg tag "$RELEASE_TAG" --arg source_sha "$GITHUB_SHA" '{schema_version:1,tag:$tag,source_sha:$source_sha}')"
          ACTUAL="$(gh release download "$RELEASE_TAG" --pattern Tunnex-release-source.json --output -)"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::release source ledger changed before image publication"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify native architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: test "$(uname -m)" = "$EXPECTED_MACHINE"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}-ai-engine
          # A version tag must not roll the main-tracking `latest` tag backward.
          # `latest` is emitted only by the explicit default-branch raw rule.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-,enable={{is_default_branch}}
            type=ref,event=tag
      - name: Build native ai-engine
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/ai-engine/Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}-ai-engine,push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}
          build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha,scope=ai-engine-native-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ai-engine-native-${{ matrix.arch }},timeout=2m,ignore-error=true
      - name: Save exact image digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/ai-digests"
          touch "$RUNNER_TEMP/ai-digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'push'
        with:
          name: ai-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/ai-digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish ${{ matrix.image.name }} — amd64 + arm64 (timeout 20m)
    if: >-
      vars.TUNNEX_RELEASE_PUBLISH_ENABLED == 'true' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      needs.node-native.result == 'success' &&
      needs.ai-native.result == 'success' &&
      needs.release-version-guard.result == 'success' &&
      needs.gates.result == 'success' &&
      needs.e2e.result == 'success' &&
      needs.e2e-enterprise.result == 'success'
    needs: [release-version-guard, gates, e2e, e2e-enterprise, node-native, ai-native]
    runs-on: ubuntu-latest
    timeout-minutes: 20 # node-agent is assembled from native builds; other image budgets unchanged
    permissions:
      # Draft release/ledger reads require push-capable credentials. This job
      # remains push-only after the release guard and both E2E jobs pass.
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      matrix:
        image:
          - { name: api, dockerfile: deploy/docker/api.Dockerfile, context: . }
          - { name: web, dockerfile: deploy/docker/web.Dockerfile, context: . }
          - { name: nginx, dockerfile: deploy/docker/nginx.Dockerfile, context: . }
          - { name: node-agent, dockerfile: deploy/docker/node.Dockerfile, context: . }
          - { name: migrate, dockerfile: deploy/docker/migrate.Dockerfile, context: . }
          - { name: operator, dockerfile: apps/operator/Dockerfile, context: apps/operator }
          - { name: ai-engine, dockerfile: apps/ai-engine/Dockerfile, context: . }
          - { name: app-proxy, dockerfile: deploy/docker/app-proxy.Dockerfile, context: . }
    steps:
      - name: Revalidate release source ledger immediately before image publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) RELEASE_TAG="$GITHUB_REF_NAME" ;;
            refs/heads/main) RELEASE_TAG="tunnex-build-${GITHUB_SHA}" ;;
            *) exit 1 ;;
          esac
          CURRENT_RELEASE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
          if [[ "$CURRENT_RELEASE_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::release source ref ${RELEASE_TAG} moved from workflow source ${GITHUB_SHA} to ${CURRENT_RELEASE_SHA}; refusing image publication"
            exit 1
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          EXPECTED="$(jq -cn --arg tag "$RELEASE_TAG" --arg source_sha "$GITHUB_SHA" '{schema_version:1,tag:$tag,source_sha:$source_sha}')"
          ACTUAL="$(gh release download "$RELEASE_TAG" --pattern Tunnex-release-source.json --output -)"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::release source ledger changed before image publication"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - if: matrix.image.name != 'node-agent' && matrix.image.name != 'ai-engine'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3 # arm64 emulation for the multi-arch build
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image.name }}
          # A version tag must not roll the main-tracking `latest` tag backward.
          # `latest` is emitted only by the explicit default-branch raw rule.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-,enable={{is_default_branch}}
            type=ref,event=tag
      - name: Build + push ${{ matrix.image.name }} for both architectures
        if: matrix.image.name != 'node-agent' && matrix.image.name != 'ai-engine'
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Tag builds report the exact vX release; main builds report the exact
          # source SHA. The binary owns this provenance, not a chart label/env.
          build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          # Per-image scopes prevent concurrent exporters overwriting one shared `buildkit` cache.
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }},timeout=2m,ignore-error=true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: matrix.image.name == 'node-agent'
        with:
          pattern: node-digest-*
          path: ${{ runner.temp }}/node-digests
          merge-multiple: true
      - name: Publish native node-agent index
        if: matrix.image.name == 'node-agent'
        id: node-index
        env:
          IMAGE: ghcr.io/${{ github.repository }}-node-agent
          TAGS: ${{ steps.meta.outputs.tags }}
        run: bash deploy/publish-node-index.sh "$RUNNER_TEMP/node-digests"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: matrix.image.name == 'ai-engine'
        with:
          pattern: ai-digest-*
          path: ${{ runner.temp }}/ai-digests
          merge-multiple: true
      - name: Publish native AI engine index
        if: matrix.image.name == 'ai-engine'
        id: ai-index
        env:
          IMAGE: ghcr.io/${{ github.repository }}-ai-engine
          TAGS: ${{ steps.meta.outputs.tags }}
        run: bash deploy/publish-node-index.sh "$RUNNER_TEMP/ai-digests"
      - name: Attest ${{ matrix.image.name }} image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}-${{ matrix.image.name }}
          subject-digest: ${{ steps.node-index.outputs.digest || steps.ai-index.outputs.digest || steps.build.outputs.digest }}
          push-to-registry: true

  # Keep the separately hosted installer site aligned with this repository's
  # successful main or version-tag build. The web repository turns this event
  # into a normal reviewable PR; it never accepts an arbitrary branch or
  # mutable latest tag.
  # ⛔ A PUBLISH THAT CANNOT BE PULLED IS NOT A PUBLISH, AND CI CALLED IT GREEN FOR A DAY.
  #
  # PR #17 moved the runtime images from ghcr.io/iotunnex/* to ghcr.io/tunnexio/*. The old packages were
  # public; GHCR packages created fresh by Actions are PRIVATE BY DEFAULT, and visibility is a per-package
  # setting nobody flipped. So every publish job succeeded, `latest` and `sha-<short>` were pushed, the
  # installer site synced the new paths — and `curl https://get.tunnex.io | sh` died on a customer's EC2
  # box with `unauthorized`, because the images it names are unreadable to the anonymous world.
  #
  # ⚠ THIS MUST BE ITS OWN JOB ON A FRESH RUNNER, and that is the entire point. The publish job has
  # already run docker/login-action, so ANY check inside it authenticates as the pusher and passes while
  # the public still cannot pull. A check that shares credentials with the thing it audits proves nothing.
  # No login step here, no GITHUB_TOKEN, no Authorization header — the same view a stranger gets.
  publish-pullable:
    name: published images must be anonymously pullable
    needs: [publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Anonymous manifest fetch for every image and tag we just published
        run: |
          set -euo pipefail

          # Mirrors the publish job: images are ghcr.io/<repo>-<name>, tagged `latest` plus
          # `sha-<short>` on the default branch (docker/metadata-action type=sha,format=short).
          # The installer PINS the sha- tag, so checking only `latest` would miss the tag that matters.
          # ⚠ THE TAG SET DEPENDS ON THE EVENT, and getting that wrong makes this gate fail on exactly
          # the builds that matter most. A main push publishes `latest` + `sha-<short>`; a v* TAG push
          # publishes only the version (`v0.1.2`) because is_default_branch is false on a tag ref.
          # Checking a fixed list would have
          # red-flagged every release build for a tag that was never pushed.
          IMAGES="api web nginx node-agent migrate operator ai-engine app-proxy"
          case "$GITHUB_REF" in
            refs/tags/*) TAGS="${GITHUB_REF#refs/tags/}" ;;
            *)           TAGS="latest sha-${GITHUB_SHA::7}" ;;
          esac
          echo ">> checking tags: $TAGS"
          FAILED=0

          for name in $IMAGES; do
            REPO="${GITHUB_REPOSITORY}-${name}"   # e.g. tunnexio/tunnex-api

            # GHCR hands anonymous callers a pull token ONLY for public packages. No token is the
            # cleanest possible signal that a package is private — it fails before any manifest request.
            TOKEN="$(python3 -c 'import json,sys,urllib.request; url="https://ghcr.io/token?scope=repository:"+sys.argv[1]+":pull&service=ghcr.io"; print(json.load(urllib.request.urlopen(url, timeout=15)).get("token", ""))' "$REPO" || true)"
            if [ -z "$TOKEN" ]; then
              echo "::error::ghcr.io/${REPO} is NOT publicly pullable — GHCR granted no anonymous token. Set the package to Public: https://github.com/orgs/${GITHUB_REPOSITORY_OWNER}/packages"
              FAILED=1
              continue
            fi

            for tag in $TAGS; do
              # Retried: GHCR can lag a few seconds behind a push, and a flaky gate teaches people to
              # re-run it rather than read it.
              code=""
              for _ in 1 2 3 4 5; do
                code="$(curl -s -o /dev/null -w '%{http_code}' \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json' \
                  "https://ghcr.io/v2/${REPO}/manifests/${tag}")"
                [ "$code" = "200" ] && break
                sleep 6
              done
              if [ "$code" = "200" ]; then
                echo "  ok    ghcr.io/${REPO}:${tag}"
              else
                echo "::error::ghcr.io/${REPO}:${tag} is not anonymously pullable (HTTP ${code})"
                FAILED=1
              fi
            done
          done

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "One or more published images cannot be pulled by an anonymous client."
            echo "The installer (deploy/get.sh) pulls exactly these references with no credentials,"
            echo "so this is what a user's install would do. Fix the package visibility, not this check."
            exit 1
          fi
          echo ""
          echo "All published images are anonymously pullable."


  sync-installer-site:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      needs.publish.result == 'success' &&
      needs.publish-pullable.result == 'success'
    needs: [publish, publish-pullable]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dispatch exact-source installer sync
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.TUNNEX_WEB_SYNC_TOKEN }}
          script: |
            const sha = context.sha;
            const sourceRef = context.ref.replace('refs/heads/', '').replace('refs/tags/', '');
            await github.rest.repos.createDispatchEvent({
              owner: 'tunnexio',
              repo: 'tunnex-web',
              event_type: 'tunnex-main-published',
              client_payload: {
                source_sha: sha,
                source_ref: sourceRef,
                installer_url: `https://raw.githubusercontent.com/tunnexio/tunnex/${sha}/deploy/get.sh`,
                powershell_installer_url: `https://raw.githubusercontent.com/tunnexio/tunnex/${sha}/deploy/install.ps1`,
              },
            });

  # S6.6 pipe-safe install: on a v* release tag, attach install.sh + its SHA256 as release assets so
  # the docs can offer a download-verify-inspect-run path (the security-conscious default) and the
  # marketing site can serve the SAME single script — it must never fork or hand-maintain a copy.
  release-assets:
    # Main builds are installable by immutable SHA as well as version tags. Publish a
    # matching build release so get.tunnex.io can fetch the descriptor it names.
    if: >-
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      needs.publish.result == 'success' &&
      needs.publish-pullable.result == 'success'
    # A release asset that appears before all image tags finish is a broken release. The matrix result
    # becomes success only after every architecture of every service has been pushed.
    needs: [publish, publish-pullable, cli-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.8'
          cache: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Helm for release charts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.4
      - name: Refuse published tag reuse before chart publication
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq .sha)" = "$GITHUB_SHA"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
            if [[ "$IS_DRAFT" != true ]]; then
              echo "::error::release ${GITHUB_REF_NAME} is already published and immutable; refusing tag reuse before any OCI chart publication"
              exit 1
            fi
          fi
          EXPECTED="$(jq -cn --arg tag "$GITHUB_REF_NAME" --arg source_sha "$GITHUB_SHA" '{schema_version:1,tag:$tag,source_sha:$source_sha}')"
          ACTUAL="$(gh release download "$GITHUB_REF_NAME" --pattern Tunnex-release-source.json --output -)"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::release source ledger changed before chart publication"
            exit 1
          fi
      - name: Download Linux CLI artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tunnex-linux-cli
          path: cli-artifacts
      - name: Download Linux managed-agent runtime artifacts
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tunnex-linux-agent-runtime
          path: runtime-artifacts
      - name: Checksum platform installers (bare filename so `sha256sum -c` works in the download dir)
        working-directory: deploy
        run: |
          sha256sum install.sh > install.sh.sha256
          sha256sum install.ps1 > install.ps1.sha256
      - name: Package and publish version-matched Helm charts
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CHART_VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p chart-artifacts
          bash deploy/helm-package-reproducible.sh deploy/helm/tunnex-host-posture \
            "$CHART_VERSION" "$GITHUB_REF_NAME" chart-artifacts
          bash deploy/helm-package-reproducible.sh deploy/helm/tunnex-gateway \
            "$CHART_VERSION" "$GITHUB_REF_NAME" chart-artifacts
          bash deploy/helm-package-reproducible.sh deploy/helm/tunnex-operator \
            "$CHART_VERSION" "$GITHUB_REF_NAME" chart-artifacts
          bash deploy/helm-package-reproducible.sh deploy/helm/tunnex-operator-crds \
            "$CHART_VERSION" "$GITHUB_REF_NAME" chart-artifacts
          (cd chart-artifacts && sha256sum ./*.tgz > Tunnex-Helm-SHA256SUMS)
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          EXISTING_CHART_DIR="$(mktemp -d)"
          trap 'rm -rf "$EXISTING_CHART_DIR"' EXIT
          publish_or_verify_chart() {
            local chart="$1"
            local package="chart-artifacts/${chart}-${CHART_VERSION}.tgz"
            local remote="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/${chart}"
            local existing="${EXISTING_CHART_DIR}/${chart}-${CHART_VERSION}.tgz"
            local pull_log="${EXISTING_CHART_DIR}/${chart}.pull.log"
            if helm pull "$remote" --version "$CHART_VERSION" --destination "$EXISTING_CHART_DIR" >"$pull_log" 2>&1; then
              if ! cmp -s "$package" "$existing"; then
                echo "::error::refusing to overwrite existing OCI chart ${chart}:${CHART_VERSION} with different bytes; publish a new version"
                exit 1
              fi
              echo "Reusing exact matching OCI chart ${chart}:${CHART_VERSION}"
              return
            fi
            if ! grep -Eqi 'manifest unknown|not found' "$pull_log"; then
              cat "$pull_log" >&2
              echo "::error::could not prove whether OCI chart ${chart}:${CHART_VERSION} exists; refusing to publish"
              exit 1
            fi
            helm push "$package" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
          }
          publish_or_verify_chart tunnex-host-posture
          publish_or_verify_chart tunnex-gateway
          publish_or_verify_chart tunnex-operator
          publish_or_verify_chart tunnex-operator-crds
      - name: Prove published Helm charts are anonymously pullable
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          CHART_VERSION="${GITHUB_REF_NAME#v}"
          ANON_REGISTRY_DIR="$(mktemp -d)"
          ANON_DOCKER_DIR="$(mktemp -d)"
          ANON_HELM_DIR="$(mktemp -d)"
          ANON_REGISTRY_CONFIG="${ANON_REGISTRY_DIR}/config.json"
          trap 'rm -rf "$ANON_REGISTRY_DIR" "$ANON_DOCKER_DIR" "$ANON_HELM_DIR"' EXIT
          for chart in tunnex-host-posture tunnex-gateway tunnex-operator tunnex-operator-crds; do
            ok=false
            for _ in 1 2 3 4 5; do
              # Helm falls back to Docker's credential store. Isolate BOTH
              # configs/caches so the docker/login-action credential above
              # cannot make a private chart look anonymously pullable.
              if DOCKER_CONFIG="$ANON_DOCKER_DIR" \
                HELM_REGISTRY_CONFIG="$ANON_REGISTRY_CONFIG" \
                HELM_CONFIG_HOME="$ANON_HELM_DIR/config" \
                HELM_CACHE_HOME="$ANON_HELM_DIR/cache" \
                HELM_DATA_HOME="$ANON_HELM_DIR/data" \
                helm pull \
                "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/${chart}" \
                --version "$CHART_VERSION" --destination /tmp; then
                ok=true
                break
              fi
              sleep 6
            done
            if [[ "$ok" != true ]]; then
              echo "::error::Helm chart ${chart}:${CHART_VERSION} is not anonymously pullable; set the GHCR package visibility to Public"
              exit 1
            fi
          done
      - name: Build and sign the immutable release manifest
        env:
          TUNNEX_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.TUNNEX_RELEASE_SIGNING_PRIVATE_KEY }}
          TUNNEX_RELEASE_KEY_ID: ${{ secrets.TUNNEX_RELEASE_KEY_ID }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          test -n "$TUNNEX_RELEASE_SIGNING_PRIVATE_KEY"
          test -n "$TUNNEX_RELEASE_KEY_ID"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_VERSION="$GITHUB_REF_NAME"
            IMAGE_TAG="$GITHUB_REF_NAME"
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_VERSION="sha-${SOURCE_SHA:0:7}"
            IMAGE_TAG="$RELEASE_VERSION"
            RELEASE_TAG="tunnex-build-${SOURCE_SHA}"
          fi
          runtime_amd64="runtime-artifacts/tunnex-agent-runtime-linux-amd64"
          runtime_arm64="runtime-artifacts/tunnex-agent-runtime-linux-arm64"
          runtime_unit="runtime-artifacts/tunnex-agent-runtime.service"
          test -s "$runtime_amd64"
          test -s "$runtime_arm64"
          test -s "$runtime_unit"
          runtime_amd64_sha=$(sha256sum "$runtime_amd64" | awk '{print $1}')
          runtime_arm64_sha=$(sha256sum "$runtime_arm64" | awk '{print $1}')
          runtime_unit_sha=$(sha256sum "$runtime_unit" | awk '{print $1}')
          digest() {
            local image="$1" arch="$2"
            docker buildx imagetools inspect --raw "$image:$IMAGE_TAG" |
              jq -er --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' |
              head -n1
          }
          image_prefix="ghcr.io/${GITHUB_REPOSITORY}"
          api_amd64=$(digest "${image_prefix}-api" amd64); api_arm64=$(digest "${image_prefix}-api" arm64)
          web_amd64=$(digest "${image_prefix}-web" amd64); web_arm64=$(digest "${image_prefix}-web" arm64)
          nginx_amd64=$(digest "${image_prefix}-nginx" amd64); nginx_arm64=$(digest "${image_prefix}-nginx" arm64)
          node_amd64=$(digest "${image_prefix}-node-agent" amd64); node_arm64=$(digest "${image_prefix}-node-agent" arm64)
          migrate_amd64=$(digest "${image_prefix}-migrate" amd64); migrate_arm64=$(digest "${image_prefix}-migrate" arm64)
          operator_amd64=$(digest "${image_prefix}-operator" amd64); operator_arm64=$(digest "${image_prefix}-operator" arm64)
          ai_amd64=$(digest "${image_prefix}-ai-engine" amd64); ai_arm64=$(digest "${image_prefix}-ai-engine" arm64)
          app_proxy_amd64=$(digest "${image_prefix}-app-proxy" amd64); app_proxy_arm64=$(digest "${image_prefix}-app-proxy" arm64)
          jq -n \
            --argjson sequence "$RUN_NUMBER" --arg version "$RELEASE_VERSION" --arg source_sha "$SOURCE_SHA" \
            --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" \
            --arg api_amd64 "$api_amd64" --arg api_arm64 "$api_arm64" --arg web_amd64 "$web_amd64" --arg web_arm64 "$web_arm64" \
            --arg nginx_amd64 "$nginx_amd64" --arg nginx_arm64 "$nginx_arm64" --arg node_amd64 "$node_amd64" --arg node_arm64 "$node_arm64" \
            --arg migrate_amd64 "$migrate_amd64" --arg migrate_arm64 "$migrate_arm64" \
            --arg operator_amd64 "$operator_amd64" --arg operator_arm64 "$operator_arm64" \
            --arg ai_amd64 "$ai_amd64" --arg ai_arm64 "$ai_arm64" \
            --arg app_proxy_amd64 "$app_proxy_amd64" --arg app_proxy_arm64 "$app_proxy_arm64" \
            --arg runtime_amd64_sha "$runtime_amd64_sha" --arg runtime_arm64_sha "$runtime_arm64_sha" \
            --arg runtime_unit_sha "$runtime_unit_sha" \
            '{schema_version:1,sequence:$sequence,version:$version,source_sha:$source_sha,published_at:$published_at,min_protocol:1,compatibility:"open+enterprise",downtime:"brief control-plane restart",release_notes_url:$notes,images:{api:{linux_amd64_digest:$api_amd64,linux_arm64_digest:$api_arm64},web:{linux_amd64_digest:$web_amd64,linux_arm64_digest:$web_arm64},nginx:{linux_amd64_digest:$nginx_amd64,linux_arm64_digest:$nginx_arm64},"node-agent":{linux_amd64_digest:$node_amd64,linux_arm64_digest:$node_arm64},migrate:{linux_amd64_digest:$migrate_amd64,linux_arm64_digest:$migrate_arm64},operator:{linux_amd64_digest:$operator_amd64,linux_arm64_digest:$operator_arm64},"ai-engine":{linux_amd64_digest:$ai_amd64,linux_arm64_digest:$ai_arm64},"app-proxy":{linux_amd64_digest:$app_proxy_amd64,linux_arm64_digest:$app_proxy_arm64}},managed_agent_runtime:{binary:"tunnex-agent-runtime",version:$version,unit:{name:"tunnex-agent-runtime.service",sha256:$runtime_unit_sha,source_sha:$source_sha},linux_amd64:{name:"tunnex-agent-runtime-linux-amd64",sha256:$runtime_amd64_sha,source_sha:$source_sha},linux_arm64:{name:"tunnex-agent-runtime-linux-arm64",sha256:$runtime_arm64_sha,source_sha:$source_sha}}}' > release-unsigned.json
          (cd apps/api && GOFLAGS=-mod=readonly go run ./cmd/releasesign -manifest ../../release-unsigned.json -private-key "$TUNNEX_RELEASE_SIGNING_PRIVATE_KEY" -kid "$TUNNEX_RELEASE_KEY_ID" -output ../../release.json)
          rm release-unsigned.json
          sha256sum release.json > release.json.sha256
          verifier_amd64_sha=$(sha256sum runtime-artifacts/releaseverify-linux-amd64 | awk '{print $1}')
          verifier_arm64_sha=$(sha256sum runtime-artifacts/releaseverify-linux-arm64 | awk '{print $1}')
          jq -n --arg version "$RELEASE_VERSION" --arg source_sha "$SOURCE_SHA" \
            --arg amd64 "$verifier_amd64_sha" --arg arm64 "$verifier_arm64_sha" \
            '{schema_version:1,purpose:"tunnex-agent-bootstrap-verifier",version:$version,source_sha:$source_sha,linux_amd64:{name:"releaseverify-linux-amd64",sha256:$amd64,source_sha:$source_sha},linux_arm64:{name:"releaseverify-linux-arm64",sha256:$arm64,source_sha:$source_sha}}' > verifier-unsigned.json
          (cd apps/api && GOFLAGS=-mod=readonly go run ./cmd/releasesign -bootstrap-verifier \
            -manifest ../../verifier-unsigned.json -private-key "$TUNNEX_RELEASE_SIGNING_PRIVATE_KEY" \
            -kid "$TUNNEX_RELEASE_KEY_ID" -output ../../agent-bootstrap-verifier.json \
            -public-key-output ../../release-verification-public-key.txt)
          rm verifier-unsigned.json
          (cd apps/api && GOFLAGS=-mod=readonly go run ./cmd/releaseverify \
            -manifest ../../release.json -public-key "$(cat ../../release-verification-public-key.txt)" \
            -expected-source-sha "$SOURCE_SHA" -expected-key-id "$TUNNEX_RELEASE_KEY_ID" \
            -bootstrap-verifier ../../agent-bootstrap-verifier.json -bootstrap-verifier-assets ../../runtime-artifacts)
      - name: Attach platform installers + checksums to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="tunnex-build-${GITHUB_SHA}"
          fi
          CURRENT_RELEASE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
          if [[ "$CURRENT_RELEASE_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::release source ref ${RELEASE_TAG} moved from workflow source ${GITHUB_SHA} to ${CURRENT_RELEASE_SHA}; refusing asset publication"
            exit 1
          fi
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]]; then
            echo "::error::release ${RELEASE_TAG} is absent or no longer the source-ledger draft; refusing asset publication"
            exit 1
          fi
          EXPECTED="$(jq -cn --arg tag "$RELEASE_TAG" --arg source_sha "$GITHUB_SHA" '{schema_version:1,tag:$tag,source_sha:$source_sha}')"
          ACTUAL="$(gh release download "$RELEASE_TAG" --pattern Tunnex-release-source.json --output -)"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::release source ledger changed before asset publication"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" \
            deploy/install.sh deploy/install.sh.sha256 \
            deploy/install.ps1 deploy/install.ps1.sha256 \
            release.json release.json.sha256 --clobber
      - name: Attest installer and release descriptor
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            deploy/install.sh
            deploy/install.ps1
            release.json
            agent-bootstrap-verifier.json
            runtime-artifacts/releaseverify-linux-amd64
            runtime-artifacts/releaseverify-linux-arm64
      - name: Attach Linux CLI binaries + checksum to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          amd64="cli-artifacts/tnx-linux-amd64"
          arm64="cli-artifacts/tnx-linux-arm64"
          # GitHub Actions artifact extraction does not preserve executable mode.
          # The release asset is verified by bytes; users explicitly chmod it before use.
          test -s "$amd64"
          test -s "$arm64"
          sha256sum "$amd64" "$arm64" > cli-artifacts/Tunnex-CLI-SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" \
            "$amd64" "$arm64" cli-artifacts/Tunnex-CLI-SHA256SUMS --clobber
      - name: Attach Helm charts + checksum to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -s chart-artifacts/Tunnex-Helm-SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" \
            chart-artifacts/tunnex-host-posture-*.tgz \
            chart-artifacts/tunnex-gateway-*.tgz \
            chart-artifacts/tunnex-operator-[0-9]*.tgz \
            chart-artifacts/tunnex-operator-crds-*.tgz \
            chart-artifacts/Tunnex-Helm-SHA256SUMS --clobber
      - name: Attest versioned Helm charts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            chart-artifacts/tunnex-host-posture-*.tgz
            chart-artifacts/tunnex-gateway-*.tgz
            chart-artifacts/tunnex-operator-[0-9]*.tgz
            chart-artifacts/tunnex-operator-crds-*.tgz
      - name: Attach Linux managed-agent runtime binaries + checksum to tagged release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          amd64="runtime-artifacts/tunnex-agent-runtime-linux-amd64"
          arm64="runtime-artifacts/tunnex-agent-runtime-linux-arm64"
          unit="runtime-artifacts/tunnex-agent-runtime.service"
          test -s "$amd64"
          test -s "$arm64"
          test -s "$unit"
          sha256sum "$amd64" "$arm64" "$unit" > runtime-artifacts/Tunnex-Agent-Runtime-SHA256SUMS
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then RELEASE_TAG="$GITHUB_REF_NAME"; else RELEASE_TAG="tunnex-build-${GITHUB_SHA}"; fi
          CURRENT_RELEASE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
          if [[ "$CURRENT_RELEASE_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::release source ref ${RELEASE_TAG} moved from workflow source ${GITHUB_SHA} to ${CURRENT_RELEASE_SHA}; refusing runtime asset publication"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" \
            "$amd64" "$arm64" "$unit" runtime-artifacts/Tunnex-Agent-Runtime-SHA256SUMS --clobber
      - name: Attach and verify managed-agent bootstrap verifier assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TUNNEX_RELEASE_KEY_ID: ${{ secrets.TUNNEX_RELEASE_KEY_ID }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then RELEASE_TAG="$GITHUB_REF_NAME"; else RELEASE_TAG="tunnex-build-${GITHUB_SHA}"; fi
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)" = "$GITHUB_SHA"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          EXPECTED="$(jq -cn --arg tag "$RELEASE_TAG" --arg source_sha "$GITHUB_SHA" '{schema_version:1,tag:$tag,source_sha:$source_sha}')"
          ACTUAL="$(gh release download "$RELEASE_TAG" --pattern Tunnex-release-source.json --output -)"
          test "$ACTUAL" = "$EXPECTED"
          gh release upload "$RELEASE_TAG" agent-bootstrap-verifier.json \
            runtime-artifacts/releaseverify-linux-amd64 runtime-artifacts/releaseverify-linux-arm64 --clobber
          mkdir -p verifier-publication-check
          gh release download "$RELEASE_TAG" --dir verifier-publication-check \
            --pattern release.json --pattern agent-bootstrap-verifier.json \
            --pattern releaseverify-linux-amd64 --pattern releaseverify-linux-arm64
          # Verify the downloaded bytes before the draft may become public.
          (cd apps/api && GOFLAGS=-mod=readonly go run ./cmd/releaseverify \
            -manifest ../../verifier-publication-check/release.json \
            -public-key "$(cat ../../release-verification-public-key.txt)" \
            -expected-source-sha "$GITHUB_SHA" -expected-key-id "$TUNNEX_RELEASE_KEY_ID" \
            -bootstrap-verifier ../../verifier-publication-check/agent-bootstrap-verifier.json \
            -bootstrap-verifier-assets ../../verifier-publication-check)
      # Dispatch starts a separate reviewed sync and deploy. A tagged release
      # becomes latest only after both public launchers serve this source.
      - name: Verify deployed platform installers before tagged release promotion
        if: startsWith(github.ref, 'refs/tags/v')
        run: sh deploy/verify-installer-site.sh "$GITHUB_SHA"
      - name: Publish only the completed source-ledger release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="tunnex-build-${GITHUB_SHA}"
          fi
          CURRENT_RELEASE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
          if [[ "$CURRENT_RELEASE_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::release source ref ${RELEASE_TAG} moved from workflow source ${GITHUB_SHA} to ${CURRENT_RELEASE_SHA}; refusing final publication"
            exit 1
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          EXPECTED="$(jq -cn --arg tag "$RELEASE_TAG" --arg source_sha "$GITHUB_SHA" '{schema_version:1,tag:$tag,source_sha:$source_sha}')"
          ACTUAL="$(gh release download "$RELEASE_TAG" --pattern Tunnex-release-source.json --output -)"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::release source ledger changed before final publication"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          fi

  # Catalog publication is independently retryable. A catalog failure must not
  # rerun or mutate the now-immutable version release and its image/chart tags.
  publish-update-catalog:
    if: startsWith(github.ref, 'refs/tags/v') && needs.release-assets.result == 'success'
    needs: [release-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download and verify the completed release descriptor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p catalog-artifacts
          gh release download "$GITHUB_REF_NAME" \
            --pattern release.json --pattern release.json.sha256 \
            --dir catalog-artifacts
          (cd catalog-artifacts && sha256sum -c release.json.sha256)
      - name: Publish signed update catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view tunnex-updates >/dev/null 2>&1; then
            gh release upload tunnex-updates \
              catalog-artifacts/release.json catalog-artifacts/release.json.sha256 --clobber
          else
            gh release create tunnex-updates \
              catalog-artifacts/release.json catalog-artifacts/release.json.sha256 \
              --target "$GITHUB_SHA" \
              --title "Tunnex update catalog" \
              --notes "Moving signed update catalog consumed by installed control planes." \
              --latest=false
          fi
