name: AI-0 adapter qualification

on:
  pull_request:
    paths:
      - "apps/api/internal/aigateway/**"
      - ".github/workflows/ai0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache: false
      - name: Verify local adapter boundaries (no provider credentials)
        working-directory: apps/api
        env:
          GOWORK: "off"
          GOFLAGS: "-mod=readonly"
        run: |
          go test -race ./internal/aigateway
          go vet ./internal/aigateway
