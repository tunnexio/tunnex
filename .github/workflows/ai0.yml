name: AI gateway qualification

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/ai-engine/**"
      - "scripts/ai-model-catalog*"
      - "openapi/**"
      - "deploy/ai-gateway/**"
      - "deploy/helm/tunnex-cp/**"
      - ".github/workflows/ai0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      COMPOSE_PROJECT_NAME: ci-ai-${{ github.run_id }}-${{ github.run_attempt }}
      GOWORK: "off"
      GOFLAGS: "-mod=readonly"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/api/go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
      - name: Reproduce the pinned release catalog
        run: |
          node --test scripts/ai-model-catalog.test.mjs
          node scripts/ai-model-catalog.mjs --fetch --check
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and qualify the exact private native engine (no publication)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/ai-engine/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: tunnex-ai-qualification:${{ github.sha }}
          cache-from: type=gha,scope=ai-engine-native-amd64
          cache-to: type=gha,mode=max,scope=ai-qualification-amd64
      - name: Extract only the exact locally built engine for API fixtures
        env:
          IMAGE: tunnex-ai-qualification:${{ github.sha }}
        run: |
          set -euo pipefail
          container=$(docker create "$IMAGE")
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/app/main" "$RUNNER_TEMP/bifrost"
          chmod 700 "$RUNNER_TEMP/bifrost"
          echo "AI0_BIFROST_BINARY=$RUNNER_TEMP/bifrost" >> "$GITHUB_ENV"
          echo "AI0_BIFROST_BUILT_SHA256=$(sha256sum "$RUNNER_TEMP/bifrost" | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Start and verify a dedicated disposable test database
        run: |
          cat > "$RUNNER_TEMP/ai-postgres.yml" <<'COMPOSE'
          services:
            postgres:
              image: postgres:16-alpine
              environment:
                POSTGRES_USER: ai_test
                POSTGRES_PASSWORD: ai_ci_fixture_only
                POSTGRES_DB: ai_test
              ports: ["127.0.0.1::5432"]
              healthcheck:
                test: [CMD-SHELL, "pg_isready -U ai_test -d ai_test"]
                interval: 2s
                timeout: 2s
                retries: 30
          COMPOSE
          docker compose -f "$RUNNER_TEMP/ai-postgres.yml" up -d --wait
          container=$(docker compose -f "$RUNNER_TEMP/ai-postgres.yml" ps -q postgres)
          test "$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$container")" = "$COMPOSE_PROJECT_NAME"
          docker inspect -f '{{json .NetworkSettings.Networks}}' "$container" | python3 -c 'import json,os,sys; assert os.environ["COMPOSE_PROJECT_NAME"]+"_default" in json.load(sys.stdin)'
          echo "Verified COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT_NAME container=$container network=${COMPOSE_PROJECT_NAME}_default"
          echo "TUNNEX_TEST_DATABASE_URL=postgres://ai_test:ai_ci_fixture_only@postgres:5432/ai_test?sslmode=disable" >> "$GITHUB_ENV"
      - name: Native engine and enrolled HTTP boundary proof (zero provider spend)
        run: |
          set -euo pipefail
          # The exact image binary uses Alpine's musl loader. Run it and its Go
          # fixtures together in the pinned Alpine toolchain, rather than
          # executing the extracted CGO binary directly on Ubuntu.
          docker run --rm \
            --network "${COMPOSE_PROJECT_NAME}_default" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly" \
            --mount "type=bind,source=$AI0_BIFROST_BINARY,target=/fixture/bifrost,readonly" \
            --env AI0_BIFROST_BINARY=/fixture/bifrost \
            --env AI0_BIFROST_BUILT_SHA256 \
            --env TUNNEX_TEST_DATABASE_URL \
            --env GOWORK=off \
            --env GOFLAGS=-mod=readonly \
            --env GOTOOLCHAIN=local \
            golang:1.26.8-alpine@sha256:8ac98ca534ac3f51e1f420a1dd2c15e74c75cfa0f23f3ad27eb5d7236c349a0c \
            sh -ec '
              apk add --no-cache build-base python3
              test "$(sha256sum "$AI0_BIFROST_BINARY" | awk "{print \$1}")" = "$AI0_BIFROST_BUILT_SHA256"
              cd /repo/apps/api
              DATABASE_URL="$TUNNEX_TEST_DATABASE_URL" go run ./cmd/migrate up
              go test -race -count=1 -p 1 ./internal/aigateway ./internal/http
              go test -race -tags enterprise -count=1 -p 1 ./internal/aigateway ./internal/http
              go vet ./internal/aigateway ./internal/http
            '
      - name: Stop only this test database
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/ai-postgres.yml"; then
            docker compose -f "$RUNNER_TEMP/ai-postgres.yml" down
          fi
