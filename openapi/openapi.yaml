  /api/v1/organizations/{orgId}/nodes/{nodeId}/restore-devices:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: nodeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: restoreNodeDevices
      summary: Restore the devices a gateway revoke cascaded, onto a replacement gateway
      description: >-
        S13.1 Slice 7. Revoking a gateway revokes every device homed on it, so rebuilding that gateway hands
        back a working gateway with ZERO users. This brings those devices back — onto a REPLACEMENT gateway,
        because a revoked node is never active again (recovery from a revoke is a join-token enrolment, which
        creates a new node). ONLY devices revoked as a CASCADE return; a device an admin revoked deliberately
        is never revived by a gateway rebuild. A device that cannot reclaim its original address comes back on
        a fresh one and is audited distinctly — its config embeds the old address and must be re-imported.
        A DELIBERATE OPERATOR ACT by construction: RBAC device:restore, audited with the actor. Re-key performs
        the same restore for a gateway that recovered ITSELF, where no human is involved and nothing re-homes;
        this endpoint is the only path for a gateway that was REVOKED, which proof of possession must never
        undo (D3).
      tags: [nodes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestoreNodeDevicesRequest" }
      responses:
        "200":
          description: What was restored. Zero restored is a normal answer, not an error.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestoreNodeDevicesResponse" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/nodes/{nodeId}:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: nodeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateNode
      summary: Rename a gateway
      description: >-
        S12.12 D3. Nothing about a gateway was editable: a typo at enrolment was permanent, because enrolment
        is a CLI act on the operator's own server and the name it supplies is written once. The NAME is a
        label — nothing consumes it structurally — so changing it costs nothing and is safe to expose.
        THE ENDPOINT IS DELIBERATELY NOT EDITABLE HERE, and the asymmetry is the point: peers hold the
        endpoint and every issued device config bakes it, so changing it invalidates those configs, and this
        product has no snapshot of the endpoint a config was issued against — so the change would be
        invisible to needs_reexport and every affected user would discover it by failing to connect. That is
        the exact defect the transfer step was built to avoid one story earlier. Correcting a wrong endpoint
        is re-enrolment until that snapshot exists.
      tags: [nodes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateNodeRequest" }
      responses:
        "200":
          description: The updated gateway.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteNode
      summary: Delete a REVOKED gateway permanently
      description: >-
        S12.12 D2. A revoked gateway is terminal and never serves anything again, but its row stayed on the
        list forever — so a deployment accumulated dead entries an operator could not clear. Only a REVOKED
        node can be deleted, and that predicate is the whole safety argument: the revoke itself refuses while
        any device is homed there, so by the time a node is revoked the transfer has already moved them and
        the cascading foreign keys have nothing left to destroy. It is the SEQUENCE that makes this safe, not
        the FK actions. The gateway's ENROLMENT TOKEN is deleted with it: it is ON DELETE SET NULL and would
        have survived unlinked, and a token whose gateway an operator has just deleted must not still enrol
        another. Anyone holding that token finds it stops working, which the confirm says because it may be
        sitting in a colleague's terminal about to be run.
      tags: [nodes]
      responses:
        "204":
          description: Deleted.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/nodes/{nodeId}/transfer-devices:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: nodeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: transferNodeDevices
      summary: Move every live device homed on this gateway to another gateway
      description: >-
        S12.12 D1. Revoking a gateway CASCADES to every active and pending device homed on it, in the same
        transaction, and a revoked gateway is never active again — so retiring a gateway used to mean
        disconnecting everyone on it. This moves them first, and the revoke REFUSES (409 devices_still_homed)
        while any remain, which is what makes the step unskippable. Transfer-first is the ruled order because
        of the state the flow is ABANDONED in: "devices moved, old gateway still running" is harmless and
        resumable, whereas revoke-then-restore leaves a disconnected fleet and no un-revoke. PENDING devices
        move too and stay pending — an outstanding approval is about the person, not the gateway. Addresses
        are NOT reallocated: the pool is org-scoped, so a same-org move cannot collide. The response reports
        PER DEVICE whether its issued config must be re-imported, which is a different question from whether
        the row moved: a static export bakes the gateway's endpoint and never polls, and a managed device
        only re-homes itself onto a gateway in the active hub set.
      tags: [nodes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferNodeDevicesRequest" }
      responses:
        "200":
          description: What moved. Zero moved is a normal answer, not an error.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferNodeDevicesResponse" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/nodes/{nodeId}/hub-priority:
