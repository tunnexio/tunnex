      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: reactivateMember
      summary: Reactivate a deactivated member
      tags: [members]
      responses:
        "204":
          description: Reactivated.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
        default: { $ref: "#/components/responses/Error" }

  # ── Deployment administration (users.cp_admin) ────────────────────────────
  #
  # ⛔ THESE ARE NOT ORG-SCOPED ROUTES WEARING AN ORG ID IN THE PATH. Every other
  # `/organizations/{orgId}/…` operation is authorized by MEMBERSHIP in that org
  # (authorize() → RoleIn). These are authorized by a DEPLOYMENT-LEVEL capability
  # held by a caller who is typically a member of NONE of the orgs they act on —
  # a different question, asked BESIDE RoleIn and never inside it, which is why
  # they live on their own prefix rather than being a branch in the member routes.
  /api/v1/admin/organizations/{orgId}/members/{userId}/role:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: adminSetOrgRole
      summary: Grant or change a user's role in ANY organization (deployment admin)
      description: >
        Requires `users.cp_admin`. Creates the membership if the user has none.
        Refuses to demote the organization's last owner (409 `last_owner`).
        Audited into the TARGET organization's log, so the org's own owners see
        that someone from outside their tenant changed a role.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeRoleRequest" }
      responses:
        "204":
          description: Role granted.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/admin/users/{userId}/cp-admin:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: adminSetCpAdmin
      summary: Grant or revoke the deployment-administrator capability
      description: >
        Requires `users.cp_admin`. Refuses any change that would leave the
        deployment with ZERO holders (409 `last_cp_admin`) — there is no public
        signup, so a deployment with no deployment administrator cannot be
        recovered without database access.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CpAdminRequest" }
      responses:
        "204":
          description: Capability updated.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/admin/gateway-endpoint:
    get:
      operationId: getGatewayEndpoint
      summary: Get the deployment-wide gateway control endpoint
      description: >-
        Returns the raw mTLS endpoint used by newly generated gateway join commands. This is a
        deployment setting, not an organization setting. Reading and changing it requires a verified
        deployment administrator or an owner/admin of an organization on this deployment.
      tags: [admin]
      responses:
        "200":
          description: Gateway control endpoint.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatewayEndpoint" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateGatewayEndpoint
      summary: Set the deployment-wide gateway control endpoint
      description: >-
        Sets the hostname and optional port used in future gateway join commands. The endpoint must be
        an absolute HTTPS URL with no path, query or fragment; it must terminate in the raw mTLS agent
        listener, normally port 8443. Existing gateways are not changed by this setting.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateGatewayEndpointRequest" }
      responses:
        "200":
          description: Updated gateway control endpoint.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatewayEndpoint" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/agent/rekey/challenge:
    post:
      operationId: rekeyChallenge
      summary: Request a single-use nonce for proof-of-possession re-key (unauthenticated)
      description: >-
        S13.1 D9. Returns a single-use, short-lived nonce the agent signs together with its new CSR.
        UNAUTHENTICATED by construction: the caller's certificate is the thing that has failed.
        It does NOT verify that the identifier is known — a challenge that succeeded only for real
        identifiers would make them probeable one request at a time, so an unknown one fails at SUBMIT
        with the same uniform refusal as every other failure. Accepts EXACTLY ONE of two identifiers
        (D10): the certificate serial, or the SHA-256 fingerprint of the public key the control plane
        recorded. Rate-limited per client address.
      tags: [nodes]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RekeyChallengeRequest" }
      responses:
        "200":
          description: A nonce. Says nothing about whether the serial is known.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RekeyNonce" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/agent/rekey:
    post:
      operationId: rekeyAgent
      summary: Re-key an existing gateway by proof of possession (unauthenticated)
      description: >-
        S13.1. Issues a fresh certificate for an EXISTING node id — same node, same site binding, same
        history — to a caller proving possession of the keypair the control plane recorded for it.
        UNAUTHENTICATED by construction; its entire defence is (i) the gone-gate, which authorizes ONLY
        on certificate expiry and REFUSES a revoked node, and (ii) the signature over (nonce ‖ CSR).
        A revoked gateway recovers with an operator-minted join token instead — a proof of possession
        must never overturn a human decision, since it cannot distinguish the legitimate holder from
        whoever took the key. Every failure returns the SAME refusal: live node, unknown identifier,
        ambiguous identifier, spent nonce, malformed CSR and wrong key are indistinguishable, so the
        endpoint cannot be used as an oracle. Rate-limited per client address.
      tags: [nodes]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RekeyRequest" }
      responses:
        "200":
          description: Re-keyed — returns the new certificate and the CA.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RekeyResponse" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations:
    get:
      operationId: listOrganizations
      summary: List organizations
      description: Lists the organizations the authenticated user belongs to.
      tags: [organizations]
      responses:
        "200":
          description: Organizations.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createOrganization
      summary: Create an organization
      description: |
        Creates an organization. In the open edition this fails with
        `org_limit_reached` once one organization exists; the enterprise build
        allows multiple.
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: The created organization.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/organizations/{orgId}:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getOrganization
      summary: Get an organization
      tags: [organizations]
      responses:
        "200":
          description: The organization.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateOrganization
      summary: Update organization settings (name only; slug is immutable)
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: The updated organization.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteOrganization
      summary: Soft-delete an organization (refused while it still owns resources)
      description: >-
        Owner-only (`org:delete`). Refuses with 409 `org_not_empty` while the organization still has
        gateways, sites, devices, Kubernetes clusters or machine credentials — a soft delete leaves them
        running with no organization to manage them from. There is no force flag.
      tags: [organizations]
      responses:
        "204":
          description: Deleted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/organizations/{orgId}/agent-quota:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: setOrganizationAgentQuota
      summary: Set the organization managed-agent identity quota
      description: >-
        Enterprise organization setting. Requires org:update. `max_agent_identities: null` means
        unlimited. The server counts pending, active, and suspended agent identities organization-wide;
        revoked and deleted identities do not count. No remaining count is returned or inferred.
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetOrganizationAgentQuotaRequest"
      responses:
        "200":
          description: Updated organization quota.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/organizations/{orgId}/deletion-preflight:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: orgDeletionPreflight
      summary: What still blocks deleting this organization
      description: >-
        The counts the delete refusal is derived from, read BEFORE anyone types a confirmation. Same
        permission as the delete itself — a preflight is only actionable to someone who could act on it.
      tags: [organizations]
      responses:
        "200":
          description: Preflight.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgDeletionPreflight" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/organizations/{orgId}/pool-cidr:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      # EDITION-NEUTRAL: the address allocator is core/open (S3.5), so resize has
      # no edition gate. Do not add one.
      operationId: resizePool
      summary: Resize the org's WireGuard address pool (grow-superset or shrink-subset)
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PoolCidrRequest" }
      responses:
        "200":
          description: The updated organization (also returned unchanged for an idempotent no-op resize).
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "409":
          description: The shrink would strand live allocations; none were changed.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResizeConflict" }
        default:
          $ref: "#/components/responses/Error"

  # ── S8.1 site-to-site (EPIC 8): site model + subnet advertisement/approval (site:manage) ──
  /api/v1/organizations/{orgId}/sites:
    parameters:
      - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listSites
      summary: List the org's sites (S8.1)
      tags: [sites]
      responses:
        "200":
          description: Sites.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Site" } } } }
        default: { $ref: "#/components/responses/Error" }

    post:
      operationId: registerSite
      summary: Register a site gateway (S8.1; site:manage)
      tags: [sites]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RegisterSiteRequest" } } }
      responses:
        "201":
          description: Created.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Site" } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/agent-runtime-settings:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: setOrganizationAgentRuntimeEnabled
      summary: Enable or disable managed-agent runtime synchronization for an organization
      description: >-
        Enterprise-only explicit opt-in. Requires agent_runtime:manage. A paid licence unlocks
        this capability but never enables it implicitly; the default is disabled. Disabling an active
        organization makes the next runtime poll/report a terminal uniform refusal so managed tunnels
        offboard instead of preserving synchronization indefinitely.
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentRuntimeSetting" }
      responses:
        "200":
          description: Persisted managed-agent runtime setting.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRuntimeSetting" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/routed-ranges:
    parameters:
      - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listRoutedRanges
      summary: The org's VOLATILE network-topology facts for a split-tunnel device (S8.5 + WF-A). Carries ONLY what the network currently looks like (ranges, and — with device_id — the device's dial endpoint + gateway pubkey); NEVER device-identity material (no private key, no pool-address re-issue, no enrollment token). The device's own identity is minted once and never re-fetched; the gateway it dials is a routing fact the network makes volatile (WF-A — the hub can change beneath a running device). Approved-only, sorted + canonical. Empty is a first-class answer.
      tags: [sites]
      parameters:
        - name: device_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: "WF-A: when present, the response ALSO carries this device's dial (endpoint + gateway pubkey) derived from the org's ACTIVE HUB, so a running device re-homes on promotion via the SAME poll. The device MUST belong to the calling org AND be owned by the authenticated user — a device fetches only its OWN dial (cross-org/cross-device is refused). Omit for the pre-WF-A ranges-only behavior."
      responses:
        "200":
          description: Routed ranges (approved site-subnet CIDRs; possibly empty).
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/RoutedRanges" } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/routed-lans:
    parameters:
      - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: routeLAN
      summary: One-screen "route a LAN through this gateway" (S8.5 D1; site:manage). Composes register-site + bind-gateway + advertise-subnet + approve into one call — byte-identical DB state + the four constituent audit events. On a range collision the site+bind+pending-subnet persist and the typed refusal is returned.
      tags: [sites]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RouteLANRequest" } } }
      responses:
        "201":
          description: The site whose gateway now routes the LAN.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Site" } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/sites/{siteId}:
    parameters:
      - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getSiteReferences
      summary: Count what references a site — cascade preview + reverse link (S8.3; site:manage)
      description: >-
        The rule/subnet counts the UI needs BEFORE a delete (D4 cascade preview: N rules deleted, M subnets
        released) and to render the site page's "rules referencing this site" reverse link (D1). ONE endpoint
        serves both. A rule is referenced if it names this site as src OR dst.
      tags: [sites]
      responses:
        "200":
          description: Reference counts.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/SiteReferences" } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSite
      summary: Delete a site — cascades its subnets + site-referencing rules (S8.3; site:manage)
      description: >-
        Deletes the site; ON DELETE CASCADE removes its subnets and any policy rule naming it as src/dst, and
        the bound gateway is unbound. The UI gates this behind a name-typed confirm + the getSiteReferences
        cascade preview (D4). Discharges the S8.1 DELIBERATELY-UNWIRED DeleteSite query.
      tags: [sites]
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/sites/{siteId}/subnets:
    parameters:
      - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listSiteSubnets
      summary: List a site's subnets (S8.1; org:view — MEMBER-READABLE)
      description: >-
        ⚠ THIS LINE SAID `site:manage` UNTIL S14.7 AND THE HANDLER NEVER DID. `ListSiteSubnets`
        authorizes on `rbac.PermOrgView` (`internal/http/site_handlers.go:195`), per S8.3 D5:
        subnets are part of the read-only topology a MEMBER may see; advertise and approve stay
        `site:manage`. PLAN.md's S8.3 entry rules the same thing.
        The wrong annotation caused a real design decision to be taken on a false constraint —
        Routed Ranges was scoped as "attribution is admin-only" because of it. On an OpenAPI-first
        codebase a wrong summary is a wrong source of truth, so it is corrected here rather than
        noted elsewhere. VERIFY AGAINST THE SWITCH, NOT AGAINST THE NAME.
      tags: [sites]
      responses:
        "200":
          description: The site's subnets.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SiteSubnet" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: addSiteSubnet
      summary: Advertise a subnet on a site — pending approval (S8.1; site:manage)
      tags: [sites]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AddSiteSubnetRequest" } } }
      responses:
        "201":
          description: Advertised (pending approval).
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/SiteSubnet" } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/sites/{siteId}/dns-forwards:
    parameters:
      - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listSiteDNSForwards
      summary: List a site's cross-site DNS forwarding zones (S8.4; site:manage)
      tags: [sites]
      responses:
        "200":
          description: The site's forwarded zones.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DNSForward" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: setSiteDNSForward
      summary: Add/update a forwarded zone (S8.4; site:manage)
      description: >-
        Forwards {domain} to {resolver_ip} — the resolver MUST be inside one of this site's approved subnets
        (409 dns_resolver_not_in_site_subnet otherwise), and the domain must not already be forwarded by
        ANOTHER site in the org (409 dns_domain_conflict — one zone → one resolver). Same domain on this site
        updates its resolver. Audited site.dns_forwarding_set.
      tags: [sites]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DNSForward" } } }
      responses:
        "204": { description: Set. }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/sites/{siteId}/dns-forwards/{domain}:
    parameters:
      - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: domain, in: path, required: true, schema: { type: string } }
    delete:
      operationId: removeSiteDNSForward
      summary: Remove a forwarded zone — full-sweep withdraws it from all gateways (S8.4; site:manage)
      tags: [sites]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/sites/{siteId}/bind:
    parameters:
      - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: bindSiteNode
      summary: Bind a gateway node to a site — single-node v1 (S8.1; site:manage)
      tags: [sites]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BindSiteNodeRequest" } } }
      responses:
        "204": { description: Bound. }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: unbindSiteNode
      summary: Unbind a gateway node from the site — D6 replace-node (S8.1/S8.6 #3; site:manage)
      description: >
        Unbinds a gateway. With a node_id body, unbinds THAT gateway — post the single-node lift a site may
        hold several, so the caller names which (S8.6 #3). WITHOUT a body (the legacy caller shape, S8.6 #6
        compat), unbinds the site's SOLE gateway; a multi-gateway site then requires node_id (409). 404 when
        the node is not bound to this site / the site has no gateway.
      tags: [sites]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/UnbindSiteNodeRequest" } } }
      responses:
        "204": { description: Unbound. }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/k8s/clusters:
    parameters:
      - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listK8sClusters
      summary: List the org's Kubernetes clusters (S10.3; org:view)
      tags: [k8s]
      responses:
        "200":
          description: Clusters.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/K8sCluster" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: registerK8sCluster
      summary: Register a Kubernetes cluster + its synthetic VIP range (S10.3; k8s:manage)
      description: >-
        Registers a cluster fronted by a site gateway. The VIP range must be DISJOINT from the device pool,
        every site subnet, and other clusters' VIP ranges (409 vip_range_overlap). The name is a DNS label and
        dns_zone a domain — together they form each exposed Service's hostname &lt;service&gt;.&lt;namespace&gt;.svc.&lt;name&gt;.&lt;zone&gt;.
        A DNS VIP is reserved from the range automatically (never handed to a Service).
      tags: [k8s]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RegisterK8sClusterRequest" } } }
      responses:
        "201":
          description: Registered.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/K8sCluster" } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/k8s/clusters/{clusterId}:
    parameters:
      - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getK8sCluster
      summary: Fetch one cluster by id (S10.2; org:view) — the operator's confirm-by-ID before a drift-recreate
      tags: [k8s]
      responses:
        "200":
          description: The cluster.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/K8sCluster" } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deregisterK8sCluster
      summary: Deregister a cluster — full-sweep of its Services + rules (S10.3; k8s:manage)
      description: >-
        Removes the cluster; ON DELETE CASCADE removes its exposed Services and any policy rule reaching one,
        and frees the whole VIP range (incl the reserved DNS VIP) + the DNS zone for reuse.
      tags: [k8s]
      responses:
        "204": { description: Deregistered. }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/k8s/clusters/{clusterId}/connector:
    parameters:
      - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setK8sClusterConnector
      summary: Set the private in-cluster gateway that fronts this cluster (S10.3a; k8s:manage)
      description: >-
        Selects an active gateway already bound to this cluster's site. Only this connector receives Kubernetes
        EndpointSlice resolution and synthetic VIP DNAT; existing site edge gateways receive the private
        handoff route and enforce client policy. Replacing the connector is a reconciled control-plane change.
      tags: [k8s]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BindSiteNodeRequest" } } }
      responses:
        "204": { description: Connector set. }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/k8s/clusters/{clusterId}/services:
    parameters:
      - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listK8sServices
      summary: List a cluster's exposed Services (S10.3; org:view)
      tags: [k8s]
      responses:
        "200":
          description: The cluster's exposed Services.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/K8sService" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: exposeK8sService
      summary: Expose an in-cluster Service to the fabric — allocates a VIP (S10.3; k8s:manage)
      description: >-
        Allocates a /32 VIP from the cluster's range and records the Service (a stable identity). Clients reach
        the VIP; the gateway DNATs it to the Service's real ClusterIP. 409 vip_range_exhausted when the range is
        full, 409 service_exists when that namespace/name is already exposed.
      tags: [k8s]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExposeK8sServiceRequest" } } }
      responses:
        "201":
          description: Exposed.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/K8sService" } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/k8s/services:
    parameters:
      - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listK8sServicesForOrg
      summary: List ALL exposed Services in the org — the grant destination picker + K8s overview (S10.3; org:view)
      tags: [k8s]
      responses:
        "200":
          description: Every exposed Service across the org's clusters (with resolvable fqdn + cluster_id).
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/K8sService" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/k8s/services/{serviceId}:
    parameters:
      - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: serviceId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getK8sService
      summary: Fetch one exposed Service by id (S10.2; org:view) — the operator's confirm-by-ID before a drift-recreate
      tags: [k8s]
      responses:
        "200":
          description: The exposed Service.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/K8sService" } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: unexposeK8sService
      summary: Unexpose a Service — full-sweep withdraws its VIP + DNS answer (S10.3; k8s:manage)
      description: >-
        Soft-deletes the Service; it vanishes from the LIVE resolution so its VIP + DNS answer drop from every
        gateway on the next compile, and any grant that reached it compiles to nothing (shown as vanished). The
        freed VIP is immediately reusable.
      tags: [k8s]
      responses:
        "204": { description: Unexposed. }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/site-subnets/pending:
    parameters:
      - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listPendingSiteSubnets
      summary: List advertised-but-unapproved subnets — the review queue (S8.1; site:manage)
      tags: [sites]
      responses:
        "200":
          description: Pending advertisements.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SiteSubnet" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/site-subnets/{subnetId}/approve:
    parameters:
      - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: subnetId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: approveSiteSubnet
      summary: Approve an advertised subnet after disjointness (S8.1; site:manage)
      tags: [sites]
      responses:
        "204": { description: Approved. }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/site-subnets/{subnetId}:
    parameters:
      - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: subnetId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: removeSiteSubnet
      summary: Un-advertise / remove a site subnet (S8.2c WF-5; site:manage)
      description: >-
        Removes an advertised subnet from a site. A pending subnet just disappears; an APPROVED subnet's
        route is withdrawn from all gateways on the next reconcile (the full-sweep contract) — the UI states
        this consequence in the confirm. Correcting a mis-advertised subnet no longer requires deleting the
        whole site (the WF-5 trap the cross-cloud walk hit). Audited site.subnet_removed.
      tags: [sites]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: tunnex_session
    # CLI credential (tnx_...). bearer ≡ cookie on every authenticated endpoint;
    # the ONLY exceptions are argued on the ops themselves (cliAuthorize +
    # cliDeviceApprove — credential minting must not be reachable from a bearer).
    bearerAuth:
      type: http
      scheme: bearer
    runtimeBearer:
      type: http
      scheme: bearer
      description: Machine-only hash-backed managed-agent runtime credential; never a user/session bearer.

  headers:
    RequestId:
      description: Correlation ID for this request; also appears in server logs.
      schema:
        type: string
      required: true

  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
          description: Liveness status.
        service:
          type: string
          description: Reporting service name.
          example: tunnex-api
        request_id:
          type: string
          description: Correlation ID for this request.

    Organization:
      type: object
      required: [id, name, slug, pool_cidr, max_agent_identities, managed_agent_runtime_enabled, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        pool_cidr:
          type: string
          description: The org's flat WireGuard address pool (IPv4 CIDR).
        ovpn_enabled:
          type: boolean
          description: "S9.1 D-S9.5-OPTIN: whether this org has opted into OpenVPN. Default false. When false the OpenVPN device type is not offered and the export endpoint refuses (opt_in_required)."
        max_agent_identities:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: "F02: organization-wide managed-agent identity quota. null means unlimited; no remaining count is exposed."
        managed_agent_runtime_enabled:
          type: boolean
          description: "F04: explicit organization opt-in for managed runtime synchronization. Default false; a paid licence does not enable it implicitly."
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PoolCidrRequest:
      type: object
      required: [cidr]
      additionalProperties: false
      properties:
        cidr: { type: string, description: New pool CIDR (IPv4). Must contain or be contained by the current range. }

    # ── Zero Trust policy (S7.1, enterprise) ──────────────────────────────────
    UserGroup:
      type: object
      required: [id, org_id, name, description, created_at, updated_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        managed_agent_count:
          type: integer
          minimum: 0
          description: "Present for policy managers: current live agent-profile assignments cleared if this group is deleted; removing one group member withdraws that person's authority over the same agents without clearing the assignment."
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        # origin distinguishes a hand-managed group from a directory-synced one (S7.5.2). A
        # manual group omits the idp_* fields; an idp_sync group carries both. Hand-editing an
        # idp_sync group's membership is refused (409) — the reconciler owns it.
        origin: { type: string, enum: [manual, idp_sync] }
        idp_provider: { type: string, enum: [microsoft, google] }
        idp_group_id: { type: string }

    IdpSyncConfigRequest:
      type: object
      required: [client_id, client_secret]
      additionalProperties: false
      properties:
        client_id: { type: string, description: Entra application client id; required for microsoft. }
        client_secret: { type: string, description: Entra client secret; sealed at rest and never returned. }
        tenant_id: { type: string, description: Entra tenant id; required for microsoft. }
        service_account_json: { type: string, description: Google service-account JSON with DWD; sealed at rest and never returned. }
        delegated_admin_email: { type: string, format: email, description: Google Workspace admin subject for DWD impersonation. }
        enabled: { type: boolean, default: true }

    IdpSyncConfig:
      type: object
      required: [provider, client_id, enabled, last_sync_ok, sync_health]
      additionalProperties: false
      properties:
        provider: { type: string, enum: [microsoft, google] }
        client_id: { type: string }
        # Keyed 12-hex proof-of-secret (S4.5): the read path NEVER returns the client secret, only
        # this fingerprint — enough to confirm a secret is set / detect a change, useless to an attacker.
        secret_fingerprint: { type: string }
        tenant_id: { type: string }
        delegated_admin_email: { type: string, format: email }
        enabled: { type: boolean }
        last_sync_at: { type: string, format: date-time }
        last_sync_ok: { type: boolean }
        last_sync_error: { type: string }
        sync_health: { type: string, description: Two-tier derived health (D2). }

    IdpSyncHealth:
      type: object
      required: [provider, sync_health, last_sync_ok]
      additionalProperties: false
      properties:
        provider: { type: string, enum: [microsoft, google] }
        sync_health: { type: string }
        last_sync_ok: { type: boolean }
        last_sync_at: { type: string, format: date-time }
        last_sync_error: { type: string }

    IdpGroupMapRequest:
      type: object
      required: [idp_group_id]
      additionalProperties: false
      properties:
        idp_group_id: { type: string, minLength: 1, description: The external directory group id. }
        # Exactly one of name (create a new idp_sync group) or group_id (bind an EXISTING manual
        # group — refused unless it is empty). Providing neither creates a group named after the
        # idp_group_id; providing both is a 400.
        name: { type: string, minLength: 1, maxLength: 100 }
        group_id: { type: string, format: uuid }

    GroupRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }

    GroupMember:
      type: object
      required: [user_id, email, name, added_at]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        added_at: { type: string, format: date-time }

    AddGroupMemberRequest:
      type: object
      required: [user_id]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid }

    MachineCredential:
      type: object
      required: [id, name, fingerprint, created_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        fingerprint: { type: string, description: "Keyed proof-of-secret — a stable display id, NEVER the token." }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true, description: "LAST AUTHENTICATED AT, and nothing more. Stamped on every successful auth — NOT a liveness signal. A credential idle for a day may be an hourly GitOps reconcile or abandoned, and this column cannot tell them apart, so it renders as 'last seen'. No in-use badge is derived from it." }
        owner_user_id: { type: string, format: uuid, nullable: true, description: "S15.1/D14 — the human this machine principal acts for. NULL means UNASSIGNED, and an unassigned credential is REFUSED AT USE (machine_bearer.go). Nullable only for the length of the expand/contract migration; step 4 contracts it." }
        owner_email: { type: string, nullable: true, description: "Resolved from owner_user_id for display. NULL when unassigned — never a guess, and never a suggestion: created_by does not exist, so the system does not know who minted this." }

    AssignMachineCredentialOwnerRequest:
      type: object
      required: [user_id]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid, description: "The org member who owns this credential. The admin CHOOSES — there is no created_by to confirm against." }

    MintMachineCredentialRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, description: "A label for the credential; appears in audit as operator:<name>." }

    # NAME: NOT "MintMachineCredentialResponse" — oapi-codegen generates a response-wrapper type of exactly
    # that name for the mintMachineCredential operation, so the schema and the wrapper collide and the Go
    # client stops compiling (S11-2). A schema name is wire-INVISIBLE (the JSON body is unchanged).
    MintedMachineCredential:
      type: object
      required: [id, name, fingerprint, token]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        fingerprint: { type: string }
        token: { type: string, description: "The bearer secret (tnxm_...), shown ONCE. Save it — never re-displayed; revoke + re-mint if lost." }

    Resource:
      type: object
      required: [id, org_id, name, cidr, protocol, created_at, updated_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        name: { type: string }
        cidr: { type: string, description: "Destination prefix (e.g. 10.0.5.0/24, 0.0.0.0/0)." }
        protocol: { type: string, enum: [any, tcp, udp] }
        port_low: { type: integer, nullable: true, minimum: 1, maximum: 65535 }
        port_high: { type: integer, nullable: true, minimum: 1, maximum: 65535 }
        label:
          type: string
          nullable: true
          description: >-
            S15.3 — a free-text note describing what this destination IS (e.g. "MCP server"). ⛔ AN
            OPERATOR'S ASSERTION, NEVER AN INFERENCE: the product cannot detect that something speaks MCP,
            and a field implying it could would claim a capability the system does not have. ⛔ It NEVER
            reaches the compiled artifact — the compiler reads cidr, protocol and the port bounds from this
            table and nothing else — so it cannot desync an artifact or bump RequiredVersion.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ResourceRequest:
      type: object
      required: [name, cidr, protocol]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        cidr: { type: string }
        protocol: { type: string, enum: [any, tcp, udp] }
        port_low: { type: integer, nullable: true, minimum: 1, maximum: 65535 }
        port_high: { type: integer, nullable: true, minimum: 1, maximum: 65535 }
        label: { type: string, nullable: true, maxLength: 60, description: "Free-text note describing what this destination IS. Operator-asserted; never inferred." }

    PolicyRule:
      type: object
      required: [id, org_id, src_kind, dst_kind, created_at, cidr_outside_org_ranges, dst_k8s_service_vanished, enabled, managed_by_operator]
      additionalProperties: false
      properties:
        # S10.2 D2 cond 1: true = created/managed by the GitOps operator (a machine credential); the dashboard
        # shows it managed and WARNS on a manual edit ("edit the CR, not here") rather than silently reverting
        # it on the next reconcile. false = dashboard-created (unmanaged, freely editable). DERIVED from the
        # managed_by_machine ownership marker (S10.2 Slice 3a).
        managed_by_operator: { type: boolean }
        # F3: true = the rule contributes its allow; false = DISABLED (permission withdrawn, compiled to
        # nothing — "as if the rule weren't there" under default-deny). Toggled via PATCH; a disabled rule
        # is shown distinctly (dimmed), never hidden, so the list can't lie about what's enforcing.
        enabled: { type: boolean }
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        # S7.5.4: the SOURCE subject is a group or a single user; S8.2: or a site's LAN; S8.7: or a literal CIDR (exactly one src_* set).
        src_kind: { type: string, enum: [group, user, site, cidr, agent] }
        src_group_id: { type: string, format: uuid, nullable: true }
        src_user_id: { type: string, format: uuid, nullable: true }
        src_site_id: { type: string, format: uuid, nullable: true }
        src_cidr: { type: string, nullable: true, description: "Set when src_kind=cidr (S8.7): a literal source CIDR (/32-precise)." }
        src_device_id: { type: string, format: uuid, nullable: true, description: "S15.3 — set when src_kind=agent: the agent device whose /32 is the source." }
        # S8.7 warn-not-refuse: true when src_cidr is not inside any current org range (site subnet / routed range / device pool) — a rule matching nothing (a silent no-op wearing a rule's face). DERIVED at read time from CURRENT ranges, so it sheds once the range lands. false for non-cidr sources.
        cidr_outside_org_ranges: { type: boolean }
        dst_kind: { type: string, enum: [resource, group, site, k8s_service] }
        dst_resource_id: { type: string, format: uuid, nullable: true }
        dst_group_id: { type: string, format: uuid, nullable: true }
        dst_site_id: { type: string, format: uuid, nullable: true }
        dst_k8s_service_id: { type: string, format: uuid, nullable: true, description: "Set when dst_kind=k8s_service (S10.3): the exposed Service the grant reaches; the compiler resolves it to the Service's CURRENT VIP." }
        # S10.3 warn-not-refuse: true when dst_kind=k8s_service but the Service is gone (unexposed/cluster deregistered) — the grant compiles to nothing (a silent no-op wearing a rule's face). DERIVED at read time from the LIVE Services, so it sheds if the Service returns. false otherwise.
        dst_k8s_service_vanished: { type: boolean }
        # S7.5.4: null = permanent; set = a temporary grant that lapses at this instant.
        expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    CreatePolicyRuleRequest:
      type: object
      required: [dst_kind]
      additionalProperties: false
      properties:
        # src_kind defaults to "group" when omitted (back-compat). user => src_user_id; site => src_site_id (S8.2); cidr => src_cidr (S8.7).
        src_kind: { type: string, enum: [group, user, site, cidr, agent] }
        src_group_id: { type: string, format: uuid, nullable: true, description: Required when src_kind=group (or omitted). }
        src_user_id: { type: string, format: uuid, nullable: true, description: Required when src_kind=user (a current org member). }
        src_site_id: { type: string, format: uuid, nullable: true, description: "Required when src_kind=site (S8.2); the compiler resolves it to the source site's approved subnet CIDRs (the LAN source)." }
        src_cidr: { type: string, nullable: true, description: "Required when src_kind=cidr (S8.7): a literal source CIDR, e.g. 172.31.17.64/32. Validated well-formed; org-range meaningfulness is a read-time warning, not a creation refusal (warn-not-refuse)." }
        src_device_id: { type: string, format: uuid, nullable: true, description: "Required when src_kind=agent (S15.3): the agent DEVICE whose /32 is the source. An agent is a peer, so a grant names exactly one device — never a node, which would grant every device behind that gateway." }
        dst_kind: { type: string, enum: [resource, group, site, k8s_service] }
        dst_resource_id: { type: string, format: uuid, nullable: true, description: Required when dst_kind=resource. }
        dst_group_id: { type: string, format: uuid, nullable: true, description: Required when dst_kind=group. }
        dst_site_id: { type: string, format: uuid, nullable: true, description: "Required when dst_kind=site (S8.1); the compiler resolves it to the site's approved subnet CIDRs." }
        dst_k8s_service_id: { type: string, format: uuid, nullable: true, description: "Required when dst_kind=k8s_service (S10.3); the compiler resolves it to the exposed Service's CURRENT VIP." }
        expires_at: { type: string, format: date-time, nullable: true, description: "Set = a temporary grant that expires at this time (must be future); omit for a permanent grant." }

    # ── S8.1 site-to-site ──
    Site:
      type: object
      required: [id, name, link_transport, created_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        link_transport: { type: string, enum: [wireguard], description: "Reserved enum (D4); wireguard-only in v1." }
        link_mtu: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
    DNSForward:
      type: object
      required: [domain, resolver_ip]
      additionalProperties: false
      properties:
        domain: { type: string, description: "The forwarded zone (e.g. corp.local)." }
        resolver_ip: { type: string, description: "The site's internal resolver — must be inside one of the site's approved subnets (S8.4)." }

    # ── S10.3 Kubernetes ──
    K8sCluster:
      type: object
      required: [id, site_id, name, vip_range, service_cidr, dns_zone, managed_by_operator]
      additionalProperties: false
      properties:
        # S10.2 D2 cond 1: true = GitOps-operator-managed; the dashboard badges it and warns on manual edit.
        managed_by_operator: { type: boolean }
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid, description: "The site whose gateway fronts this cluster." }
        connector_node_id: { type: string, format: uuid, nullable: true, description: "The explicit in-cluster gateway that resolves ready endpoints and DNATs service VIPs; null means the cluster is not serving traffic." }
        name: { type: string, description: "A DNS label; a hostname component of every exposed Service." }
        vip_range: { type: string, description: "The cluster's synthetic VIP range (CIDR), disjoint from all other org ranges." }
        service_cidr: { type: string, description: "The cluster's real Kubernetes Service CIDR (where ClusterIPs live)." }
        dns_zone: { type: string, description: "The customer's DNS zone suffix for exposed-Service hostnames." }
        dns_vip: { type: string, nullable: true, description: "The reserved DNS VIP (the gateway answers DNS here); never handed to a Service." }
        created_at: { type: string, format: date-time }
    K8sService:
      type: object
      required: [id, cluster_id, name, namespace, protocol, vip, fqdn, managed_by_operator]
      additionalProperties: false
      properties:
        # S10.2 D2 cond 1: true = GitOps-operator-managed; the dashboard badges it and warns on manual edit.
        managed_by_operator: { type: boolean }
        id: { type: string, format: uuid }
        cluster_id: { type: string, format: uuid }
        name: { type: string }
        namespace: { type: string }
        protocol: { type: string, enum: [tcp, udp, any] }
        port_low: { type: integer, nullable: true }
        port_high: { type: integer, nullable: true }
        vip: { type: string, description: "The synthetic /32 clients reach; DNAT'd to the ClusterIP at the gateway." }
        fqdn: { type: string, description: "The in-tunnel hostname clients use: <service>.<namespace>.svc.<cluster>.<zone> (copy, don't construct)." }
    RegisterK8sClusterRequest:
      type: object
      required: [site_id, name, vip_range, service_cidr, dns_zone]
      additionalProperties: false
      properties:
        site_id: { type: string, format: uuid, description: "The site gateway that fronts this cluster (one gateway = one site)." }
        connector_node_id: { type: string, format: uuid, nullable: true, description: "The active in-cluster connector already bound to site_id; required by the authenticated handler so sessionless requests retain a uniform 401." }
        name: { type: string, maxLength: 63, description: "A DNS label (lowercase a-z0-9 + hyphens)." }
        vip_range: { type: string, description: "The synthetic VIP range (CIDR), disjoint from pool/sites/other clusters." }
        service_cidr: { type: string, description: "The cluster's Kubernetes Service CIDR (e.g. 10.96.0.0/12)." }
        dns_zone: { type: string, description: "The customer's DNS zone (e.g. k8s.acme.com); need not be publicly registered." }
    ExposeK8sServiceRequest:
      type: object
      required: [name, namespace]
      additionalProperties: false
      properties:
        name: { type: string, description: "The Kubernetes Service name." }
        namespace: { type: string, description: "The Service's namespace." }
        protocol: { type: string, enum: [tcp, udp, any], description: "Protocol scope; omit for any." }
        port_low: { type: integer, nullable: true, description: "Low port of the exposed range; omit for all ports." }
        port_high: { type: integer, nullable: true, description: "High port; omit for a single port or all." }

    RoutedRanges:
      # CHANNEL CONTRACT (WF-A D-WFA-6 condition 1): this response may carry NETWORK-TOPOLOGY facts
      # (ranges, dial endpoint + gateway pubkey) and NEVER device-IDENTITY material (no private key, no
      # pool-address re-issue, no enrollment token). A future field addition meets THIS rule, not the
      # pre-WF-A "no keys/endpoints" precedent (which held only while the dial target was immutable).
      type: object
      required: [ranges, forwards]
      additionalProperties: false
      properties:
        ranges:
          type: array
          items: { type: string }
          description: "Approved site-subnet CIDRs (canonical masked form, sorted) pushed to split-tunnel device AllowedIPs (S8.5). Ranges only — no identity material. Empty when none declared."
        forwards:
          type: array
          items: { $ref: "#/components/schemas/DNSForward" }
          description: "DNS forwards whose resolver is REACHABLE via the returned ranges (S8.5 Slice 3). GATED: a forward is included only if its resolver_ip falls inside a routed range — a resolver you can't reach is never handed over (no SERVFAIL generator). Empty when none reachable."
        dial_endpoint:
          type: string
          nullable: true
          description: "WF-A: the device's current dial ENDPOINT (host:port) — the ACTIVE PRIMARY hub's endpoint when the device's assigned node is a hub-set member, so a running device re-homes on promotion. A network fact, not identity. NULL when no device_id was passed, or the device's node is not a hub-set member (it keeps its baked endpoint — the deferred spoke-device case)."
        dial_pubkey:
          type: string
          nullable: true
          description: "WF-A: the active-primary hub's WireGuard PUBLIC key — the peer the device swaps to on re-home (a different gateway = a different pubkey; the client does a peer SWAP, not an endpoint update). A public network address, not a secret. NULL under the same conditions as dial_endpoint; always paired with it."

    RouteLANRequest:
      type: object
      required: [node_id, cidr]
      additionalProperties: false
      properties:
        node_id: { type: string, format: uuid, description: "The gateway node that fronts this LAN." }
        cidr: { type: string, description: "The LAN CIDR to route (IPv4). Validated disjoint from the org's other subnets + pool." }
        name: { type: string, description: "Optional site name; blank derives a default from the CIDR (S8.5 D1 solo-admin path)." }

    HubPriorityRequest:
      type: object
      additionalProperties: false
      properties:
        priority:
          type: integer
          nullable: true
          description: "The admin hub pin (S8.6 D1) — lower = more preferred; null CLEARS the pin. Pinning declares a gateway a hub candidate; the PINNED set IS the HA hub set (opt-in)."
    HubSet:
      type: object
      required: [generation, members]
      additionalProperties: false
      properties:
        generation:
          type: integer
          format: int64
          description: "The set's version tag (S8.6 D5) — bumps on every membership/order change (a promotion event)."
        members:
          type: array
          items: { $ref: "#/components/schemas/HubMember" }
          description: "The ORDERED active hub set: members[0] = the acting primary, the rest = standbys."
    HubMember:
      type: object
      required: [node_id, role]
      additionalProperties: false
      properties:
        node_id: { type: string, format: uuid }
        role: { type: string, enum: [primary, standby] }
        hub_priority:
          type: integer
          nullable: true
          description: "The admin pin (the CONFIGURED order) — so the UI can show a promotion 'in effect' when the active order diverges. Null = unpinned."
        metrics:
          allOf: [ { $ref: "#/components/schemas/HubMemberMetrics" } ]
          nullable: true
          description: "Latest node_peer_status observation, or ABSENT when this member is not reporting (distinct from an idle link with zero bytes)."
    HubMemberMetrics:
      type: object
      required: [last_handshake_at, rx_bytes, tx_bytes]
      additionalProperties: false
      properties:
        last_handshake_at: { type: string, format: date-time }
        rx_bytes: { type: integer, format: int64, description: "Raw gauge since the last handshake (display only, never summed as monotonic)." }
        tx_bytes: { type: integer, format: int64 }

    SiteSubnet:
      type: object
      required: [id, site_id, cidr, status]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        cidr: { type: string, description: "IPv4 CIDR of the routed LAN (e.g. 10.20.0.0/24)." }
        status: { type: string, enum: [pending, approved], description: "Advertised subnets are pending until approved (D5)." }
    SiteReferences:
      type: object
      required: [rule_count, subnet_count]
      additionalProperties: false
      properties:
        rule_count: { type: integer, description: "Policy rules naming this site as src or dst (deleted on cascade)." }
        subnet_count: { type: integer, description: "Subnets advertised on this site (released on cascade)." }
      description: "S8.3 D1/D4: what references a site — the delete cascade preview + the reverse-link count."
    RegisterSiteRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
    AddSiteSubnetRequest:
      type: object
      required: [cidr]
      additionalProperties: false
      properties:
        cidr: { type: string, description: "IPv4 CIDR to advertise (e.g. 10.20.0.0/24)." }
    BindSiteNodeRequest:
      type: object
      required: [node_id]
      additionalProperties: false
      properties:
        node_id: { type: string, format: uuid }
    UnbindSiteNodeRequest:
      # S8.6 #6: node_id is OPTIONAL on unbind — with it, unbind THAT gateway (#3 explicit-id);
      # without it (the legacy bodyless caller, shimmed to {} at the router), unbind the site's
      # sole gateway. A separate schema from Bind, whose node_id is required.
      type: object
      additionalProperties: false
      properties:
        node_id: { type: string, format: uuid }

    ExtendGrantRequest:
      type: object
      required: [expires_at]
      additionalProperties: false
      properties:
        expires_at: { type: string, format: date-time, description: "The grant's new expiry (must be in the future)." }

    SetPolicyRuleEnabledRequest:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: { type: boolean, description: "F3: true = the rule contributes its allow; false = disabled (permission withdrawn, as-if-absent under default-deny)." }

    InstallLicenseRequest:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 4096
          description: The licence key, as emailed. Begins `tnxl_`.
    LicenseStatus:
      type: object
      additionalProperties: false
      required: [state, tier, gateway_ceiling, org_ceiling, features]
      properties:
        state:
          type: string
          enum: [unlicensed, valid, expired, lapsed]
          description: >-
            unlicensed = no key, Community, not an error. expired = past expiry but inside grace;
            NOTHING STOPS. lapsed = past grace; gated capabilities stop and the VPN does not.
        tier:
          type: string
          enum: [community, trial, starter, growth, scale]
        gateway_ceiling:
          type: integer
          nullable: true
          description: Gateways this deployment may ENROL. null means unlimited. Running gateways are never stopped.
        gateways_in_use:
          type: integer
          description: >-
            Live gateways ACROSS EVERY ORGANIZATION — the number the ceiling is actually checked against.
            A per-org count paired with this ceiling reads as spare capacity that does not exist: a fresh
            organization would show 0 of 5 on a deployment that is already full and refuses the enrolment.
        org_ceiling:
          type: integer
          nullable: true
          description: Organizations it may CREATE. null means unlimited.
        features:
          type: array
          items: { type: string }
          description: The named capabilities this tier grants.
        # ⛔ THE STORE'S HEALTH IS SEPARATE FROM THE ENTITLEMENT, AND THE THREE STATES MUST STAY
        # DISTINGUISHABLE. "No licence installed" is a HEALTHY state and must never render as a fault;
        # "the store is unreachable" means the deployment is serving its last known verdict and has
        # downgraded nobody; "a stored key was rejected" means Community is being served on purpose.
        # Collapsing any two sends an operator to look for the wrong thing — the self_verify_failed shape.
        store_stale:
          type: boolean
          description: >-
            The licence store could not be read. The entitlement above is the LAST KNOWN one — nothing has
            been downgraded, and it recovers on its own. NOT the same as having no licence.
        store_rejected:
          type: string
          nullable: true
          enum: [expired, malformed, unknown_kid, bad_signature, null]
          description: >-
            A key IS stored and does not verify. Community is being served deliberately, and this names
            which failure it was so the remedy is obvious.
        store_detail:
          type: string
          nullable: true
          description: Operator-readable explanation of store_stale / store_rejected.
        expires_at:
          type: string
          format: date-time
          nullable: true
        grace_ends_at:
          type: string
          format: date-time
          nullable: true
          description: When gated capabilities stop. Absent unless expired.
        clock_went_backwards:
          type: boolean
          description: >-
            The deployment's clock moved materially backwards. Reported, never enforced — a backward clock
            is overwhelmingly a VM restore or an NTP correction.
    ZeroTrustMode:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [off, enforcing]
          description: "off = legacy blanket mesh; enforcing = default-deny + compiled allows."
        affected_full_tunnel_devices:
          type: array
          description: >
            On ENABLING enforcing (PUT only), the full-tunnel devices whose internet egress
            becomes policy-governed by the flip — the blast radius for the warn-and-confirm.
            The server obeys regardless; this is the honest count + names. Absent/empty when
            disabling or when none are affected. State name for these = egress_policy_denied
            (distinct from gateway_no_egress: the gateway CAN egress, policy is denying it).
          items: { $ref: "#/components/schemas/AffectedDevice" }

    AffectedDevice:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    # One stranded allocation. reason distinguishes out_of_range (visibly outside
    # the new range) from reserved_collision (numerically INSIDE it but on the new
    # network/gateway/broadcast — looks fine to the eye, still stranded).
    Orphan:
      type: object
      required: [device_id, name, assigned_ip, reason]
      additionalProperties: false
      properties:
        device_id: { type: string, format: uuid }
        name: { type: string }
        assigned_ip: { type: string }
        reason: { type: string, enum: [out_of_range, reserved_collision] }

    # 409 body when a resize would strand live allocations. orphan_count is the
    # true total; orphans is capped (the caller renders the list, the count is honest).
    ResizeConflict:
      type: object
      required: [orphan_count, orphans]
      additionalProperties: false
      properties:
        orphan_count: { type: integer }
        orphans:
          type: array
          items: { $ref: "#/components/schemas/Orphan" }

    CreateOrganizationRequest:
      type: object
      required: [name, slug]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          minLength: 1
          maxLength: 63
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"

    UpdateOrganizationRequest:
      type: object
      required: [name]
      additionalProperties: false
      description: Only the name is mutable; the slug is fixed at creation.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200

    SetOrganizationAgentQuotaRequest:
      type: object
      required: [max_agent_identities]
      additionalProperties: false
      description: "F02 H1-H3. Null explicitly clears the quota and means unlimited."
      properties:
        max_agent_identities:
          type: integer
          format: int32
          minimum: 0
          nullable: true

    GatewayEndpoint:
      type: object
      required: [url, configured]
      additionalProperties: false
      properties:
        url:
          type: string
          description: The raw mTLS gateway control URL used by future join commands.
        configured:
          type: boolean
          description: False when the deployment has no explicit gateway endpoint yet.

    UpdateGatewayEndpointRequest:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 300
          description: Absolute https URL for the raw mTLS agent listener, normally ending in :8443.

    # ---- CLI credential flow (S5.1) ----------------------------------------
    CliAuthorizeRequest:
      type: object
      required: [redirect_uri, code_challenge, state]
      additionalProperties: false
      properties:
        redirect_uri:
          type: string
          maxLength: 200
          description: >
            Loopback only — http://127.0.0.1:<port>/callback or
            http://[::1]:<port>/callback (any port, exactly that path; hostnames
            incl. "localhost" are refused — DNS-spoofable).
        code_challenge:
          type: string
          minLength: 43
          maxLength: 128
          description: PKCE S256 challenge (base64url SHA-256 of the CLI's verifier).
        state:
          type: string
          minLength: 1
          maxLength: 200
          description: Echoed to the loopback callback verbatim (CLI-side correlation/CSRF).

    CliAuthorizeResponse:
      type: object
      x-go-name: CliAuthorizeResult
      required: [code, state, expires_in]
      additionalProperties: false
      properties:
        code: { type: string, description: "One-time authorization code (single-use, hashed at rest)." }
        state: { type: string }
        expires_in: { type: integer, description: "Code lifetime in seconds (60)." }

    CliTokenRequest:
      type: object
      required: [code, code_verifier, redirect_uri]
      additionalProperties: false
      properties:
        code: { type: string, minLength: 1, maxLength: 200 }
        code_verifier: { type: string, minLength: 43, maxLength: 128 }
        redirect_uri:
          type: string
          maxLength: 200
          description: Must EXACTLY match the redirect the code was bound to at mint.

    # WRITE-ONCE SECRET: the token appears ONLY here, never in any GET/list
    # response type (structural absence — the proof-of-secret convention).
    # x-go-name avoids colliding with oapi-codegen's generated CliTokenResponse
    # operation wrapper (Go naming only; the wire contract is unchanged).
    CliTokenResponse:
      type: object
      x-go-name: CliCredentialGrant
      required: [token, expires_at, fingerprint]
      additionalProperties: false
      properties:
        token:
          type: string
          description: >
            The dedicated CLI bearer credential, prefixed tnx_ (secret-scanner
            matchable). Shown exactly once; stored hashed; send as
            "Authorization: Bearer <token>".
        expires_at: { type: string, format: date-time, description: "Absolute expiry (90 days)." }
        fingerprint: { type: string, description: "Keyed 12-hex proof-of-secret; matches audit rows." }

    CliCredential:
      type: object
      required: [id, name, fingerprint, created_at, expires_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: "Client-supplied label (e.g. hostname) or a default." }
        fingerprint: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    CliDeviceStartResponse:
      type: object
      x-go-name: CliDeviceStartResult
      required: [device_code, user_code, verification_uri, interval, expires_in]
      additionalProperties: false
      properties:
        device_code: { type: string, description: "Poll credential; never shown to the user." }
        user_code: { type: string, description: "Short human code entered in the browser." }
        verification_uri: { type: string }
        interval: { type: integer, description: "Minimum poll interval in seconds." }
        expires_in: { type: integer }

    CliDeviceApproveRequest:
      type: object
      required: [user_code]
      additionalProperties: false
      properties:
        user_code: { type: string, minLength: 1, maxLength: 32 }

    CliDeviceTokenRequest:
      type: object
      required: [device_code]
      additionalProperties: false
      properties:
        device_code: { type: string, minLength: 1, maxLength: 200 }

    GenericMessage:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message: { type: string }

    Invitation:
      type: object
      required: [id, email, role, expires_at, created_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [owner, admin, member] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        # ⛔ THE THREE TERMINAL STATES ARE TIMESTAMPS, NOT A STATUS ENUM — the table stores them that way
        # and the client derives `pending | accepted | revoked | expired` from them plus the clock. EXPIRED
        # is derived and never stored, so a status field would go stale the moment it was written.
        accepted_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        # NULLABLE ON PURPOSE: invitations.invited_by_user_id is ON DELETE SET NULL, so the inviter can be
        # gone. The render needs an arm for that; it is the `managed_by_machine` shape again.
        invited_by_user_id: { type: string, format: uuid, nullable: true }
        invited_by_email: { type: string, nullable: true }

    InviteCreated:
      type: object
      required: [message, invite_token]
      additionalProperties: false
      properties:
        message: { type: string }
        invite_token:
          type: string
          description: >-
            Raw one-time accept token. The dashboard builds the accept link
            (origin + /accept-invite?token=…) for the admin to hand to the invitee
            — the SMTP-less delivery path. Also emailed when SMTP is configured.
            Shown once; not retrievable later.
        delivered:
          type: boolean
          description: >-
            Whether the invitation email actually left. ⛔ False means the invitation EXISTS and delivery
            FAILED — two facts, both true. The token is still valid and can be handed over another way, so
            the invitation is kept; what changes is that the response stops claiming a send happened.

    SsoRedirect:
      type: object
      required: [redirect_url]
      additionalProperties: false
      properties:
        redirect_url: { type: string }

    UpdateNodeRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: "The gateway's display name. A label: nothing consumes it structurally, which is why it is the one field safe to edit."

    TransferNodeDevicesRequest:
      type: object
      required: [target_node_id]
      additionalProperties: false
      properties:
        target_node_id:
          type: string
          format: uuid
          description: "The LIVE gateway the devices are moved to. Required rather than defaulted: there is no correct guess, and a wrong destination moves a fleet onto a gateway that cannot serve it."

    TransferNodeDevicesResponse:
      # x-go-name for the SAME reason RestoreNodeDevicesResponse carries one: oapi-codegen derives a response
      # wrapper named <operationId>Response, so this schema would collide with the wrapper for
      # `transferNodeDevices` and apps/cli would not compile. Sixth-and-seventh instance of that class; the
      # sweep that found the first six is why this one is here from the start rather than after a red.
      x-go-name: TransferDevicesResult
      type: object
      required: [moved, needs_reissue, devices]
      additionalProperties: false
      properties:
        moved: { type: integer, description: "How many devices are now homed on the destination." }
        needs_reissue:
          type: integer
          description: "How many of those moved devices hold a config that no longer works. THIS IS THE NUMBER THAT MATTERS, not `moved`: the row moving and the config following are different events. A static export bakes the gateway's endpoint and public key and never polls, so it is always in this count; a managed device re-homes itself ONLY when the destination is in the active hub set, so it is in this count otherwise."
        devices:
          type: array
          items:
            type: object
            required: [id, name, needs_reissue]
            additionalProperties: false
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              needs_reissue: { type: boolean }
              reissue_cause:
                type: string
                description: "Why this device's config stopped working. `static_export` — a file that cannot be re-pointed. `destination_not_hub_set_member` — a managed device whose destination it cannot follow itself onto. `destination_self_homing_unknown` — the topology could not be read, reported as needing a re-issue because overstating the work is recoverable and understating it means the user finds out by failing to connect. Absent when needs_reissue is false."
                enum: [static_export, destination_not_hub_set_member, destination_self_homing_unknown]

    RestoreNodeDevicesRequest:
      type: object
      required: [target_node_id]
      additionalProperties: false
      properties:
        target_node_id:
          type: string
          format: uuid
          description: "The LIVE gateway the restored devices are homed to. Required rather than defaulted: a revoked gateway is never active again, so there is no sane default, and silently restoring onto the dead node would produce active devices pointing at a gateway that will never serve them."

    RestoreNodeDevicesResponse:
      # THIRD INSTANCE of the generator-collision class, and the first one the guard did not catch in time.
      # oapi-codegen derives a response wrapper named <operationId>Response, so this schema collided with the
      # wrapper for operationId `restoreNodeDevices` and apps/cli would not compile. `make test-cli` was added at
      # S11-2 for exactly this and CAUGHT it — but CI never ran on a story branch (ci.yml fires on push:[main],
      # tags and pull_request), so it stayed silent through the whole epic until a draft PR was opened.
      # A SWEEP OF EVERY SCHEMA AGAINST EVERY DERIVED WRAPPER NAME (2026-08-01) found SIX collisions; the other
      # five — CliAuthorizeResponse, CliDeviceStartResponse, CliTokenResponse, CreateDeviceResponse,
      # ExportOVPNProfileResponse — already carry x-go-name. This was the only one missing it.
      x-go-name: RestoreDevicesResult
      type: object
      required: [restored, readdressed, devices]
      additionalProperties: false
      properties:
        restored: { type: integer, description: "How many devices came back." }
        readdressed:
          type: integer
          description: "How many could NOT reclaim their original address. Each of those users must re-import their config; the device list surfaces it as needs_reexport."
        devices:
          type: array
          items:
            type: object
            required: [id, name, kept_address, assigned_ip]
            additionalProperties: false
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              kept_address: { type: boolean }
              assigned_ip: { type: string }
              previous_assigned_ip: { type: string }

    RekeyChallengeRequest:
      type: object
      additionalProperties: false
      properties:
        cert_serial:
          type: string
          description: "Serial of the agent's CURRENT (expired) certificate. NO length or pattern constraint, deliberately and for the same reason key_fingerprint carries none: a schema violation answers 400 where an unknown identifier answers 403, and that difference tells a prober how far they got. The handler validates and returns the UNIFORM refusal. The 64 KiB body cap bounds the request. Keyed on the serial rather than the node name: names are guessable, serials are not, so a name-keyed challenge would be an enumeration oracle (D9)."
        key_fingerprint:
          type: string
          description: "SHA-256 of the agent's recorded public key (SPKI DER), lowercase hex — the SECOND identifier (D10). Supply EXACTLY ONE of cert_serial or key_fingerprint; supplying both, neither, or a malformed value is refused identically to an unknown identifier, so the endpoint cannot be probed for well-formedness. It exists because a re-key whose RESPONSE is lost leaves the control plane holding a serial the agent never received: the agent's stored serial is stale, and its only durable handle on its own identity is the key material the control plane recorded. No length or pattern constraint here on purpose — a schema violation would answer with 400 where an unknown identifier answers 403, which is a distinction worth denying."

    RekeyNonce:
      # NAMED TO AVOID A GENERATOR COLLISION. oapi-codegen derives a response wrapper called
      # <operationId>Response, so a schema named RekeyChallengeResponse collides with the wrapper for
      # operationId rekeyChallenge and breaks the Go CLI client's compilation. Second instance of this
      # class: S11-2 hit it with MintMachineCredentialResponse, and `make test-cli` was added THEN to
      # catch exactly this — it did.
      type: object
      required: [nonce]
      additionalProperties: false
      properties:
        nonce:
          type: string
          description: "base64 single-use nonce, valid for minutes. Returned regardless of whether the serial is known."

    RekeyRequest:
      type: object
      required: [nonce, csr, signature, agent_version]
      additionalProperties: false
      properties:
        cert_serial: { type: string, description: "Serial of the certificate being replaced. EXACTLY ONE of cert_serial or key_fingerprint. No length constraint — see RekeyChallengeRequest." }
        key_fingerprint:
          type: string
          description: "SHA-256 of the recorded public key (SPKI DER), lowercase hex. Must match the identifier the challenge was issued for — a nonce is bound to its identifier, so the two cannot be mixed. See RekeyChallengeRequest for why a second identifier exists."
        nonce: { type: string, description: "base64 nonce from /agent/rekey/challenge." }
        csr: { type: string, description: "PEM CSR for the agent's NEW keypair. The old key may be compromised or discarded, so re-key always issues over fresh material." }
        signature:
          type: string
          description: "base64 RSA-PKCS1v15-SHA256 over (nonce || CSR DER), signed by whichever private key the control plane RECORDED for this node — the expired certificate's key when identifying by cert_serial, or the key named by key_fingerprint. Binding to the CSR is required: without it a captured proof pairs with an attacker's own CSR."
        agent_version: { type: string, maxLength: 50 }

    RekeyResponse:
      type: object
      required: [cert_pem, ca_pem]
      additionalProperties: false
      properties:
        cert_pem: { type: string }
        ca_pem: { type: string }

    EnrollRequest:
      type: object
      required: [join_token, csr, node_name, agent_version, protocol_version]
      additionalProperties: false
      properties:
        join_token: { type: string, minLength: 1, maxLength: 200 }
        csr: { type: string, description: "PEM-encoded certificate signing request" }
        node_name: { type: string, minLength: 1, maxLength: 100 }
        agent_version: { type: string, maxLength: 50 }
        protocol_version: { type: integer }

    EnrollResponse:
      type: object
      required: [node_id, certificate, ca_certificate]
      additionalProperties: false
      properties:
        node_id: { type: string, format: uuid }
        certificate: { type: string, description: "PEM agent certificate" }
        ca_certificate: { type: string, description: "PEM CA certificate" }

    Agent:
      type: object
      required: [device_id, name, gateway_name, unattributable, status]
      additionalProperties: false
      properties:
        device_id: { type: string, format: uuid }
        name: { type: string }
        owner_email:
          type: string
          nullable: true
          x-omitempty: true
          description: The human who enrolled this agent. Resolved from `users`, so it survives them leaving the org.
        address:
          type: string
          nullable: true
          description: The agent's own /32 on the tunnel — what a grant matches on, and what a flow event is attributed by.
        gateway_name: { type: string, description: "The gateway this agent connects THROUGH. Its traffic is forwarded there, which is why the policy chain sees it." }
        node_id: { type: string, format: uuid }
        unattributable:
          type: boolean
          description: >-
            No owner is recorded, so activity cannot be tied to a person. ⛔ A statement about the AUDIT
            TRAIL, never about permission — an unattributable agent is not less authorized.
        config_issued:
          type: boolean
          description: >-
            A WireGuard key is registered — the connect command was issued. ⛔ RENAMED FROM `connected`, WHICH
            WAS A LIE: it reported a row's shape, not a connection, so an agent that had never once handshaked
            read as connected. It is a statement about ISSUANCE and carries no time component at all.
        online:
          type: boolean
          description: >-
            DERIVED from handshake recency against the same window as `Device.online` — WireGuard has no
            connection state. ⚠ Only meaningful when `gateway_reporting` is true; the gateway is the sole
            reporter of peer liveness, so its silence makes every agent on it read offline.
        last_handshake_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Last WireGuard handshake, as reported by the gateway. `null` means NO handshake has ever been
            recorded — with `config_issued` true that is "never connected", which is a different fact from
            "was connected, now stale".
        gateway_reporting:
          type: boolean
          description: >-
            ⛔ THE FIELD THAT STOPS THE UI BLAMING THE AGENT FOR THE GATEWAY'S SILENCE. Peer liveness reaches
            the control plane ONLY through the gateway's status push, so a dead gateway and a dead agent
            produce an identical absence of handshakes. When this is false, `online` says nothing about the
            agent and the surface must render liveness as UNKNOWN, not as offline. ⚠ Measured from the
            freshness of the STATUS channel itself (`device_status.updated_at`), not from the gateway's
            separate `/agent/report` clock — a freshness claim must be stamped by the channel it vouches for.
        rx_bytes: { type: integer, format: int64, nullable: true }
        tx_bytes: { type: integer, format: int64, nullable: true }
        status: { type: string }

    Node:
      type: object
      required: [id, name, status, agent_version, enrolled_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [active, revoked] }
        agent_version: { type: string }
        enrolled_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        policy_degraded:
          type: boolean
          description: >-
            Zero Trust (enterprise): a single CONSERVATIVE health signal for the gateway's policy
            enforcement. degraded = (apply error) OR (an enforcing apply is currently failing) OR
            (enforcing AND the policy in force differs from what the control plane would push now).
            The field errs toward OVER-reporting (a false "degraded" is an annoyance; a false
            "healthy" is the silent-blackhole class) — except in the provider can't-determine window,
            where the gateway is guaranteed on its last-good fail-closed policy (never open, never
            blackholing from this cause). The differentiated breakdown (which kind of degraded) + badge
            UX is S7.4, reading the same agent-reported JSONB.
        owner_user_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            S15.2/D14: the human this agent principal acts for — carried from the join token's ISSUER at
            enrolment. NULL means UNATTRIBUTABLE, never "nobody is responsible": it means the control plane
            cannot say who authorised this agent into the org, which is a different and weaker claim.
        owner_email:
          type: string
          nullable: true
          description: >-
            Resolved server-side from owner_user_id by LEFT JOIN on users (S15.1/D22 — the roster cannot
            name an owner who has LEFT the org, and that is exactly the row an accountability screen exists
            for). NULL when unattributable.
        endpoint:
          type: string
          nullable: true
          description: >-
            The public host:port peers dial to reach this gateway. ⛔ EMPTY MEANS NO PEER CAN CONNECT: a
            config issued for such a gateway carries `Endpoint = ` and wg-quick refuses it. Surfaced so a
            client can refuse to issue an unusable config rather than emitting one.
        egress_mode:
          type: string
          nullable: true
          enum: [dual_stack, ipv4_only, checking]
          description: >-
            Gateway egress capability used for newly generated profiles. dual_stack means verified IPv4 and
            IPv6 egress; ipv4_only means verified IPv4 egress with IPv6 blocked by the client kill-switch;
            checking means the gateway has not reported enough capability yet.
        unattributable:
          type: boolean
          description: >-
            S15.2/D25(C) — DEGRADE, DO NOT REFUSE. An agent with no owner KEEPS RUNNING and says so. An
            unattributable tunnel is a LOGGING failure, not an access-control one: the policy engine still
            enforces every rule, so refusing at use would take a tunnel down for an identity-management
            reason and buy nothing. Contrast the cold-start deny-until-first-fetch, which IS fail-closed
            because its alternative is a breach. This flag is what the operator sees instead.
        site_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            S8.3 (D2/CH): the site this gateway is bound to (null = not a site gateway). The topology view
            joins nodes to sites by this field — a site's gateways are the nodes with this site_id, rendered
            as a LIST (many nodes → one site scales to future HA; the UI never assumes one-gateway-per-site).
        max_policy_version:
          type: integer
          nullable: true
          description: >-
            S8.3 (CW): the agent's REPORTED max-supported policy version — observability (a reported fact,
            OUTSIDE the compile hash; no ProtocolVersion bump). NULL = never reported (a pre-upgrade agent):
            absence reads as BELOW the current ceiling, never unknown-treated-as-ready (S7.5.3 absence-is-
            not-compliance, applied to version readiness). The UI's cross-site upgrade warning names the
            gateways whose max is below the ceiling.
        ovpn_health:
          type: string
          enum: [ovpn_certs_absent, ovpn_binary_absent, ovpn_transit_conflict]
          description: >-
            S9.1 (4d): the OpenVPN server's refuse-loudly kind, present ONLY when an OVPN-enabled gateway is
            not serving. ovpn_certs_absent / ovpn_binary_absent = missing material or binary; ovpn_transit_conflict
            (WF-OVPN-2) = the server tun's transit range overlaps the device pool or a pushed route on this
            gateway (a local disjointness guard). A DIFFERENT axis from policy health — surfaced so an operator
            sees WHY. Absent when healthy (resolves on its own once the material/binary/config is corrected).
        is_site_hub:
          type: boolean
          description: >-
            S8.3 (D2): true iff this gateway is the org's transit HUB — a PROJECTION of the ONE hub election
            (`electSiteHub`, the endpoint-bearing gateway with the lowest id; single hub v1). Backend-derived
            so the UI never re-elects the hub in TS. Absent/false for non-gateway nodes and NAT-only meshes.
        policy_degraded_kind:
          type: string
          enum: [healthy, apply_failing, stuck_enforcing, converging, silent_desync, desync_unknown, unsupported_policy_version, site_hub_down, site_link_down, site_subnet_unreachable, conntrack_flush_unavailable, hub_forwarding_not_reconciling, k8s_endpoints_unavailable, cert_expired_cannot_reconnect]
          description: >-
            S7.4b: the ADVISORY differentiated health kind — display detail
            over `policy_degraded`, which stays the sole authoritative signal (nothing keys logic on
            this).
            ⚠ EDITION: THE FIELD IS SERVED IN BOTH EDITIONS, and MOST kinds are edition-independent.
            ENTERPRISE-ONLY is the DESYNC TRIO — `converging`, `silent_desync`, `desync_unknown` — which come
            from `degradedKind(...)` under the `case enterprise:` arm, because only an enterprise build has a
            policy engine that can desync. EVERY OTHER KIND has an explicit `!enterprise` branch in
            `internal/nodes/service.go` (the switch at ~L1955): `cert_expired_cannot_reconnect`,
            `unsupported_policy_version`, `site_hub_down`, `site_link_down`, `site_subnet_unreachable`,
            `hub_forwarding_not_reconciling`, `apply_failing`, `stuck_enforcing`,
            `k8s_endpoints_unavailable`, `conntrack_flush_unavailable`. `healthy` is the default in both.
            `ListNodes` sets the field unconditionally (`internal/http/node_handlers.go`).
            THIS PARAGRAPH IS LOAD-BEARING (S14.5): it previously opened "Zero Trust (enterprise, S7.4b)",
            which reads as enterprise-ONLY. A UI gated on `edition === "enterprise"` on the strength of that
            line would silently deny the open edition a site-link health signal it is entitled to — the
            edition-mistaken-for-absence class. Corrected, not annotated: on an OpenAPI-first codebase a
            wrong description is a wrong source of truth. ⚠ THE CORRECTION'S OWN FIRST DRAFT WAS ALSO WRONG
            (it put `stuck_enforcing` on the enterprise side and named only 4 of the 10 open-edition kinds)
            and was caught only by reading the switch rather than reasoning about which kinds "sound like"
            policy features. VERIFY AGAINST THE SWITCH, NOT AGAINST THE NAME.
            `desync_unknown` is a FIRST-CLASS honest state (compile-hash unavailable, or the
            gateway stopped reporting) — it means "cannot determine", NEVER healthy and NEVER a specific
            kind. `converging` is a normal push settling (< the report-cadence debounce) and must not
            alarm; `silent_desync` is a stuck pushed≠applied past the debounce with fresh reports.
            `unsupported_policy_version` (S8.1 D1): the agent REFUSED the compiled artifact (its Version
            exceeds what the agent can apply) and went deny-all — the ONE kind whose remedy is
            edition-independent and operator-side: upgrade the agent. Set for any edition (the version
            gate lives on the agent, not the policy engine).
            `site_hub_down` / `site_link_down` (S8.2 H5/B2; site_link_down CP-derived WF-B): a SITE gateway's
            site-to-site transit is down — no public-endpoint carrier (`site_hub_down`) or the ACTIVE PRIMARY
            hub is stale (`site_link_down`, the org-level HEADLINE from THE ONE liveness derivation, NOT the
            retired agent bool). A down site bridge is never green. Hub outranks a single link-down. NOTE:
            a DEMOTED member's dead link while transit rides the active primary is NOT this headline — it is
            the subordinate `site_link_note_peer` (below), so a healthy failover reads transit-healthy.
            `site_subnet_unreachable` (S8.2c D3): the gateway advertises a local site subnet but NO host
            address is inside it (bridge-trapped wg0 / misconfig) — agent-reported and INDEPENDENT of link
            state, so it catches the reassuring-green shape where the link handshake is fresh yet forwarded
            traffic can't be sourced onto the LAN. Ranks below the link-down kinds (a dead link masks it).
            `hub_forwarding_not_reconciling` (WF-C L2 D-WFC2-1a): a hub-set member whose spoke-observed
            handshake is FRESH (its wg0 keeps forwarding) while its OWN agent is SILENT (last_seen stale —
            crashed/OOM, but the host-netns interface it created survives). A "zombie hub": wire warm, brain
            dead — it can't reconcile, so a since-revoked device / tightened grant it never received is still
            enforced as the frozen last artifact (stale-enforcement). NEITHER plain "offline" (it forwards)
            NOR healthy (it's stale) — a distinct honest state, remedy = restart the agent (the wire is fine).
            A CONJUNCTION of two existing signals (the ONE liveness derivation's wire-freshness ⋂ last_seen
            staleness), edition-independent. Ranked above the apply/desync kinds so a dead agent's frozen
            last report can't mask it.
        site_link_note_peer:
          type: string
          nullable: true
          description: >-
            WF-B: the SUBORDINATE site-link note — a DEMOTED hub member whose link is dead WHILE org transit
            rides the active primary (healthy). Names the demoted-dead peer for a distinct line item
            ("aws-gw-1 (demoted)"), INDEPENDENT of `policy_degraded_kind` (the headline stays its real
            state). NULL = no note. Never set alongside a `site_link_down` headline (a real transit failure
            gets no reassuring subordinate — the inverse-red guard). Derived from THE ONE liveness census.
        site_link_note_demoted:
          type: boolean
          nullable: true
          description: >-
            WF-B: true iff `site_link_note_peer` is set — carries the render's "(demoted)" qualifier so the
            operator distinguishes "expected, this member was failed-over-past" from a live peer's real
            outage. Absent when there is no note.

    JoinTokenRequest:
      type: object
      additionalProperties: false
      properties:
        node_name: { type: string, maxLength: 100 }
        enrols_kind:
          type: string
          enum: [gateway, agent]
          description: >-
            S15.3 — THE OPERATOR'S DECLARATION of what this token enrols. Captured at mint, the same instant
            as the issuer, because that is the one act that says both who is accountable and what is being
            brought online. ⛔ ABSENCE IS THE CLOSED STATE: omitted means 'gateway'. A token that enrols an
            agent must say so, and an agent additionally requires an issuer (D14) — both conditions, not one.

    JoinTokenResponse:
      type: object
      required: [join_token]
      additionalProperties: false
      properties:
        join_token: { type: string }

    Device:
      type: object
      required: [id, user_id, node_id, name, status, public_key, created_at, full_tunnel]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        name: { type: string }
        platform: { type: string }
        kind:
          type: string
          enum: [human, agent]
          description: >-
            S15.2/S15.3 — what KIND of principal this device belongs to. 'agent' is a data-plane agent's own
            row: it is cap-EXEMPT (a fleet of gateways must not spend one admin's laptop allowance), unique
            per node, and address-bearing so the agent is attributable. 'human' is everything else.
            ⛔ STRUCTURAL, not descriptive — code branches on this. Contrast Resource.label, which carries
            nothing and is an operator's free-text note.
        public_key: { type: string }
        full_tunnel: { type: boolean, description: "The device's issued routing mode: true = full tunnel, false = split tunnel." }
        assigned_ip: { type: string }
        needs_reexport:
          type: boolean
          description: "True when the config this device was ISSUED no longer matches reality, so the user must re-import it. Three causes: (1) its baked site ROUTES no longer match the org's current routed ranges — STATIC exports only, since a managed device polls routes; (2) its baked tunnel ADDRESS is not the device's current address — EVERY mode, including managed, because every issued config embeds an interface address; (3) its baked GATEWAY is not the device's current gateway — STATIC exports only, because a static export is a file that never polls and cannot be re-pointed, whereas a managed device re-homes itself through the dial channel (residual: only when its node is a hub-set member). Reported for all provisioning modes; false when nothing was recorded at issuance (rows predating the address snapshot), because unknown must not be reported as stale. Advisory, never enforcement."
        status: { type: string, enum: [active, revoked, pending, suspended] }
        approved_by:
          type: string
          format: uuid
          nullable: true
          description: "S7.3: who approved this device. null = grandfathered / auto-active (device_approval off). Set = explicitly approved."
        created_at: { type: string, format: date-time }
        # Live status (S3.6). last_handshake_at is the most recent WireGuard
        # handshake; `online` is DERIVED from its recency (WireGuard has no
        # connection state) — treat it as an approximation. rx/tx are raw byte
        # gauges that reset when the interface restarts (display only).
        last_handshake_at: { type: string, format: date-time }
        online: { type: boolean }
        rx_bytes: { type: integer, format: int64 }
        tx_bytes: { type: integer, format: int64 }
        # Device health / posture (S7.5.3). Present ONLY when the org has >= 1
        # posture check configured (enterprise) — otherwise omitted, so an org
        # that never opted in sees no posture noise. health_state 'unknown' =
        # NO REPORT, or a STALE report. ⛔ CORRECTED S14.10: this line also said
        # "or the fact was reported absent", and that third cause CANNOT OCCUR —
        # measured in the schema and the evaluator. `device_health.evaluated_state`
        # is NOT NULL with CHECK (compliant|noncompliant), and the evaluator does
        # `if f.DiskEncrypted == nil { continue }` ("absence never blocks"), so a
        # device that reports WITHOUT a fact is evaluated COMPLIANT, never unknown.
        # The wrong disjunct cost a full build-and-revert of a third UI label.
        # ABSENCE IS STILL NOT COMPLIANCE for the two real causes: never render
        # unknown as a pass. health_blocked is the
        # enforcement fact (the device is excluded from every gateway while true).
        health_state: { type: string, enum: [compliant, noncompliant, unknown] }
        health_blocked: { type: boolean }
        health_os_version: { type: string }
        # Tri-state: true/false = the client's reported fact; absent = not reported.
        health_disk_encrypted: { type: boolean }
        health_reported_at: { type: string, format: date-time }
        health_failed_checks:
          type: array
          items:
            type: object
            required: [kind, mode]
            additionalProperties: false
            properties:
              kind: { type: string, enum: [os_version, disk_encryption] }
              mode: { type: string, enum: [warn, require] }

    CreateDeviceRequest:
      type: object
      required: [name, node_id]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        node_id: { type: string, format: uuid }
        platform: { type: string, maxLength: 50 }
        # Omit public_key to have the server generate the keypair (browser flow):
        # the private key is then returned ONCE and never stored.
        public_key: { type: string }
        # Admins may create a device on behalf of another org member; omit for self.
        user_id: { type: string, format: uuid }
        # Route all traffic (0.0.0.0/0). Default false = split-tunnel (org network only).
        full_tunnel: { type: boolean }
        kind:
          type: string
          enum: [human, agent]
          description: >-
            S15.3 — 'agent' enrols an AI agent as a PEER homed on the chosen gateway. ⛔ An agent is a
            CLIENT, not a gateway: it holds its own /32, its traffic is FORWARDED through the gateway, and
            the policy chain therefore sees it. Default 'human'.
        # S9.1 Part-2: "static" for a file/QR export (bakes approved ranges + DNS since the client cannot poll); default "managed" (a polling Tunnex client).
        provisioning: { type: string, enum: [managed, static] }

    AgentProfile:
      type: object
      required: [device_id, name, environment, runtime, labels, owner_id, owner_email, managing_group_id, managing_group_name, status, permissions]
      additionalProperties: false
      properties:
        device_id: { type: string, format: uuid }
        name: { type: string }
        environment: { type: string }
        runtime: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        owner_id: { type: string, format: uuid }
        owner_email: { type: string, format: email }
        managing_group_id: { type: string, format: uuid, nullable: true }
        managing_group_name: { type: string, nullable: true }
        status: { type: string, enum: [pending, active, suspended, revoked] }
        last_handshake_at: { type: string, format: date-time, nullable: true }
        rx_bytes: { type: integer, format: int64, nullable: true }
        tx_bytes: { type: integer, format: int64, nullable: true }
        permissions: { $ref: "#/components/schemas/AgentEffectivePermissions" }

    AgentEffectivePermissions:
      type: object
      required: [view_privileged, manage, assign, grant_access, revoke, rotate_credentials]
      additionalProperties: false
      description: Server-computed authority for this exact agent; clients must not infer it from the organization role.
      properties:
        view_privileged: { type: boolean }
        manage: { type: boolean }
        assign: { type: boolean }
        grant_access: { type: boolean }
        revoke: { type: boolean }
        rotate_credentials: { type: boolean }

    ManagedAgentConfig:
      type: object
      description: >-
        Secret-free server-owned configuration for one managed agent. Runtime credentials, bootstrap tokens,
        token hashes, and private keys are never configuration fields.
      required: [revision, device_id, org_id, address, gateway_endpoint, gateway_public_key, allowed_ips, dns, persistent_keepalive, wireguard_current_revision]
      additionalProperties: false
      properties:
        revision: { type: integer, format: int64, minimum: 1 }
        device_id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        address: { type: string, description: The managed agent tunnel address/prefix. }
        gateway_endpoint: { type: string, description: The gateway endpoint in host:port form. }
        gateway_public_key: { type: string, description: The gateway WireGuard public key. }
        allowed_ips:
          type: array
          items: { type: string }
        dns:
          type: array
          items: { type: string }
        persistent_keepalive: { type: integer, minimum: 0, maximum: 65535 }
        credential_rotation_revision:
          type: integer
          format: int64
          minimum: 2
          nullable: true
          description: Non-secret requested successor revision; omitted when no request is pending.
        wireguard_current_revision:
          type: integer
          format: int64
          minimum: 1
          description: Last handshake-committed WireGuard key revision.
        wireguard_rotation_revision:
          type: integer
          format: int64
          minimum: 2
          nullable: true
          description: Requested locally generated WireGuard successor revision.
        wireguard_rotation_state:
          type: string
          enum: [requested, prepared, staged]
          nullable: true
          description: Non-secret stage reached by the candidate on the assigned gateway.

    AgentCredentialCandidate:
      type: object
      required: [revision, token_hash]
      additionalProperties: false
      properties:
        revision: { type: integer, format: int64, minimum: 2 }
        token_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Lowercase hexadecimal SHA-256 of a bearer generated only on the agent host.

    AgentWireGuardCandidate:
      type: object
      required: [revision, public_key]
      additionalProperties: false
      properties:
        revision: { type: integer, format: int64, minimum: 2 }
        public_key:
          type: string
          pattern: "^[A-Za-z0-9+/]{43}=$"
          description: Public half of a WireGuard key generated only on the agent host.

    AgentCredentialRotationStatus:
      type: object
      required: [device_id, current_revision, state, wireguard_current_revision, wireguard_state]
      additionalProperties: false
      properties:
        device_id: { type: string, format: uuid }
        current_revision: { type: integer, format: int64, minimum: 1 }
        state: { type: string, enum: [current, requested, candidate] }
        requested_revision: { type: integer, format: int64, minimum: 2, nullable: true }
        deadline: { type: string, format: date-time, nullable: true }
        wireguard_current_revision: { type: integer, format: int64, minimum: 1 }
        wireguard_state: { type: string, enum: [current, requested, prepared, staged] }
        wireguard_requested_revision: { type: integer, format: int64, minimum: 2, nullable: true }

    AgentRuntimeSetting:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: Explicit organization opt-in for F04 managed runtime synchronization.

    AgentRuntimeReport:
      type: object
      description: Bounded, secret-free facts reported by one managed agent runtime.
      required: [applied_revision, attempted_revision, client_version, error_code]
      additionalProperties: false
      properties:
        applied_revision: { type: integer, format: int64, minimum: 0 }
        attempted_revision: { type: integer, format: int64, minimum: 0 }
        client_version: { type: string, minLength: 1, maxLength: 128 }
        error_code:
          type: string
          enum: ["", invalid_config, apply_failed]
          description: Empty means no error; otherwise a bounded stable code, never raw runtime output.

    AgentRuntimeStatus:
      type: object
      description: Secret-free organization/admin projection of one managed agent runtime.
      required: [device_id, desired_revision, applied_revision, last_attempted_revision, client_version, connectivity, health, stale]
      additionalProperties: false
      properties:
        device_id: { type: string, format: uuid }
        desired_revision: { type: integer, format: int64, minimum: 1 }
        applied_revision: { type: integer, format: int64, minimum: 0 }
        last_attempted_revision: { type: integer, format: int64, minimum: 0 }
        client_version: { type: string, maxLength: 128 }
        connectivity:
          type: string
          enum: [unknown, connected, disconnected]
          description: Server-derived connectivity fact; unknown means the control plane cannot establish it.
        health:
          type: string
          enum: [ready, last_good, inconclusive]
          description: >-
            ready means a fresh report applied the current desired revision without a bounded error;
            last_good means a prior applied revision is retained while freshness, revision, or apply state
            is not current; inconclusive means no applied configuration is established.
        stale:
          type: boolean
          description: Whether the last runtime report is absent or outside the server's three-minute freshness window.
        last_seen_at: { type: string, format: date-time, nullable: true }
        last_error_code:
          type: string
          nullable: true
          enum: [invalid_config, apply_failed]
          description: Last bounded stable runtime error, never raw runtime output.
        last_error_revision: { type: integer, format: int64, minimum: 1, nullable: true }

    AgentAccessCheck:
      type: object
      required: [status, code, message]
      additionalProperties: false
      properties:
        status: { type: string, enum: [pass, fail, inconclusive] }
        code: { type: string, minLength: 1, maxLength: 64 }
        message: { type: string, minLength: 1, maxLength: 256 }
        facts:
          type: object
          additionalProperties: { type: string }

    AgentAccessDiagnostic:
      type: object
      required: [device_id, destination, protocol, port, overall, checks]
      additionalProperties: false
      properties:
        device_id: { type: string, format: uuid }
        destination: { type: string }
        protocol: { type: string, enum: [tcp, udp] }
        port: { type: integer, minimum: 1, maximum: 65535 }
        overall: { type: string, enum: [allowed, denied, inconclusive] }
        first_blocker: { type: string, nullable: true }
        checks:
          type: array
          minItems: 7
          maxItems: 7
          items: { $ref: "#/components/schemas/AgentAccessCheck" }

    AgentBootstrapTokenRequest:
      type: object
      required: [name, gateway_id]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        gateway_id: { type: string, format: uuid }

    AgentBootstrapTokenResponse:
      type: object
      required: [bootstrap_token, release]
      additionalProperties: false
      properties:
        bootstrap_token: { type: string, description: Shown once and stored only as a hash. }
        release: { $ref: "#/components/schemas/AgentBootstrapRelease" }

    AgentBootstrapRelease:
      type: object
      description: Server-verified immutable runtime release metadata. Contains no secret or signing private key.
      required: [tag, source_sha, manifest_url, verifier_key_id, runtime]
      additionalProperties: false
      properties:
        tag: { type: string, minLength: 1, maxLength: 128, description: Immutable v* or tunnex-build-* release tag. }
        source_sha: { type: string, pattern: '^[0-9a-f]{40}$', description: Full source commit SHA bound by the signed descriptor. }
        manifest_url: { type: string, format: uri, description: Immutable release.json URL for the exact tag. }
        verifier_key_id: { type: string, minLength: 1, maxLength: 128, description: Public verifier key identifier only; no key material. }
        runtime: { $ref: "#/components/schemas/AgentBootstrapRuntimeRelease" }

    AgentBootstrapRuntimeRelease:
      type: object
      required: [binary, version, linux_amd64, linux_arm64, unit]
      additionalProperties: false
      properties:
        binary: { type: string, enum: [tunnex-agent-runtime] }
        version: { type: string, minLength: 1, maxLength: 128 }
        linux_amd64: { $ref: "#/components/schemas/AgentBootstrapRuntimeAsset" }
        linux_arm64: { $ref: "#/components/schemas/AgentBootstrapRuntimeAsset" }
        unit: { $ref: "#/components/schemas/AgentBootstrapRuntimeAsset" }

    AgentBootstrapRuntimeAsset:
      type: object
      required: [name, sha256, source_sha]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 256 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        source_sha: { type: string, pattern: '^[0-9a-f]{40}$' }

    AgentBootstrapRequest:
      type: object
      required: [bootstrap_token, public_key]
      additionalProperties: false
      properties:
        bootstrap_token: { type: string }
        public_key: { type: string, description: Client-generated WireGuard public key. }

    AgentBootstrapResponse:
      type: object
      required: [device, config, runtime_credential]
      additionalProperties: false
      properties:
        device: { $ref: "#/components/schemas/Device" }
        config: { type: string, description: WireGuard config template with a client-private-key placeholder. }
        runtime_credential: { type: string, description: Shown once, stored only as a hash, and scoped to this agent device. }

    UpdateAgentProfileRequest:
      type: object
      additionalProperties: false
      properties:
        environment: { type: string, maxLength: 100 }
        runtime: { type: string, maxLength: 100 }
        labels:
          type: object
          maxProperties: 32
          additionalProperties: { type: string, maxLength: 100 }
        status: { type: string, enum: [active, suspended] }
        owner_id: { type: string, format: uuid }
        managing_group_update: { $ref: "#/components/schemas/AgentManagingGroupUpdate" }

    AgentManagingGroupUpdate:
      type: object
      required: [group_id]
      additionalProperties: false
      properties:
        group_id: { type: string, format: uuid, nullable: true }

    UpdateDeviceModeRequest:
      type: object
      required: [full_tunnel]
      additionalProperties: false
      properties:
        full_tunnel: { type: boolean, description: "true for full-tunnel egress; false for split-tunnel" }

    UpdateDeviceModeResponse:
      type: object
      x-go-name: UpdateDeviceModeResult
      required: [device, config]
      additionalProperties: false
      properties:
        device: { $ref: "#/components/schemas/Device" }
        config:
          type: object
          required: [address, endpoint, peer_public_key, allowed_ips]
          additionalProperties: false
          properties:
            address: { type: string }
            addresses: { type: array, items: { type: string } }
            endpoint: { type: string }
            peer_public_key: { type: string }
            allowed_ips: { type: array, items: { type: string } }
            dns: { type: array, items: { type: string } }
            mtu: { type: integer }
            persistent_keepalive: { type: integer }

    OVPNSetting:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: { type: boolean, description: "S9.1 D-S9.5-OPTIN: whether the org has opted into OpenVPN." }

    ExportOVPNProfileRequest:
      type: object
      required: [name, node_id]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        node_id: { type: string, format: uuid }
        # Admins may mint on behalf of another org member; omit for self.
        user_id: { type: string, format: uuid }
        # WF-OVPN-3: full-tunnel (route all client traffic) — parity with the WireGuard device form. Default
        # split. Inherits the gateway_no_egress refusal (a gateway that can't source-NAT refuses full-tunnel).
        full_tunnel: { type: boolean }

    ExportOVPNProfileResponse:
      type: object
      x-go-name: ExportOVPNProfileResult
      required: [device, profile, fingerprint]
      additionalProperties: false
      properties:
        device: { $ref: "#/components/schemas/Device" }
        # The one-time .ovpn profile (carries the client private key). Shown ONCE, never
        # re-fetchable — a lost profile is recovered by revoke + re-issue, never re-download.
        profile: { type: string }
        # The cert-serial fingerprint recorded in the audit row — the profile's keyed
        # identity, NEVER the material.
        fingerprint: { type: string }

    CreateDeviceResponse:
      type: object
      x-go-name: CreateDeviceResult
      required: [device]
      additionalProperties: false
      properties:
        device: { $ref: "#/components/schemas/Device" }
        # Present ONLY for the server-generated flow; shown once, never stored.
        private_key: { type: string }
        # The ready-to-use wg-quick .conf (server-generated flow only), shown once.
        config: { type: string }
        # S7.3: true when the org requires device approval — the device is enrolled but
        # BLOCKED (no tunnel) until an admin approves. The client shows a stable
        # "awaiting approval" state (never an error loop).
        pending_approval: { type: boolean }

    DeviceApproval:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [off, on]
          description: "S7.3 device posture. off = devices enroll active (default); on = new devices enroll PENDING until an admin approves."
        grandfathered_count:
          type: integer
          description: >
            On ENABLING (PUT off->on only), the count of existing active devices that stay
            active (grandfathered — a flip must not black-hole the fleet). Best-effort;
            absent when disabling.

    HealthCheck:
      type: object
      required: [kind, mode]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [os_version, disk_encryption]
          description: "S7.5.3 posture check kind (v1: os_version, disk_encryption; EDR is S7.5.3b)."
        mode:
          type: string
          enum: [warn, require]
          description: >
            warn = surface + audit only, never gates. require = a fresh non-compliant
            report excludes the device from every gateway within seconds.
        param:
          type: object
          nullable: true
          description: >
            Check parameters. os_version: {"min":{"macos":"14.0","windows":"10.0"}} —
            a platform absent from "min" is not enforced. disk_encryption: none.
        would_fail_count:
          type: integer
          description: >
            On PUT only: how many devices' LAST report would fail this check
            (best-effort blast radius). The config write itself blocks nothing —
            a device's gate only ever flips on its own next report (D4 grandfather).

    HealthCheckInput:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [warn, require] }
        param: { type: object, nullable: true }

    DeviceHealthReport:
      type: object
      required: [platform, os_version]
      additionalProperties: false
      description: >
        Client-reported posture facts (S7.5.3). NOT attestation — a compromised
        device can misreport; posture checks deter honest non-compliance and give
        an audit trail (defense-in-depth, not a guarantee).
      properties:
        platform: { type: string, enum: [macos, windows, linux, other] }
        os_version: { type: string, maxLength: 100 }
        # Omit when the client could NOT determine the fact (e.g. the FileVault
        # query failed): reported ABSENT, never guessed. An absent fact never
        # blocks (taxonomy class 2) — the check is skipped, surfaced as unknown.
        disk_encrypted: { type: boolean }
        # Client-claimed collection time (informational); the server clock decides staleness.
        collected_at: { type: string, format: date-time }

    DeviceHealthResult:
      type: object
      required: [state, blocked, failed_checks]
      additionalProperties: false
      properties:
        state: { type: string, enum: [compliant, noncompliant] }
        # True while a require-mode check fails: the device is excluded from desired
        # state (tunnel drops within seconds) until a later compliant report.
        blocked: { type: boolean }
        failed_checks:
          type: array
          items:
            type: object
            required: [kind, mode]
            additionalProperties: false
            properties:
              kind: { type: string, enum: [os_version, disk_encryption] }
              mode: { type: string, enum: [warn, require] }

    InviteRequest:
      type: object
      required: [email, role]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 320 }
        role: { type: string, enum: [owner, admin, member] }

    Member:
      type: object
      required: [user_id, email, name, role, status, email_verified, joined_at]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [owner, admin, member] }
        # Account status — a deactivated member stays on the roster (S2.6).
        status: { type: string, enum: [active, deactivated] }
        email_verified: { type: boolean }
        joined_at: { type: string, format: date-time }
        machine_credentials:
          type: integer
          description: >-
            Live machine credentials this person OWNS, across every organization. Deactivating them stops
            every one of these immediately (D23) — the roster carries the number so the confirmation can
            say what the act will break, rather than an operator finding out from a broken pipeline.
        managed_agent_delegations:
          type: integer
          description: >-
            Current managed agents this person can manage through team membership, across every organization.
            Deactivation withdraws that authority immediately without clearing the team's assignment.

    ChangeRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { type: string, enum: [owner, admin, member] }

    OrgDeletionPreflight:
      type: object
      additionalProperties: false
      required: [deletable, gateways, devices, sites, clusters, machine_credentials, blockers]
      properties:
        deletable:
          type: boolean
          description: True only when every count below is zero.
        gateways: { type: integer }
        devices: { type: integer }
        sites: { type: integer }
        clusters: { type: integer }
        machine_credentials: { type: integer }
        blockers:
          type: array
          description: >-
            Every blocker, already worded and pluralised for a human ("2 gateways", "1 site"). Served as
            text so the screen and the refusal message cannot drift into describing the same state
            differently.
          items: { type: string }

    CpAdminRequest:
      type: object
      required: [granted]
      additionalProperties: false
      properties:
        granted: { type: boolean }

    EmailRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 320 }

    AcceptInviteRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, minLength: 1, maxLength: 200 }
        name: { type: string, maxLength: 200 }
        password: { type: string, minLength: 12, maxLength: 200 }

    SsoConfigRequest:
      type: object
      required: [client_id, client_secret, enabled]
      additionalProperties: false
      properties:
        client_id: { type: string, minLength: 1, maxLength: 500 }
        client_secret: { type: string, minLength: 1, maxLength: 500 }
        tenant_id:
          type: string
          maxLength: 200
          description: Required for Microsoft (the org's Entra tenant ID); unused by Google.
        enabled: { type: boolean }

    # Read projection of an SSO config. WRITE-ONLY SECRET: there is deliberately
    # NO client_secret field here — the secret is never returned. secret_fingerprint
    # is a keyed HMAC (safe to expose) that proves which secret is stored.
    SsoConfigView:
      type: object
      required: [provider, client_id, enabled, secret_fingerprint, updated_at]
      additionalProperties: false
      properties:
        provider: { type: string, enum: [google, microsoft] }
        client_id: { type: string }
        tenant_id: { type: string }
        enabled: { type: boolean }
        secret_fingerprint: { type: string }
        updated_at: { type: string, format: date-time }

    AuthUser:
      type: object
      required: [id, email, email_verified]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        email_verified: { type: boolean }
        # S7.5.5: true when the org enforces MFA and the user has no confirmed TOTP — the session is
        # gated to enrollment (D8). The client routes to the enrollment ceremony.
        mfa_enrollment_required: { type: boolean }
        # ⛔ DEPLOYMENT-SCOPED, and the only such field on this object. Everything else about authority is
        # org-keyed (`Principal.Roles` is orgID→role), because "may this person create AN ORGANIZATION"
        # is a question about the DEPLOYMENT — a permission granted inside org A cannot license an act
        # that creates org B. ⚠ The UI uses it ONLY to decide whether to offer the affordance; the server
        # refuses regardless, so a client that ignores this field gains nothing.
        # ⛔ THE DEPLOYMENT-LEVEL AXIS, and the only field on this object that is not org-scoped.
        # `cp_admin` implies creating organizations and granting roles in ANY org — it absorbed
        # `can_create_orgs` rather than sitting beside it, because two booleans that must agree drift.
        cp_admin: { type: boolean }
        # ⛔ The one-time bootstrap credential was printed to the logs, so it is compromised the moment it
        # works. The server refuses everything until it is changed; this field is what lets the CLIENT route
        # there instead of showing a red error on whatever page the user happened to land on.
        must_change_password: { type: boolean }
        # S7.5.5 D11: the user's UNUSED recovery-code count — CARDINALITY ONLY, never the codes
        # (nothing recoverable). Drives the low-remaining (<=3) + last-code warnings; returned on
        # /auth/me and on mfa/verify (the verify moment is exactly when a just-burned code matters).
        recovery_codes_remaining: { type: integer }

    LoginResult:
      type: object
      required: [mfa_required]
      additionalProperties: false
      properties:
        mfa_required: { type: boolean, description: "true = complete the second step at /auth/mfa/verify (no session set)." }
        user: { $ref: "#/components/schemas/AuthUser" }
        challenge: { type: string, description: "Login MFA challenge token (present iff mfa_required)." }
        challenge_expires_in: { type: integer, description: "Challenge TTL in seconds." }
        enrollment_required: { type: boolean, description: "S7.5.5: session minted but gated — the org enforces MFA and the user must enroll before proceeding (D8)." }

    MfaEnforce:
      type: object
      required: [enforce]
      additionalProperties: false
      properties:
        enforce: { type: boolean }

    MfaEnrollResult:
      type: object
      required: [otpauth_uri, secret]
      additionalProperties: false
      properties:
        otpauth_uri: { type: string, description: "otpauth:// URI for the QR code." }
        secret: { type: string, description: "Base32 manual-entry key (shown once)." }

    MfaCodeRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string, minLength: 1, maxLength: 20 }

    MfaVerifyRequest:
      type: object
      required: [challenge, code]
      additionalProperties: false
      properties:
        challenge: { type: string, minLength: 1, maxLength: 200 }
        code: { type: string, minLength: 1, maxLength: 20 }

    MfaRecoveryCodes:
      type: object
      required: [recovery_codes]
      additionalProperties: false
      properties:
        recovery_codes: { type: array, items: { type: string }, description: "Single-use recovery codes, shown ONCE." }

    ActivityEntry:
      type: object
      required: [action, created_at]
      additionalProperties: false
      properties:
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        actor_id: { type: string, format: uuid }
        # ⛔ THE NAMED SYSTEM ACTOR, ADDED S14.16. This schema carried `actor_id` and NOT
        # `actor_system`, so every machine-initiated event on the Overview feed arrived
        # indistinguishable from an event nobody recorded — the same vocabulary collision the Audit
        # Log screen was just fixed for, one endpoint over. The column has existed since S7.5.2 and
        # system services populate it (`idp-sync`, `device-health`).
        actor_system: { type: string }
        created_at: { type: string, format: date-time }

    # A single audit event for the viewer. `id` + `created_at` form the keyset
    # cursor. `details` is the event metadata (secret-free by construction — the
    # write side never puts secret material in it).
    AuditLogEntry:
      type: object
      required: [id, action, created_at, details]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        actor_id: { type: string, format: uuid }
        # actor_system NAMES a non-human initiator (e.g. "idp-sync") when actor_id is absent —
        # a first-class, legible actor for compliance attribution (S7.5.2).
        actor_system: { type: string }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        details: { type: object, additionalProperties: true }

    AccessEvent:
      type: object
      required: [id, created_at, seq, occurred_at, decision, src_ip, dst_ip, protocol]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        # created_at (ingest time) + id are the KEYSET CURSOR — pass the last entry's pair
        # as cursor_ts + cursor_id for the next page.
        created_at: { type: string, format: date-time }
        seq: { type: integer, format: int64, description: Per-org monotonic sequence (tamper-evidence / gap detection). }
        occurred_at: { type: string, format: date-time, description: Agent-clock flow observation time (NOT the pagination clock). }
        decision: { type: string, enum: [allow, deny, deny_aggregate, terminated, gap] }
        # Attribution is stamped from the successfully applied gateway artifact and
        # verified against the org-scoped device row; never inferred from src_ip.
        rule_id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        src_agent_id: { type: string, format: uuid, description: Present only when the verified source device kind is agent. }
        src_ip: { type: string }
        dst_ip: { type: string }
        dst_resource_id: { type: string, format: uuid }
        dst_group_id: { type: string, format: uuid }
        protocol: { type: string }
        dst_port: { type: integer }
        deny_count: { type: integer, description: ">1 for a per-source deny aggregate (port-scan collapse); N for a gap marker." }
        window_end: { type: string, format: date-time, description: deny_aggregate window end. }
        policy_hash: { type: string, pattern: '^[0-9a-f]{12}$', description: Canonical hash of the policy successfully applied when the gateway observed the flow. }
        policy_version: { type: integer, minimum: 1 }
        src_config_revision: { type: integer, format: int64, minimum: 0, description: Applied managed-agent configuration revision at observation time. }
        decision_reason: { type: string, enum: [matched_grant, no_matching_grant, grant_revoked, events_dropped] }

    AccessLogHealth:
      type: object
      required: [retention_dropped, retention_failed]
      additionalProperties: false
      properties:
        retention_last_sweep: { type: string, format: date-time }
        retention_dropped: { type: integer, format: int64, description: Rows deleted by the last retention sweep (age + cap). }
        retention_failed: { type: boolean, description: The last retention sweep errored (partial/failed) — the PG hot-window may be growing. }

    OrgOverview:
      type: object
      required: [members, devices, nodes, online, recent_activity]
      additionalProperties: false
      properties:
        members: { type: integer }
        devices: { type: integer }
        nodes: { type: integer }
        # Devices whose last handshake is within the recency window (S3.6 approx).
        online: { type: integer }
        recent_activity:
          type: array
          items: { $ref: "#/components/schemas/ActivityEntry" }

    Meta:
      type: object
      required: [edition, sso_providers, protocol_version]
      additionalProperties: false
      properties:
        edition: { type: string, enum: [open, enterprise] }
        smtp_configured:
          type: boolean
          description: >-
            Whether this deployment can send email at all. ⛔ False means invitations, password resets and
            email verification cannot be delivered — and invitations are the only way anyone joins. The
            screens that send mail say so BEFORE the operator acts, rather than after a recipient does not
            receive something.
        public_base_url:
          type: string
          description: >-
            S8.2c: the control plane's own CONFIGURED public base URL (APP_BASE_URL / install.sh's public
            address) — the AUTHORITATIVE answer to "where do gateways reach me", independent of how an admin
            happened to open the dashboard (a tunnel/alias/bare IP would bake the wrong URL into the emitted
            gateway install command). The gateway-enroll command derives TUNNEX_API_URL/TUNNEX_AGENT_URL from
            this, never from window.location. Empty when unset (the SPA then falls back to its own origin).
        gateway_control_url:
          type: string
          description: >-
            Deployment-wide raw mTLS endpoint for new gateway join commands. Empty means the command
            derives port 8443 from public_base_url for backward compatibility.
        node_agent_image:
          type: string
          description: >-
            S8.2c WF-2: the gateway agent image the emitted enroll command uses (TUNNEX_NODE_AGENT_IMAGE).
            One-truth applied to the artifact version — pin it to a DIGEST and the stale-`:latest` drift that
            mis-convicted D2 becomes structurally impossible. The SPA falls back to its own default ref when unset.
        protocol_version:
          type: integer
          description: >-
            S8.3 (CW): the control plane's current compiled-artifact version CEILING (policyspec.ProtocolVersion).
            The cross-site upgrade warning names gateways whose reported max is below this — server-sourced so
            the UI never hardcodes the ceiling (it bumps with each protocol change; a hardcoded copy would
            silently fork on the next bump).
        # SSO providers this deployment can offer (empty in the open edition, so
        # the SPA hides SSO entirely rather than showing buttons that error).
        # ⛔ THE DEPLOYMENT QUESTION, ANSWERED UNAUTHENTICATED. The login page reads /meta before anyone has
        # signed in, and it needs to know whether this deployment is already set up — to hide "Create an
        # account", and to stop routing a brand-new user to a create-org form they may not use.
        #
        # ⚠ A HINT, NEVER THE BOUNDARY: auth.Signup and tenancy.checkMayCreateOrg both refuse on the server
        # regardless. Hiding a link is not closing a door, and a refused endpoint behind a visible link is a
        # dead end — so both halves exist and neither is load-bearing alone.
        setup_complete: { type: boolean }
        sso_providers:
          type: array
          items: { type: string, enum: [google, microsoft] }
        upgrade:
          $ref: "#/components/schemas/UpgradeStatus"

    UpgradeStatus:
      type: object
      additionalProperties: false
      required: [available, verified, current_version, current_source_sha, reason]
      properties:
        available: { type: boolean }
        verified: { type: boolean }
        current_version: { type: string }
        current_source_sha: { type: string }
        version: { type: string }
        source_sha: { type: string }
        sequence: { type: integer, format: int64 }
        compatibility: { type: string }
        downtime: { type: string }
        release_notes_url: { type: string, format: uri }
        reason: { type: string }
        state: { type: string, enum: [available, requested, applying, healthy, failed] }
        preflight_state: { type: string, enum: [unknown, required, passed, failed] }
        backup_state: { type: string, enum: [unknown, required, verified, failed] }
        rollback_state: { type: string, enum: [not_needed, restore_from_backup, available, in_progress, failed] }
        approval_mode: { type: string, enum: [host_command_only, host_updater] }

    SignupRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 12, maxLength: 200 }
        name: { type: string, maxLength: 200 }

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, maxLength: 200 }

    TokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, minLength: 1, maxLength: 200 }

    PasswordResetRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 320 }

    PasswordResetConfirmRequest:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token: { type: string, minLength: 1, maxLength: 200 }
        password: { type: string, minLength: 12, maxLength: 200 }

    Error:
      type: object
      description: |
        Standard error envelope for every non-2xx response. Chosen over bare
        RFC 7807 so the correlation `request_id` is a first-class field the SPA
        and CLI can surface directly; `code` is stable for programmatic handling.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Stable, machine-readable error code.
              example: not_found
            message:
              type: string
              description: Human-readable explanation.
            request_id:
              type: string
              description: Correlation ID; match against server logs.
            details:
              type: array
              description: Field-level problems (e.g. validation failures).
              items:
                $ref: "#/components/schemas/ErrorDetail"

    ErrorDetail:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        field:
          type: string
          description: Dotted path to the offending field, when applicable.
        message:
          type: string
          description: What is wrong with this field.

  responses:
    Error:
      description: Error response.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RuntimeUnauthorized:
      description: >-
        Uniform machine-channel authentication refusal. The response must not reveal whether the bearer,
        organization, device, agent kind, or revocation state exists.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
