      responses:
        "204":
          description: Deleted.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: extendGrant
      summary: Extend a temporary grant's expiry window in place (enterprise)
      description: >
        S7.5.4: moves a temporary grant's expires_at forward (window-extensible, never
        delete+recreate). Refuses a permanent grant (409 not_temporary) or an
        already-lapsed one (409 grant_lapsed) — a lapsed grant is terminal.
      tags: [policy]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtendGrantRequest" }
      responses:
        "200":
          description: The grant with its new window.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyRule" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: setPolicyRuleEnabled
      summary: Enable or disable an allow-rule without deleting it (enterprise, F3)
      description: >
        F3: toggle a rule's enabled state. Disabling WITHDRAWS the rule's permission under
        default-deny ("as if the rule weren't there" — NOT a deny-rule, not active blocking); it
        is a real, in-hash policy change that recompiles + pushes (traffic matching the rule stops
        within a push cycle). Re-enabling restores the grant. Audited as two distinct actions
        (policy.rule_enabled / policy.rule_disabled). No RequiredVersion bump.
      tags: [policy]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetPolicyRuleEnabledRequest" }
      responses:
        "200":
          description: The rule with its new enabled state.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyRule" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/zero-trust-mode:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getZeroTrustMode
      summary: Get the org enforcement mode (enterprise)
      tags: [policy]
      responses:
        "200":
          description: Current mode.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZeroTrustMode" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: setZeroTrustMode
      summary: Set the org enforcement mode — enabling turns on default-deny (enterprise)
      tags: [policy]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZeroTrustMode" }
      responses:
        "200":
          description: Updated mode.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZeroTrustMode" }
        default: { $ref: "#/components/responses/Error" }

  # ⛔ DEPLOYMENT-SCOPED, AND THE ORG-SCOPED URL IT REPLACED WAS AN ERROR — recorded plainly so the next
  # reader does not mistake it for a deliberate design and reason from it.
  #
  # It was `/api/v1/organizations/{orgId}/license`. The org in that path was never passed to the licence
  # manager: it was used for authorization and the audit row, and nothing else. The handler's own comment
  # already said "installing a licence changes what the whole deployment may do".
  #
  # ⛔ AND PER-ORG WAS NEVER AVAILABLE, WHICH IS WHY THIS IS AN ERROR RATHER THAN A PREFERENCE. The data
  # cannot hold it: `CountOrganizations` — the query behind the org ceiling — is
  # `SELECT count(*) FROM organizations`, deployment-wide by definition, because "how many organizations
  # exist" cannot be scoped to an organization. The key agrees: it carries an eTLD+1 DOMAIN and no
  # organization identifier at all. The URL implied a shape the data cannot hold.
  /api/v1/license:
    get:
      operationId: getLicense
      summary: What this deployment is entitled to
      description: >-
        The current entitlement, whether or not a licence key is installed. An absent licence is
        COMMUNITY — not an error — so this always answers.
      tags: [license]
      responses:
        "200":
          description: Current entitlement.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LicenseStatus" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: installLicense
      summary: Install a licence key — takes effect immediately, no restart
      description: >-
        Verifies the key offline against the public key set compiled into this build and installs it.
        A key that does not verify is REFUSED and the existing entitlement is left untouched.
      tags: [license]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstallLicenseRequest" }
      responses:
        "200":
          description: Installed. The response is the new entitlement.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LicenseStatus" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation
      tags: [invitations]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInviteRequest" }
      responses:
        "200":
          description: Accepted; the account is a member.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericMessage" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/invitations:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listInvitations
      summary: List the organization's invitations
      description: |
        Returns every invitation row for the org, newest first, with its lifecycle timestamps.
        Gated on `member:invite` — the same permission as the three verbs it exists to serve.
        Reading which addresses are outstanding is only actionable to someone who can resend or
        revoke them, so this deliberately reuses that permission rather than minting a read-only
        one whose grant table would have to answer "who may see who was invited, but do nothing".
        The secret token is NEVER returned: it is shown once, by `createInvitation`.
      tags: [invitations]
      responses:
        "200":
          description: Invitations, newest first.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invitation" }
        default: { $ref: "#/components/responses/Error" }
    post:
