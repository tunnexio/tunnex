  # Per-check org opt-in (default OFF); the desktop client self-reports facts.
  # CLIENT-REPORTED, NOT ATTESTED: deters honest non-compliance and gives an audit
  # trail; a compromised device can misreport. Edition-gated: the open build
  # returns 403 edition_required. Config RBAC: device_health:manage; the report
  # endpoint is device-OWNER-authed (self-report).
