  /api/v1/organizations/{orgId}/audit-logs:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listAuditLogs
      summary: The org's audit log — filterable, keyset-paginated (read-only)
      tags: [organizations]
      parameters:
        - { name: actor, in: query, required: false, schema: { type: string, format: uuid }, description: Filter by acting user (must be an org member). }
        - { name: action, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time }, description: created_at >= this. }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time }, description: created_at <= this. }
        # Keyset cursor: pass the last entry's created_at + id to fetch the next page.
        - { name: cursor_ts, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: cursor_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: A page of audit entries, newest first. Fewer than `limit` means the last page.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditLogEntry" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/access-events:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listAccessEvents
      summary: The org's Zero Trust access/flow events — keyset-paginated (enterprise, read-only)
      tags: [organizations]
      parameters:
        - { name: denies_only, in: query, required: false, schema: { type: boolean, default: false }, description: Only deny/deny_aggregate/terminated events (the security feed). }
        - { name: src_agent_id, in: query, required: false, schema: { type: string, format: uuid }, description: Only events attributed by the applied gateway artifact to this verified agent device. }
        # Keyset cursor: pass the last entry's created_at + id to fetch the next page.
        - { name: cursor_ts, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: cursor_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        "200":
          description: A page of access events, newest first. Fewer than `limit` means the last page. Open build → 403 edition_required.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AccessEvent" } }
        default: { $ref: "#/components/responses/Error" }

  # NOTE (S7.5.1b): GET /access-events/export (verbatim JSONL source-of-truth stream) is DEFERRED
