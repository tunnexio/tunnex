openapi: 3.0.3
info:
  title: Tunnex API
  version: 0.1.0
  description: |
    Control-plane API for Tunnex.io. This spec is the single source of truth:
    the Go server types/handlers and the TypeScript client are generated from it
    (`make generate`), and drift fails the build (`make generate-check`).
servers:
  - url: /
    description: Same-origin (served behind the edge nginx)

# Endpoints require a session cookie OR a CLI bearer credential by default
# (bearer ≡ cookie, S5.1); public ones set `security: []`; cookie-only ops
# (credential minting) override with `security: [{cookieAuth: []}]` + argument.
security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe
      description: Reports process liveness. No external dependencies are checked.
      tags: [system]
      security: []
      responses:
        "200":
          description: The service is alive.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/signup:
    post:
      operationId: signup
      summary: Create a local account (sends a verification email)
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "202":
          description: Accepted. Returns the same generic result whether or not the email was already registered.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericMessage" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/login:
    post:
      operationId: login
      summary: Verify credentials
      description: "S2.1 verifies credentials; S2.2 establishes the session cookie."
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: >
            Credentials valid. If MFA is required (self-enrolled or org-enforced), NO session cookie is
            set and `mfa_required=true` with a challenge; the client completes at /auth/mfa/verify.
            Otherwise the session cookie is set and `user` is returned.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/mfa/enroll:
    post:
      operationId: mfaEnrollStart
      summary: Start TOTP enrollment (OPEN — all editions)
      description: "S7.5.5. Returns the otpauth:// URI (QR) + base32 manual key ONCE. Verify-before-arm: the secret is unconfirmed until a valid code is submitted to /mfa/enroll/confirm."
      tags: [auth]
      responses:
        "200":
          description: Enrollment started.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaEnrollResult" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/mfa/enroll/confirm:
    post:
      operationId: mfaEnrollConfirm
      summary: Confirm TOTP enrollment with a code (OPEN)
      description: "S7.5.5. A valid code arms MFA and returns single-use recovery codes ONCE."
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaCodeRequest" }
      responses:
        "200":
          description: MFA enrolled; recovery codes shown once.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaRecoveryCodes" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/mfa:
    delete:
      operationId: mfaDisenroll
      summary: Disenroll the current user's MFA (OPEN)
      tags: [auth]
      responses:
        "204": { description: MFA removed. }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/mfa/verify:
    post:
      operationId: mfaVerify
      summary: Complete a login MFA challenge (public — challenge-token bound)
      description: "S7.5.5. Exchanges a login challenge + a TOTP or recovery code for a session cookie. The pending state is a challenge token, never a session (D6)."
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaVerifyRequest" }
      responses:
        "200":
          description: MFA passed; session established.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/mfa-enforce:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getMfaEnforce
      summary: Get org MFA enforcement (enterprise)
      tags: [auth]
      responses:
        "200":
          description: Enforcement state.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaEnforce" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: setMfaEnforce
      summary: Set org MFA enforcement (enterprise; unlock-then-opt-in, default OFF)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaEnforce" }
      responses:
        "200":
          description: Updated.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaEnforce" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/members/{userId}/mfa-reset:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: adminResetMfa
      summary: Admin-reset a member's MFA — disenroll only (enterprise)
      description: "S7.5.5. Clears the member's TOTP + recovery codes (never authenticates as them); audited + the member is notified."
      tags: [auth]
      responses:
        "204": { description: MFA reset. }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Verify an email address with a token
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "200":
          description: Verified.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericMessage" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/password-reset:
    post:
      operationId: requestPasswordReset
      summary: Request a password-reset email
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "202":
          description: Accepted. Generic result regardless of whether the email exists.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericMessage" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Set a new password using a reset token
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetConfirmRequest" }
      responses:
        "200":
          description: Password updated.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericMessage" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/meta:
    get:
      operationId: getMeta
      summary: Public deployment metadata (edition, enabled SSO providers)
      description: Lets the SPA gate edition-only UI (e.g. hide SSO in the open build) without a build-time bundle fork.
      tags: [meta]
      security: []
      responses:
        "200":
          description: Deployment metadata.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meta" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/verify-email/resend:
    post:
      operationId: resendVerification
      summary: Resend the current user's email-verification link
      description: Idempotent; a no-op (still 202) if already verified. Requires a session.
      tags: [auth]
      responses:
        "202":
          description: If verification is pending, an email has been sent.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericMessage" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/me:
    get:
      operationId: currentUser
      summary: The current authenticated user
      description: Returns the session's user so the SPA can rehydrate auth on load; 401 if there is no valid session.
      tags: [auth]
      responses:
        "200":
          description: The authenticated user.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/password:
    post:
      operationId: changePassword
      summary: Change your own password
      description: >-
        ⛔ The ONLY way out of a forced password change, and therefore the one authenticated route that is
        NOT blocked by one. The CP admin's bootstrap credential is printed to the logs, so it is treated as
        compromised the moment it works — without this endpoint the forced change would be a lockout.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 12 }
      responses:
        "204":
          description: Changed.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      description: Idempotent — clears the cookie and revokes the session if present.
      tags: [auth]
      security: []
      responses:
        "204":
          description: Logged out.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/sso/{provider}/start:
    get:
      operationId: startSsoLogin
      summary: Begin an SSO login (enterprise)
      tags: [sso]
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, microsoft] }
        - name: org
          in: query
          required: true
          description: Organization slug whose SSO config to use.
          schema: { type: string }
      responses:
        "200":
          description: The IdP redirect URL for the client to navigate to.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SsoRedirect" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/sso/{provider}/callback:
    get:
      operationId: ssoCallback
      summary: SSO callback (enterprise)
      tags: [sso]
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, microsoft] }
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Authenticated — session cookie set, browser redirected to the app.
          headers:
            Location: { schema: { type: string }, required: true }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/sso/{provider}:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: provider
        in: path
        required: true
        schema: { type: string, enum: [google, microsoft] }
    get:
      operationId: getSsoConfig
      summary: Read an SSO provider's config (enterprise) — never returns the secret
      tags: [sso]
      responses:
        "200":
          description: The provider config (no secret material — only a keyed fingerprint).
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SsoConfigView" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: setSsoConfig
      summary: Configure an SSO provider for an organization (enterprise)
      tags: [sso]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SsoConfigRequest" }
      responses:
        "204":
          description: Saved.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
        default: { $ref: "#/components/responses/Error" }

  # ---- CLI credential flow (S5.1) -------------------------------------------
  # `tunnex login` opens the system browser; auth completes IN-BROWSER (local or
  # SSO, MFA and all); the SPA then calls cliAuthorize and redirects the browser
  # to the CLI's loopback callback with a one-time code + state; the CLI
  # exchanges code+PKCE-verifier for a dedicated bearer credential (tnx_...).
  # Device-code fallback for browserless hosts. Codes and credentials are hashed
  # at rest; audit rows carry the keyed fingerprint (proof-of-secret convention).
  /api/v1/auth/cli/authorize:
    post:
      operationId: cliAuthorize
      summary: Mint a one-time CLI authorization code (browser leg)
      description: >
        COOKIE-SESSION ONLY (argued exception to bearer≡cookie): minting a new
        credential from an existing bearer credential would be self-replication —
        a stolen token could outlive its expiry by re-minting. The browser session
        is the human checkpoint. Verified email required. The redirect_uri must be
        a loopback (http://127.0.0.1:<port>/callback or http://[::1]:<port>/callback,
        any port, exactly that path — never a hostname). The code is single-use,
        expires in 60s, and is bound to this exact redirect_uri + PKCE challenge.
      tags: [cli-auth]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CliAuthorizeRequest" }
      responses:
        "200":
          description: One-time code minted; the SPA redirects the browser to the loopback.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CliAuthorizeResponse" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/cli/token:
    post:
      operationId: cliToken
      summary: Exchange a one-time code (+ PKCE verifier) for a CLI credential
      description: >
        Public (the CLI holds no credential yet). The exchange requires the code,
        the PKCE verifier matching the challenge presented at authorize, and the
        EXACT redirect_uri the code was bound to. Any mismatch, reuse, or expiry
        → 400 invalid_grant. The credential is returned EXACTLY ONCE.
      tags: [cli-auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CliTokenRequest" }
      responses:
        "200":
          description: The dedicated CLI credential — shown exactly once, never re-served.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CliTokenResponse" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/cli/credentials:
    get:
      operationId: listCliCredentials
      summary: List the caller's CLI credentials (metadata only — never tokens)
      tags: [cli-auth]
      responses:
        "200":
          description: The caller's credentials (fingerprints, never token material).
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CliCredential" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/cli/credentials/{credentialId}:
    delete:
      operationId: revokeCliCredential
      summary: Revoke one of the caller's CLI credentials (immediate)
      description: >
        Self-scoped (a caller revokes only their own credential). Allowed
        unverified — revoking a credential is logout-class, not org-mutating.
      tags: [cli-auth]
      parameters:
        - name: credentialId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Revoked (idempotent for an already-revoked credential).
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/cli/device:
    post:
      operationId: cliDeviceStart
      summary: Start the device-code fallback (browserless hosts)
      description: >
        Public. Returns a short user_code the user enters at verification_uri
        from any browser, and a device_code the CLI polls with. Same hygiene
        class as authorization codes — hashed at rest, single-use, short TTL.
      tags: [cli-auth]
      security: []
      responses:
        "200":
          description: Device flow started.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CliDeviceStartResponse" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/cli/device/approve:
    post:
      operationId: cliDeviceApprove
      summary: Approve a device-code login (browser leg)
      description: >
        COOKIE-SESSION ONLY (same argued exception as cliAuthorize) + verified
        email required — this is the human checkpoint of the device flow.
      tags: [cli-auth]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CliDeviceApproveRequest" }
      responses:
        "200":
          description: Approved — the polling CLI will receive its credential.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericMessage" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/cli/device/token:
    post:
      operationId: cliDeviceToken
      summary: Poll for the device-flow credential
      description: >
        Public. 400 authorization_pending until approved; expired/consumed codes
        → 400 invalid_grant. On approval the credential is returned EXACTLY ONCE.
      tags: [cli-auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CliDeviceTokenRequest" }
      responses:
        "200":
          description: The dedicated CLI credential — shown exactly once.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CliTokenResponse" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/agent/enroll:
    post:
      operationId: enrollAgent
      summary: Enroll a tunnex-node agent with a join token
      tags: [nodes]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollRequest" }
      responses:
        "200":
          description: Enrolled — returns the signed agent certificate and the CA.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollResponse" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/nodes:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listNodes
      summary: List enrolled nodes
      tags: [nodes]
      responses:
        "200":
          description: Nodes.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Node" } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/agents:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listAgents
      summary: List the org's AI agents (enterprise)
      description: >-
        S15.3 — the agents enrolled in this organization, each with the human who authorised it and whether
        its activity is attributable. ⛔ ENTERPRISE: the open edition receives 403 edition_required, which is
        a SUCCESSFUL REFUSAL — the surface renders ABSENCE, never an error.
        ⛔ This endpoint says which agents EXIST and who owns them. It says nothing about what they may do:
        reachability is set by grants on Access Policies, and per-tool control does not exist in this
        product.
      tags: [agents]
      responses:
        "200":
          description: The agents.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Agent" } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/agents/bootstrap-token:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: issueAgentBootstrapToken
      summary: Issue a single-use managed agent bootstrap token
      tags: [agents]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentBootstrapTokenRequest" }
      responses:
        "201":
          description: The bootstrap token, shown once.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentBootstrapTokenResponse" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/agent/bootstrap:
    post:
      operationId: bootstrapAgent
      summary: Redeem a managed agent bootstrap token
      security: []
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentBootstrapRequest" }
      responses:
        "200":
          description: Bootstrap material. The runtime credential is shown exactly once.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentBootstrapResponse" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/agent/runtime/poll:
    get:
      operationId: pollAgentRuntime
      summary: Poll managed agent configuration
      description: >-
        Machine-only managed-runtime channel. Authenticates with the exact agent runtime bearer and returns
        a configuration only when the desired revision is newer than `applied_revision`; an unchanged
        revision returns 204 with no body. The optional wait is a bounded long poll. Explicit organization
        opt-out is a terminal uniform 401 so the runtime offboards; edition unavailability remains a
        non-terminal 403. No bearer, bootstrap token, private key, token hash, or raw error is ever returned.
      security:
        - runtimeBearer: []
      tags: [agents]
      parameters:
        - name: applied_revision
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
        - name: client_version
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: wait_seconds
          in: query
          required: false
          description: Bounded long-poll wait requested by the runtime; the server may return sooner.
          schema: { type: integer, minimum: 0, maximum: 60, default: 0 }
        - name: wireguard_revision
          in: query
          required: false
          description: Last handshake-committed WireGuard key revision known by the runtime.
          schema: { type: integer, format: int64, minimum: 1, default: 1 }
      responses:
        "200":
          description: Strictly newer managed configuration.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedAgentConfig" }
        "204":
          description: Desired revision is unchanged; no configuration body is returned.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
        "401": { $ref: "#/components/responses/RuntimeUnauthorized" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/agent/runtime/report:
    post:
      operationId: reportAgentRuntime
      summary: Report managed agent runtime state
      description: >-
        Machine-only managed-runtime channel. Reports bounded revision and health facts for the exact agent
        runtime bearer. The server rejects backwards or ahead-of-desired revisions and stores only the stable
        error enum, never raw runtime output. No credential, bootstrap token, private key, token hash, or raw
        error is accepted or returned.
      security:
        - runtimeBearer: []
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentRuntimeReport" }
      responses:
        "204":
          description: Report accepted.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
        "401": { $ref: "#/components/responses/RuntimeUnauthorized" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/agent/runtime/credential-candidate:
    post:
      operationId: prepareAgentRuntimeCredential
      summary: Prepare a locally generated runtime credential successor
      description: >-
        Machine-only endpoint authenticated by the current runtime bearer. It accepts only the requested
        revision and a 32-byte SHA-256 hash; plaintext credentials are never accepted or returned. Repeating
        the same revision and hash is idempotent.
      security:
        - runtimeBearer: []
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentCredentialCandidate" }
      responses:
        "204":
          description: Candidate hash prepared.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
        "401": { $ref: "#/components/responses/RuntimeUnauthorized" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/agent/runtime/wireguard-candidate:
    post:
      operationId: prepareAgentRuntimeWireGuard
      summary: Prepare a locally generated WireGuard public-key successor
      description: >-
        Machine-only endpoint authenticated by the current runtime bearer. It accepts only the requested
        revision and candidate public key. The private key is generated and retained on the agent host.
        Repeating the same revision and public key is idempotent.
      security:
        - runtimeBearer: []
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentWireGuardCandidate" }
      responses:
        "204":
          description: Candidate public key prepared.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
        "401": { $ref: "#/components/responses/RuntimeUnauthorized" }
        default: { $ref: "#/components/responses/Error" }

