    parameters:
      - name: orgId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: setOVPNEnabled
      summary: "Set the org OpenVPN opt-in (S9.1 D-S9.5-OPTIN — unlock-then-opt-in, OFF by default)"
      description: "Flips org-level OpenVPN. Enabling makes the OVPN capability available on the org's gateways; disabling is NOT revocation — issued client certs survive and a re-enable restores service."
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OVPNSetting" }
      responses:
        "200":
          description: Updated OpenVPN opt-in.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OVPNSetting" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/ovpn-profiles:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: exportOVPNProfile
      summary: "Mint an OpenVPN device + return its .ovpn profile ONCE (S9.1 D-S9.5-OPTIN gated)"
      description: "Creates an OpenVPN-transport device (no WireGuard key) and returns a one-time .ovpn profile carrying the client private key. The profile is served exactly once and never re-fetchable; a lost profile is recovered by revoking and re-issuing, never re-downloading. Refuses with opt_in_required when the org has not opted into OpenVPN."
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportOVPNProfileRequest" }
      responses:
        "201":
          description: The created OpenVPN device + its one-time .ovpn profile.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportOVPNProfileResponse" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/devices/{deviceId}/revoke:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: revokeDevice
      summary: Revoke a device (peer removed from the gateway within seconds)
      tags: [devices]
      responses:
        "204":
          description: Revoked.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/devices/{deviceId}/mode:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateDeviceMode
      summary: Change split/full mode without creating a new device
      description: >-
        Preserves the device UUID, owner, gateway, tunnel allocation and WireGuard credential. The response
        contains mutable route/config facts only; it never contains a private key. The caller must already
        possess the device's private key and should replace its local config atomically before reconnecting.
      tags: [devices]
      parameters:
        # Optional in generated transport code so unauthenticated requests reach the
        # authorization gate first; the authenticated handler requires it.
        - name: full_tunnel
          in: query
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: Updated mode and mutable config facts.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateDeviceModeResponse" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/organizations/{orgId}/devices/{deviceId}:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: removeDevice
      summary: Remove a REVOKED device from the roster (soft delete)
      description: >-
        ⛔ SOFT, AND THE CASCADE IS WHY. Every foreign key into `devices` is ON DELETE CASCADE, including
        `ovpn_client_certs` — and the OpenVPN CRL is built from that table. A hard delete would drop the
        device's serial out of the CRL and thereby UN-REVOKE the credential on the wire: a tidy-up that
        silently restores access. It would also destroy the device's posture history, its telemetry and any
        policy rule naming it as an agent source.

        ⚠ REVOKED ONLY. Removing an ACTIVE device would leave a live credential with no surface to revoke it
        from — invisible and still working. A device that is not revoked answers 409.
      tags: [devices]
      responses:
        "204":
          description: Removed from the roster. The revocation record and the CRL entry are untouched.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
        "409":
          description: The device is not revoked. Revoke it first.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        default: { $ref: "#/components/responses/Error" }

  # ── Device posture (S7.3, ENTERPRISE) ───────────────────────────────────────
