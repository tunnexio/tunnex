name: tunnex-app-access-aa0-1003
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aa0
      POSTGRES_PASSWORD: ${AA0_DB_PASSWORD:?run prepare.sh}
      POSTGRES_DB: aa0
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U aa0 -d aa0]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
  api:
    image: alpine:3.23
    command: [/binaries/tunnex-api]
    environment:
      TUNNEX_ENV: development
      DATABASE_URL: postgres://aa0:${AA0_DB_PASSWORD}@postgres:5432/aa0?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      TUNNEX_AUTO_MIGRATE: 'true'
      TUNNEX_SECRETS_DIR: /state
      TUNNEX_ADMIN_EMAIL: admin@app-access.local
      TUNNEX_BOOTSTRAP_ORG_NAME: App Access local qualification
      TUNNEX_BOOTSTRAP_GATEWAY_NAME: aa0-gateway
      TUNNEX_BOOTSTRAP_GATEWAY_TOKEN_SHA256: ${AA0_JOIN_HASH}
      TUNNEX_AI_VPN_AUTO: 'false'
      TUNNEX_AI_PROVIDER_MANAGEMENT_ENABLED: 'false'
      APP_BASE_URL: http://localhost:18083
      TUNNEX_APP_ACCESS_BASE_DOMAIN: apps.fixture.test
      TUNNEX_APP_ACCESS_RESTORE_MARKER: /owned-app-restore/app-access.pending.json
      TUNNEX_GATEWAY_CONTROL_URL: https://api:8443
    volumes: [./.runtime/bin:/binaries:ro, api_state:/state, ./.runtime/app-restore:/owned-app-restore:ro]
    ports: [127.0.0.1:18083:8080, 127.0.0.1:18446:8443]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/healthz]
      interval: 2s
      timeout: 2s
      retries: 60
  gateway:
    image: tunnex-gateway-qualification:local
    entrypoint: [/bin/sh, -ec]
    command: ["ip link show wg0 >/dev/null 2>&1 || ip link add wg0 type wireguard; ip address replace 100.100.0.1/24 dev wg0; ip link set wg0 up; exec /binaries/tunnex-node"]
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: 1
    environment:
      TUNNEX_API_URL: http://api:8080
      TUNNEX_AGENT_URL: https://api:8443
      TUNNEX_AGENT_SERVERNAME: tunnex-control
      TUNNEX_APP_ACCESS_CONTROL_URL: https://app-access-fixture:18447
      TUNNEX_APP_PROXY_URL: https://app-proxy-fixture:18449
      TUNNEX_JOIN_TOKEN: ${AA0_JOIN_TOKEN}
      TUNNEX_NODE_NAME: aa0-gateway
      TUNNEX_NODE_STATE_DIR: /state
      TUNNEX_WG_BACKEND: wgctrl
      TUNNEX_AI_VPN_AUTO: 'false'
      TUNNEX_FLOWLOG_GROUP: '0'
    volumes: [./.runtime/bin:/binaries:ro, gateway_state:/state]
    ports: [127.0.0.1:19093:9091]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:9091/readyz]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres_data:
    external: true
    name: tunnex-app-access-aa0-1003_postgres_data
  redis_data:
    external: true
    name: tunnex-app-access-aa0-1003_redis_data
  api_state:
    external: true
    name: tunnex-app-access-aa0-1003_api_state
  gateway_state:
    external: true
    name: tunnex-app-access-aa0-1003_gateway_state
networks:
  default:
    external: true
    name: tunnex-app-access-aa0-1003_default
