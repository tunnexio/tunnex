name: tunnexs2sbgplocal1007
services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: bgplocal
      POSTGRES_PASSWORD: ${BGPLOCAL_DB_PASSWORD:?run prepare.sh}
      POSTGRES_DB: bgplocal
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U bgplocal -d bgplocal]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
  api:
    image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    command: [/binaries/tunnex-api]
    environment:
      TUNNEX_ENV: development
      DATABASE_URL: postgres://bgplocal:${BGPLOCAL_DB_PASSWORD}@postgres:5432/bgplocal?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      TUNNEX_AUTO_MIGRATE: 'true'
      TUNNEX_SECRETS_DIR: /state
      TUNNEX_ADMIN_EMAIL: admin@bgp.local
      TUNNEX_BOOTSTRAP_ORG_NAME: IPsec BGP local qualification
      TUNNEX_BOOTSTRAP_GATEWAY_NAME: bgp-local-gateway
      TUNNEX_BOOTSTRAP_GATEWAY_TOKEN_SHA256: ${BGPLOCAL_JOIN_HASH}
      TUNNEX_AI_VPN_AUTO: 'false'
      TUNNEX_AI_PROVIDER_MANAGEMENT_ENABLED: 'false'
      APP_BASE_URL: http://localhost:18283
      TUNNEX_GATEWAY_CONTROL_URL: https://api:8443
    volumes: [./.runtime/bin:/binaries:ro, api_state:/state]
    ports: [127.0.0.1:18283:8080, 127.0.0.1:18646:8443]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/healthz]
      interval: 2s
      timeout: 2s
      retries: 60
  gateway:
    image: ${BGPLOCAL_NODE_IMAGE:?run prepare.sh}
    entrypoint: [/bin/sh, -ec]
    command: ["ip link show wg0 >/dev/null 2>&1 || ip link add wg0 type wireguard; ip address replace 100.100.0.1/24 dev wg0; ip link set wg0 up; exec /binaries/tunnex-node"]
    cap_add: [NET_ADMIN, NET_RAW]
    devices: [/dev/net/tun:/dev/net/tun]
    sysctls:
      net.ipv4.ip_forward: 1
    environment:
      TUNNEX_API_URL: http://api:8080
      TUNNEX_AGENT_URL: https://api:8443
      TUNNEX_AGENT_SERVERNAME: tunnex-control
      TUNNEX_JOIN_TOKEN: ${BGPLOCAL_JOIN_TOKEN}
      TUNNEX_NODE_NAME: bgp-local-gateway
      TUNNEX_NODE_STATE_DIR: /state
      TUNNEX_WG_BACKEND: wgctrl
      TUNNEX_AI_VPN_AUTO: 'false'
      TUNNEX_FLOWLOG_GROUP: '0'
    volumes: [./.runtime/bin:/binaries:ro, gateway_state:/state]
    ports: [127.0.0.1:19293:9091]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:9091/readyz]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres_data:
    external: true
    name: tunnexs2sbgplocal1007_postgres_data
  redis_data:
    external: true
    name: tunnexs2sbgplocal1007_redis_data
  api_state:
    external: true
    name: tunnexs2sbgplocal1007_api_state
  gateway_state:
    external: true
    name: tunnexs2sbgplocal1007_gateway_state
networks:
  default:
    external: true
    name: tunnexs2sbgplocal1007_default
