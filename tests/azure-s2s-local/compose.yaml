name: tunnexazures2slocal1010
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: azures2s
      POSTGRES_PASSWORD: ${AZURE_DB_PASSWORD:?run prepare.py}
      POSTGRES_DB: azures2s
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: [127.0.0.1:45440:5432]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U azures2s -d azures2s]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
  api:
    image: alpine:3.24.2
    command: [/binaries/tunnex-api]
    environment:
      TUNNEX_ENV: development
      DATABASE_URL: postgres://azures2s:${AZURE_DB_PASSWORD}@postgres:5432/azures2s?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      TUNNEX_AUTO_MIGRATE: 'true'
      TUNNEX_SECRETS_DIR: /state
      TUNNEX_ADMIN_EMAIL: admin@azure-s2s.local
      TUNNEX_BOOTSTRAP_ORG_NAME: Azure site-to-site local qualification
      TUNNEX_AI_VPN_AUTO: 'false'
      TUNNEX_AI_PROVIDER_MANAGEMENT_ENABLED: 'false'
      APP_BASE_URL: http://localhost:45173
      TUNNEX_GATEWAY_CONTROL_URL: https://api:8443
    volumes: [./.runtime/bin:/binaries:ro, api_state:/state]
    ports: [127.0.0.1:48083:8080, 127.0.0.1:48446:8443]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/healthz]
      interval: 2s
      timeout: 2s
      retries: 60
volumes:
  postgres_data:
  redis_data:
  api_state:
