# Merge these maps into openapi/openapi.yaml after the saved-key worker finishes.
paths:
  /api/v1/organizations/{orgId}/sandbox-delegation-settings:
    parameters:
      - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: updateSandboxDelegationSettings
      tags: [sandboxes]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      description: Verified human owner/admin opt-in only. Does not enable a runtime or mint credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties: { enabled: { type: boolean } }
      responses:
        '204': { description: Organization opt-in updated }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/organizations/{orgId}/sandbox-delegations:
    parameters:
      - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: issueSandboxDelegation
      tags: [sandboxes]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      description: Verified human owner/admin grants bounded lifecycle authority to their existing owned machine credential.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SandboxDelegationCreate' }
      responses:
        '201':
          description: Immutable grant; no credential secret is returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxDelegation' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/organizations/{orgId}/sandbox-delegations/{delegationId}:
    parameters:
      - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: delegationId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: revokeSandboxDelegation
      tags: [sandboxes]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      description: Verified human owner/admin revocation atomically requests deletion of retained grant-created workloads; physical network/provider cleanup remains pending. Human cleanup remains authorized.
      responses:
        '204': { description: Grant revoked; repeat revocation is harmless }
        default: { $ref: '#/components/responses/Error' }
components:
  schemas:
    SandboxDelegationCreate:
      type: object
      additionalProperties: false
      required: [machine_id, template_id, max_ttl_seconds, max_active, maximum_scope, skill_revision_ids, expires_at]
      properties:
        machine_id: { type: string, format: uuid }
        template_id: { type: string, format: uuid }
        max_ttl_seconds: { type: integer, minimum: 300, maximum: 900 }
        max_active: { type: integer, minimum: 1, maximum: 2, description: Further bounded by existing owner/org/runtime quota. }
        maximum_scope: { type: array, maxItems: 64, items: { $ref: '#/components/schemas/SandboxScope' } }
        skill_revision_ids: { type: array, maxItems: 32, uniqueItems: true, items: { type: string, format: uuid } }
        expires_at: { type: string, format: date-time }
    SandboxDelegation:
      type: object
      required: [id, organization_id, owner_id, machine_id, template_id, max_ttl_seconds, max_active, maximum_scope, skill_revision_ids, expires_at]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        organization_id: { type: string, format: uuid, readOnly: true }
        owner_id: { type: string, format: uuid, readOnly: true }
        machine_id: { type: string, format: uuid }
        template_id: { type: string, format: uuid }
        max_ttl_seconds: { type: integer, minimum: 300, maximum: 900 }
        max_active: { type: integer, minimum: 1, maximum: 2 }
        maximum_scope: { type: array, items: { $ref: '#/components/schemas/SandboxScope' } }
        skill_revision_ids: { type: array, items: { type: string, format: uuid } }
        expires_at: { type: string, format: date-time }
