            }
          },
          "max_duration_seconds": {
            "type": "integer",
            "minimum": 60,
            "maximum": 86400
          },
          "max_shares": {
            "type": "integer",
            "minimum": 1,
            "maximum": 25
          },
          "require_mfa": {
            "type": "boolean"
          },
          "confirm_end_active_shares": {
            "type": "boolean",
            "default": false
          },
          "open_for_all_users": {
            "type": "boolean",
            "description": "Enable organization-wide self-service publishing and reviewer selection. Omission preserves the saved mode for older clients."
