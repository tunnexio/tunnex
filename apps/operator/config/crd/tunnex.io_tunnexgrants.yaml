---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.1
  name: tunnexgrants.tunnex.io
spec:
  group: tunnex.io
  names:
    kind: TunnexGrant
    listKind: TunnexGrantList
    plural: tunnexgrants
    singular: tunnexgrant
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.subject
      name: Subject
      type: string
    - jsonPath: .spec.service
      name: Service
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TunnexGrant is an access grant reaching an exposed Service (enterprise).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TunnexGrantSpec declares an access grant that reaches an exposed Service (mirrors the CP's policy rule with
              dst_kind=k8s_service). ENTERPRISE — the CP gates it edition_required (403) in the open build; the operator
              surfaces that verbatim in status (never a silent no-op). The subject is a user/group/site/cidr — NEVER a
              workload (a pod is not a policy SUBJECT; workload-identity was ruled out of the epic, D4), which is why
              there is no TunnexPeer. The destination is referenced by its TunnexExposedService resource name.
            properties:
              expiresAt:
                description: |-
                  ExpiresAt makes this a TEMPORARY grant — the CP deletes it (audited) when it lapses. Omit for a
                  permanent grant.
                format: date-time
                type: string
              service:
                description: Service is the name of the TunnexExposedService this
                  grant reaches. Required.
                type: string
              subject:
                description: 'Subject identifies the principal: a user email / group
                  name / site name / CIDR, per SubjectKind.'
                type: string
              subjectKind:
                description: SubjectKind is the kind of principal being granted access.
                enum:
                - user
                - group
                - site
                - cidr
                type: string
            required:
            - service
            - subject
            - subjectKind
            type: object
          status:
            description: TunnexGrantStatus reflects the CP's accepted state — DERIVED
              truth, never spec.
            properties:
              conditions:
                description: |-
                  Conditions carry Ready + any CP refusal verbatim — notably edition_required when the org is open-edition
                  (governance is enterprise). HONEST status: never a silent no-op.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              ruleId:
                description: RuleID is the control-plane policy-rule id assigned on
                  creation.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
