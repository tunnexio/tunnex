# Tunnex GitOps operator — in-cluster Deployment (S10.2). Apply AFTER config/crd/ and config/rbac/role.yaml.
# The machine token is NOT here (it's a secret): create it at deploy time from a freshly-minted credential —
#   kubectl -n tunnex-system create secret generic tunnex-operator-credential --from-literal=token=tnxm_...
# Then set the two non-secret env values (CP url + org id) and the image tag (see docs/S10.2-boxwalk.md Leg 0).
apiVersion: v1
kind: Namespace
metadata:
  name: tunnex-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tunnex-operator
  namespace: tunnex-system
---
# Binds the tunnex-operator ClusterRole (config/rbac/role.yaml — get/list/watch/update/patch on the 3 CRDs +
# their status; NOTHING else) to the operator's ServiceAccount. The operator holds NO data-plane privilege and
# no cluster-admin — its only power over Tunnex is the machine bearer, and its only k8s power is its own CRs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tunnex-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tunnex-operator
subjects:
  - kind: ServiceAccount
    name: tunnex-operator
    namespace: tunnex-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunnex-operator
  namespace: tunnex-system
  labels: { app: tunnex-operator }
spec:
  replicas: 1
  selector:
    matchLabels: { app: tunnex-operator }
  template:
    metadata:
      labels: { app: tunnex-operator }
    spec:
      serviceAccountName: tunnex-operator
      securityContext:
        runAsNonRoot: true
      containers:
        - name: operator
          # Set the tag to the branch-sha build at deploy time (kubectl set image) — the provenance census.
          image: tunnex-operator:REPLACE_IMAGE_TAG
          imagePullPolicy: IfNotPresent # local ctr-imported image; never reaches a registry
          env:
            - name: TUNNEX_CP_URL
              value: "https://REPLACE_CP_URL" # the enterprise control plane the operator manages
            - name: TUNNEX_ORG_ID
              value: "REPLACE_ORG_ID"
            - name: TUNNEX_MACHINE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tunnex-operator-credential
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 128Mi }
