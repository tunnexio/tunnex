# Private execution engine preparation; no providers or tenant keys bootstrap here.
model_list: []
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  store_prompts_in_spend_logs: false
  # Provision schema explicitly, never reconcile it during normal server startup.
  disable_prisma_schema_update: true
  enforce_fallback_model_access: true
litellm_settings:
  turn_off_message_logging: true
  set_verbose: false
  json_logs: true
  success_callback: []
  failure_callback: []
  cache: false
router_settings:
  num_retries: 0

