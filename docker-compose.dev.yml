# Local development overrides. Email delivery is deliberately not bundled; configure a real SMTP endpoint
# in `.env` when exercising invitation, verification, or reset flows.

name: tunnex

services:
  api:
    environment:
      SMTP_FROM: ${SMTP_FROM:-tunnex@localhost}
      # Server Access stays opt-in, including during local development.
      TUNNEX_SERVER_ACCESS_ENABLED: ${TUNNEX_SERVER_ACCESS_ENABLED:-false}
